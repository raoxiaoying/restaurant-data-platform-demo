/* Shared blue product theme: clear surfaces, compact controls and quiet chrome. */
:root {
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --blue-soft: #eaf1ff;
  --ink: #20293a;
  --muted: #66758a;
  --line: #d8dee8;
  --canvas: #f4f5f7;
  --green: #168167;
  --orange: #b57822;
  --red: #cf504c;
  --shadow: none;
  --control-line: #cbd3df;
  --surface-muted: #f8f9fb;
  --selected-line: #b8ccf5;
  --header-height: 64px;
}
body { color: var(--ink); background: var(--canvas); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font-family: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a, input, select, textarea, summary { outline-offset: 2px; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); }
input[type=checkbox], input[type=radio] { accent-color: var(--blue); }
input::placeholder, textarea::placeholder { color: #8893a3; }
h1 { font-size: 25px; font-weight: 650; letter-spacing: -.5px; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 600; }
.icon { stroke-width: 1.8; }

/* Navigation stays visible while the report workspace changes. */

.common-defaults-head { background: #f1f3f6; color: #5d6a7f; }

/* Data shelf and data engine share the same administration frame. */
.basic-settings { min-height: calc(100vh - var(--header-height)); gap: 16px; padding: 16px; background: var(--canvas); }

.form-section { margin-bottom: 26px; }

.publishing-theme-table-wrap, .publishing-globals, .form-field #publishing-tags { border-color: var(--line); border-radius: 6px; }

/* Update and editor dialogs use an anchored header, body and action area. */

.drawer { box-shadow: -8px 0 32px #17243d18; }

function industryTrend(spec){
  const sum=xs=>xs.reduce((a,b)=>a+b,0);
  const round=v=>Math.round(v*100)/100;
  const weekly=spec.daily;
  const weights=spec.weights;
  const aggregate=(values,denominators)=>spec.aggregate==='sum'?sum(values):sum(values.map((v,i)=>v*denominators[i]))/sum(denominators);
  const bins=[[0,2],[2,4],[4,7]];
  const tail=bins.map(([a,b])=>aggregate(weekly.slice(a,b),weights?.daily.slice(a,b)));
  const month=[...spec.early,...tail].map(round);
  const weekTotal=aggregate(weekly,weights?.daily);
  const monthWeights=weights?[...weights.early,...bins.map(([a,b])=>sum(weights.daily.slice(a,b)))]:null;

function industryDashboard(role,industry=state.industry){

  <script>
'use strict';
// 查询维度仅用于原型交互；真实组织和授权由服务端提供。

const boardQueryLabels={brand:{},market:{},store:{}};
const boardCurrentYear=new Date().getFullYear();
const boardQueryYears=Array.from({length:Math.max(2026,boardCurrentYear)-Math.min(2025,boardCurrentYear-1)+1},(_,i)=>String(Math.min(2025,boardCurrentYear-1)+i));
function defaultBoardPeriod(){return {period:'week',yearStart:'2026',yearEnd:'2026'}}
function defaultBoardYearRange(){return {period:'range',yearStart:String(boardCurrentYear-1),yearEnd:String(boardCurrentYear)}}
// 演示数据截至 10/15；本季度与本月同从 10/01 起算，年度缺少 1–9 月样例。
const boardPeriods={
  week:{label:'近 7 天',start:'2026-10-09',end:'2026-10-15',sample:0},
  month:{label:'本月',start:'2026-10-01',end:'2026-10-15',sample:1},
  quarter:{label:'本季度',start:'2026-10-01',end:'2026-10-15',sample:1},
  year:{label:'本年度',start:'2026-01-01',end:'2026-10-15',sample:null},
  range:{label:'年度区间',sample:null}
};
function boardPeriod(period=state.period,query=state){
  const start=query.yearStart||'2026',end=query.yearEnd||'2026';
  if(period==='range'||period==='year'&&(start!=='2026'||end!=='2026'))return {label:'年度区间',start:start+'-01-01',end:end==='2026'?boardPeriods.year.end:end+'-12-31',sample:null};
  return boardPeriods[period]||boardPeriods.week;
}
function boardPeriodLabel(period=state.period,query=state){const p=boardPeriod(period,query),full=p.label==='年度区间';return `${p.label} · ${full?p.start.replaceAll('-','/'):p.start.slice(5).replace('-','/')} – ${full?p.end.replaceAll('-','/'):p.end.slice(5).replace('-','/')}`}
function hasBoardPeriodData(){return boardPeriod().sample!==null}
function boardQueryDimensions(d,selection){
  const role=d.role||state.role,industry=d.industry||state.industry;
  if(role==='store'){
    const parts=industryDashboard('store',industry).scope.split('·').map(x=>x.trim());
    return {brand:[['all',parts.find(x=>x.includes('品牌'))||'本店品牌']],market:[['all','本店所属市场']],store:[['all',parts.find(x=>x.includes('门店'))||'本店']]};
  }
  const brands=(industry==='multi'?industryDefinitions.filter(x=>x.id!=='multi'):industryDefinitions.filter(x=>x.id===industry)).map(x=>[x.id+'-brand',x.name+'示例品牌']);
  const markets=role==='region'?[['all','示例市场 A']]:[['all','全部市场'],['market-a','示例市场 A'],['market-b','示例市场 B']];
  const shops=brands.flatMap(([brand,name])=>['a','b','c'].filter(x=>role!=='region'||x!=='c').map((x,i)=>({id:brand+'-store-'+x,brand,market:x==='c'?'market-b':'market-a',name:(industry==='multi'?name+' · ':'')+'示例门店 '+String.fromCharCode(65+i)})));
  return {brand:[['all','全部品牌'],...brands],market:markets,store:[['all','全部门店'],...shops.filter(x=>(selection.brand==='all'||x.brand===selection.brand)&&(selection.market==='all'||x.market===selection.market)).map(x=>[x.id,x.name])]};
}
function normalizeBoardQuery(query,d=boardQueryContext){
  const defaults=defaultBoardPeriod(),q={brand:query.brand||'all',market:query.market||'all',store:query.store||'all',period:Object.keys(boardPeriods).includes(query.period)?query.period:defaults.period,yearStart:boardQueryYears.includes(query.yearStart)?query.yearStart:defaults.yearStart,yearEnd:boardQueryYears.includes(query.yearEnd)?query.yearEnd:defaults.yearEnd};
  if(q.yearStart>q.yearEnd)q.yearEnd=q.yearStart;
  if(q.period==='year'&&(q.yearStart!=='2026'||q.yearEnd!=='2026'))q.period='range';
  if(q.period!=='range')q.yearStart=q.yearEnd='2026';
  for(const key of ['brand','market','store'])if(!boardQueryDimensions(d,q)[key].some(x=>x[0]===q[key]))q[key]='all';
  return q;
}
function syncBoardQuery(d){
  const key=[state.industry,state.role,d.role||state.role].join(':');boardQueryContext=d;
  boardQueryKey=key;
  if(!boardQueryDirty)boardQueryDraft={...normalizeBoardQuery(state,d),brand:state.brand,market:state.market,store:state.store};
  const dims=boardQueryDimensions(d,boardQueryDraft);
  for(const key of ['brand','market','store'])for(const [value,label] of dims[key])boardQueryLabels[key][value]=label;
}
function boardQueryIncompatible(q=state,d=boardQueryContext){if(!d)return [];const dims=boardQueryDimensions(d,q);return ['brand','market','store'].filter(key=>q[key]&&q[key]!=='all'&&!dims[key].some(x=>x[0]===q[key]))}

function dashboardQueryFilters(d){

  return `<section class="dashboard-query card" role="search" aria-label="看板查询">${[['brand','品牌'],['market','市场'],['store','门店']].map(([key,label])=>`<label class="query-field query-${key}"><span>${label}</span><select data-board-query="${key}" aria-label="查询${label}" ${dims[key].length===1?'disabled':''}>${options(dims[key],boardQueryDraft[key])}</select></label>`).join('')}<div class="query-field query-years"><span>年度</span><div class="query-year-range"><select data-board-query="yearStart" aria-label="查询起始年度">${options(boardQueryYears.map(year=>[year,year+' 年']),boardQueryDraft.yearStart)}</select><span>至</span><select data-board-query="yearEnd" aria-label="查询结束年度">${options(boardQueryYears.map(year=>[year,year+' 年']),boardQueryDraft.yearEnd)}</select></div></div><label class="query-field query-period"><span>期间</span><span class="query-date">${icon('calendar')}<select data-board-query="period" aria-label="查询期间">${options(Object.keys(boardPeriods).map(id=>[id,id==='range'?`年度区间 · ${range.yearStart}年 – ${range.yearEnd}年`:boardPeriodLabel(id,{yearStart:'2026',yearEnd:'2026'})]),boardQueryDraft.period)}</select></span></label><div class="query-actions"><button type="button" class="btn primary" data-action="board-query-apply">查询</button><button type="button" class="btn" data-action="board-query-reset">重置</button></div></section>`;
}
function changeBoardQuery(key,value){

  if(key==='period'){if(value==='range')Object.assign(boardQueryDraft,defaultBoardYearRange());else boardQueryDraft.yearStart=boardQueryDraft.yearEnd='2026'}
  if(key==='yearStart'||key==='yearEnd')boardQueryDraft.period='range';
  let message='';
  if(key==='yearStart'&&boardQueryDraft.yearStart>boardQueryDraft.yearEnd){boardQueryDraft.yearEnd=boardQueryDraft.yearStart;message='结束年度已同步调整。'}
  if(key==='yearEnd'&&boardQueryDraft.yearEnd<boardQueryDraft.yearStart){boardQueryDraft.yearStart=boardQueryDraft.yearEnd;message='起始年度已同步调整。'}
  const retained={...boardQueryDraft};boardQueryDraft=normalizeBoardQuery(boardQueryDraft);
  for(const field of ['brand','market','store'])if(field!==key&&!(key==='brand'&&['market','store'].includes(field))&&!(key==='market'&&field==='store'))boardQueryDraft[field]=retained[field];
  boardQueryDirty=true;render();
  if(key==='yearStart'||key==='yearEnd'){if(boardQueryDraft.yearStart!=='2026')message+=boardQueryDraft.yearEnd==='2026'?'所选年度按年度累计查询，2026 年截至 10/15。':'所选年度按全年查询。';if(message)notify(message)}

  <script>
'use strict';
// 业态分析样例：展示业务关系与管理判断；数值不是企业实测或行业基准。
window.IndustryInsights={};
function industryInsightSpec(d){return window.IndustryInsights[d.industry]?.[d.role]}
function insightNumber(value){return Number(value).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function insightLabelLines(label,x,y){return String(label).match(/.{1,9}/gu).slice(0,3).map((line,i)=>`<text x="${x}" y="${y+i*14}" text-anchor="middle">${esc(line)}</text>`).join('')}
function insightTable(p){
  const heads=p.type==='matrix'?['维度',...p.columns.map(c=>c.label+(c.unit?'（'+c.unit+'）':''))]:p.type==='scatter'?['维度',p.xLabel+'（'+p.xUnit+'）',p.yLabel+'（'+p.yUnit+'）']:['环节 / 维度',p.unit?'数值（'+p.unit+'）':'数值'];
  return `<div class="insight-table-scroll"><table class="table insight-data-table"><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${p.rows.map(r=>`<tr><td>${esc(r.label)}</td>${(p.type==='matrix'?r.values:p.type==='scatter'?[r.x,r.y]:[r.value]).map(v=>`<td>${insightNumber(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function insightMatrix(p){
  const extents=p.columns.map((c,i)=>{const values=p.rows.map(r=>r.values[i]);return [Math.min(...values),Math.max(...values)]});
  return `<div class="insight-table-scroll"><table class="insight-matrix"><thead><tr><th>分析维度</th>${p.columns.map(c=>`<th>${esc(c.label)}<small>${esc(c.unit)}</small></th>`).join('')}</tr></thead><tbody>${p.rows.map(r=>`<tr><th scope="row">${esc(r.label)}</th>${r.values.map((v,i)=>{const [min,max]=extents[i],weight=max===min ? .35 : (v-min)/(max-min);return `<td><span style="background:rgba(49,111,225,${(.04+weight*.13).toFixed(3)})">${insightNumber(v)}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="insight-legend">色深仅表示同列数值大小</p>`;
}
function insightBars(p){
  const min=Math.min(0,...p.rows.map(r=>r.value)),max=Math.max(0,...p.rows.map(r=>r.value)),range=max-min||1,zero=-min/range*100;
  return `<div class="insight-bars">${p.rows.map(r=>`<div class="insight-bar-row"><span>${esc(r.label)}</span><div class="insight-bar-track"><i class="insight-zero" style="left:${zero}%"></i><i class="insight-bar ${r.value<0?'negative':''}" style="left:${(Math.min(0,r.value)-min)/range*100}%;width:${Math.abs(r.value)/range*100}%"></i></div><strong>${insightNumber(r.value)}<small>${esc(p.unit||'')}</small></strong></div>`).join('')}</div>`;
}
function insightFlow(p){
  const first=p.rows[0].value;
  return `<div class="insight-flow">${p.rows.map((r,i)=>`<div class="insight-flow-step"><div><span>${i+1}</span><strong>${esc(r.label)}</strong><b>${insightNumber(r.value)} <small>${esc(p.unit||'')}</small></b></div><div class="insight-flow-track"><i style="width:${first?r.value/first*100:0}%"></i></div><p>${i?'较上一步减少 '+insightNumber(p.rows[i-1].value-r.value)+esc(p.unit||''):'同一观察队列'}<span>占起点 ${first?(r.value/first*100).toFixed(1):'—'}%</span></p></div>`).join('')}</div>`;
}
function insightBridge(p){
  let total=0;
  const steps=p.rows.map(r=>{const before=r.kind==='total'?0:total;total=r.kind==='total'?r.value:total+r.value;return {...r,before,after:total}});
  const min=Math.min(0,...steps.flatMap(r=>[r.before,r.after])),max=Math.max(0,...steps.flatMap(r=>[r.before,r.after])),range=max-min||1;
  const y=v=>190-(v-min)/range*145,width=520/steps.length;
  return `<svg class="insight-svg insight-bridge" viewBox="0 0 600 260" role="img" aria-label="${esc(p.title)}，${esc(p.unit||'')}"><text x="40" y="17">单位：${esc(p.unit||'')}</text>${[min,(min+max)/2,max].map(v=>`<line x1="40" x2="570" y1="${y(v)}" y2="${y(v)}" class="insight-gridline"/><text x="34" y="${y(v)+4}" text-anchor="end">${insightNumber(v)}</text>`).join('')}${steps.map((r,i)=>{const x=48+i*width,top=Math.min(y(r.before),y(r.after)),height=Math.max(2,Math.abs(y(r.before)-y(r.after))),fill=r.kind==='total'?'#3977e9':r.value>=0?'#39a68f':'#e4a15b';return `${i?`<line x1="${x-width+width*.64}" x2="${x}" y1="${y(steps[i-1].after)}" y2="${y(steps[i-1].after)}" class="insight-connector"/>`:''}<rect x="${x}" y="${top}" width="${width*.64}" height="${height}" rx="3" fill="${fill}"><title>${esc(r.label)}：${insightNumber(r.value)} ${esc(p.unit||'')}</title></rect><text class="insight-value" x="${x+width*.32}" y="${Math.max(31,top-7)}" text-anchor="middle">${r.kind==='delta'&&r.value>0?'+':''}${insightNumber(r.value)}</text>${insightLabelLines(r.label,x+width*.32,218)}`}).join('')}</svg>`;
}
function insightScatter(p){
  const xs=p.rows.map(r=>r.x),ys=p.rows.map(r=>r.y),minX=Math.min(0,...xs),maxX=Math.max(1,...xs)*1.15,minY=Math.min(0,...ys),maxY=Math.max(1,...ys)*1.2;
  const x=v=>65+(v-minX)/(maxX-minX)*465,y=v=>190-(v-minY)/(maxY-minY)*145,colors=['#3977e9','#39a68f','#e4a15b','#9277d6','#47a8bd'];
  return `<svg class="insight-svg insight-scatter" viewBox="0 0 600 260" role="img" aria-label="${esc(p.title)}"><text x="65" y="17">${esc(p.yLabel)}（${esc(p.yUnit)}）</text>${[0,.5,1].map(t=>{const xv=minX+(maxX-minX)*t,yv=minY+(maxY-minY)*t;return `<line x1="65" x2="530" y1="${y(yv)}" y2="${y(yv)}" class="insight-gridline"/><text x="56" y="${y(yv)+4}" text-anchor="end">${insightNumber(yv)}</text><text x="${x(xv)}" y="213" text-anchor="middle">${insightNumber(xv)}</text>`}).join('')}<line x1="65" x2="65" y1="40" y2="190" class="insight-gridline"/><text x="530" y="244" text-anchor="end">${esc(p.xLabel)}（${esc(p.xUnit)}）</text>${p.rows.map((r,i)=>`<circle cx="${x(r.x)}" cy="${y(r.y)}" r="7" fill="${colors[i%5]}" stroke="white" stroke-width="2"><title>${esc(r.label)}：${esc(p.xLabel)} ${r.x}${esc(p.xUnit)}，${esc(p.yLabel)} ${r.y}${esc(p.yUnit)}</title></circle>`).join('')}</svg><div class="insight-point-legend">${p.rows.map((r,i)=>`<span><i style="background:${colors[i%5]}"></i>${esc(r.label)}</span>`).join('')}</div>`;
}
function industryInsights(d){
  const spec=industryInsightSpec(d);if(!spec)return '';
  const charts={bars:insightBars,matrix:insightMatrix,flow:insightFlow,bridge:insightBridge,scatter:insightScatter};
  return `<section class="industry-insights"><div class="board-section-title"><h2>${esc(spec.focus)}</h2><span>业务分析</span></div><div class="insight-grid">${spec.panels.map(p=>`<article class="card insight-card" data-insight="${esc(p.id)}"><div class="insight-card-head"><div><h3>${esc(p.title)}</h3><p>${esc(p.question)}</p></div></div><div class="insight-visual">${charts[p.type](p)}</div><p class="insight-scope">${esc(p.note.replace(/固定样例\s*[·•]?\s*/g,''))}</p></article>`).join('')}</div></section>`;
}
function industryInsightDetail(pageId,id){
  const d=dashboardForPage({id:pageId}),p=d&&industryInsightSpec(d)?.panels.find(p=>p.id===id);if(!p)return;
  showOverlay(`${drawerHead(p.title,p.note)}<div class="drawer-body"><div class="fact-card"><h3>${esc(p.question)}</h3><p>${esc(p.insight)}</p></div>${insightTable(p)}<div class="fact-card insight-action"><h3>建议核实与行动</h3><p>${esc(p.action)}</p></div><div class="fact-card"><h3>指标口径</h3><p>${esc(p.definition)}</p></div><div class="fact-card"><h3>数据要求</h3><p>${esc(p.source)}</p></div></div><div class="drawer-footer">${btn('关闭','close')}</div>`,'wide','业务分析');
}

  return qbiResources().filter(p=>(!qbiState.folder||p.category===qbiState.folder)&&(!qbiState.search||p.name.toLowerCase().includes(qbiState.search.toLowerCase()))&&(!qbiState.mine||p.ownedByCurrentUser===true)&&(!qbiState.favorites||p.favorite)).sort((a,b)=>qbiState.sort==='name'?a.name.localeCompare(b.name,'zh-CN'):b.updated.localeCompare(a.updated));

function qbiFolderIcon(){return '<svg class="qbi-folder-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffb400" d="M2 5a2 2 0 0 1 2-2h6l2 3h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/><path fill="#ffce55" d="M2 7h20v3H2z"/></svg>'}

t id="qbi-sort" class="qbi-button" aria-label="Quick BI 排序">${options([['updated','默认排序'],['name','名称排序']],qbiState.sort)}</select><button class="qbi-button" disabled title="创作能力尚未接入">新建文件夹</button><button class="qbi-button primary" disabled title="创作能力尚未接入">新建仪表板</button></div>`:''}</div>${dashboard&&qbiState.filter?`<div class="qbi-filter-panel"><span>资源筛选</span><label><input type="checkbox" id="qbi-favorites" ${qbiState.favorites?'checked':''}>仅看已收藏</label><button data-qbi="clear">清除条件</button></div>`:''}<div class="qbi-content">${qbiList()}</div></section></div></main>`;

document.addEventListener('click',e=>{

function qbiSearchInput(e){

document.addEventListener('change',e=>{
  const el=e.target;

  <script>
'use strict';
// 演示依赖关系：适配器包含模型；业务主题可跨多个适配器使用模型。
const dataSources=[
  {id:'pos',name:'POS 系统',models:[['orders','订单明细'],['items','菜品销售'],['payments','收款流水']]},
  {id:'delivery',name:'外卖平台',models:[['delivery-orders','外卖订单'],['settlements','平台结算']]},
  {id:'member',name:'会员系统',models:[['members','会员档案'],['coupons','优惠券核销']]},
  {id:'supply',name:'供应链系统',models:[['inventory','库存流水'],['cost','食材成本']]},
  {id:'workforce',name:'人事系统',models:[['staff','员工档案'],['shifts','排班工时']]}
].map(s=>({...s,updated:'2026-10-27 09:30',inputRevisions:Object.fromEntries(s.models.map(([id])=>[id,1]))}));
const dataModels=dataSources.flatMap(s=>s.models.map(([id,name])=>({id,name,sourceId:s.id,revision:1,updated:'2026-10-27 09:30',pulledAt:'2026-10-27 09:20',cutoff:'2026-10-15'})));
const dataThemes=[
  {id:'sales',name:'交易与营业',description:'销售、客流、客单与渠道',modelIds:['orders','payments','delivery-orders']},
  {id:'marketing',name:'会员与营销',description:'会员消费、复购与活动核销',modelIds:['orders','members','coupons']},
  {id:'costing',name:'库存与成本',description:'菜品成本、库存与损耗',modelIds:['items','inventory','cost']},
  {id:'people',name:'人员与排班',description:'人员配置、工时与人效',modelIds:['orders','staff','shifts']},
  {id:'finance',name:'收支与结算',description:'收款、渠道结算与成本',modelIds:['payments','settlements','cost']}
].map(t=>({...t,updated:'2026-10-27 09:30',inputRevisions:Object.fromEntries(t.modelIds.map(id=>[id,1]))}));
const dataUpdateSteps=[['database','数据拉取','同步所选模型的来源数据'],['filter','数据清洗','校验、去重与标准化'],['settings','数据加工','计算指标并生成主题结果'],['check','数据已准备就绪','发布新的可用数据版本']];
const dataView={mode:'page',selected:[],expanded:null};
const dataUpdate={running:false,step:3,start:0,plan:null,completed:false,estimate:null,remainingEstimate:null,completedAt:null};
let dataUpdateRequest=null;
const dataModel=id=>dataModels.find(m=>m.id===id);
const dataModelIds=row=>row.modelIds||row.models.map(([id])=>id);
const dataChanged=row=>dataModelIds(row).filter(id=>row.inputRevisions[id]!==dataModel(id).revision);
function dataPage(){return state.page?pages.find(p=>p.id===state.page&&accessible(p)):resolveHome()}
function pageDataConfig(page){
  if(page&&Object.prototype.hasOwnProperty.call(page,'dataUpdate'))return {enabled:page.dataUpdate?.enabled===true,themeIds:Array.isArray(page.dataUpdate?.themeIds)?page.dataUpdate.themeIds.filter((id,index,ids)=>typeof id==='string'&&(!id||ids.indexOf(id)===index)):[]};
  const map={
    'boss-overview':['sales','marketing','costing','people','finance'],
    'hq-overview':['sales','marketing','costing','people'],
    'finance-overview':['sales','finance','costing'],
    'hr-overview':['people'],'brand-overview':['sales','marketing'],
    'region-overview':['sales','costing','people'],'store-workbench':['sales','costing','people'],
    'store-profit':['sales','costing','finance'],'marketing-campaign':['sales','marketing'],
    'supply-chain':['costing'],'member-profile':['marketing'],'joint-operation':['finance']
  };
  return {enabled:!!map[page?.id],themeIds:[...(map[page?.id]||[])]};
}
function pageDataThemes(page){const config=pageDataConfig(page);return config.enabled&&page?.nodeType!=='empty'?dataThemes.filter(t=>config.themeIds.includes(t.id)):[]}
function boardDataThemes(){return pageDataThemes(dataPage())}
function dataUnavailableMessage(){return !pageDataConfig(dataPage()).enabled?'该页面未启用数据状态与更新，请在基础设置 → 数据上架中启用并关联业务主题。':'该页面尚未关联有效的业务主题，请在基础设置 → 数据上架中完成配置。'}
function dataResources(){
  const themes=boardDataThemes();
  if(dataView.mode!=='source')return themes;
  const models=new Set(themes.flatMap(t=>t.modelIds));
  return dataSources.filter(s=>s.models.some(([id])=>models.has(id)));
}
function dataPlan(ids=dataView.selected,mode=dataView.mode){
  const rows=(mode==='source'?dataSources:dataThemes).filter(r=>ids.includes(r.id));
  const modelIds=[...new Set(rows.flatMap(dataModelIds))];
  const affected=dataThemes.filter(t=>t.modelIds.some(id=>modelIds.includes(id)));
  return {mode,pageId:dataPage()?.id,pageName:dataPage()?.name||'当前页面',ids:rows.map(r=>r.id),names:mode==='page'?[dataPage()?.name||'当前页面']:rows.map(r=>r.name),modelIds,
    sourceIds:dataSources.filter(s=>s.models.some(([id])=>modelIds.includes(id))).map(s=>s.id),
    publishIds:affected.filter(t=>t.modelIds.every(id=>modelIds.includes(id))).map(t=>t.id),
    partialIds:affected.filter(t=>!t.modelIds.every(id=>modelIds.includes(id))).map(t=>t.id)};
}
function selectedDataPlan(){return dataView.mode==='page'?dataPlan(boardDataThemes().map(t=>t.id),'page'):dataPlan(dataView.selected.filter(id=>dataResources().some(r=>r.id===id)))}
function changeDataView(mode){if(!['page','theme','source'].includes(mode))return;dataUpdateRequest=null;dataView.mode=mode;dataView.selected=[];dataView.expanded=null;refreshDataUpdateUI()}
function selectDataResource(id,checked){
  if(dataUpdate.running||dataView.mode==='page')return;
  const valid=dataResources().map(r=>r.id);
  if(id==='all')dataView.selected=checked?valid:[];
  else if(valid.includes(id))dataView.selected=checked?[...new Set([...dataView.selected,id])]:dataView.selected.filter(x=>x!==id);
  dataUpdateRequest=null;refreshDataUpdateUI();
}
function selectDataRow(id){if(dataUpdate.running||dataView.mode==='page'||!dataResources().some(r=>r.id===id))return;dataUpdateRequest=null;dataView.selected=[id];refreshDataUpdateUI()}
function dataTime(value){return `<time class="prep-time" datetime="${esc(value.replace(' ','T'))}">${esc(value.slice(5,10))}<strong>${esc(value.slice(11))}</strong></time>`}
function dataUpdateLabel(){
  const themes=boardDataThemes();
  if(!pageDataConfig(dataPage()).enabled)return '未启用数据更新';
  if(!themes.length)return '未配置数据依赖';
  if(dataUpdate.running)return dataUpdate.step===3?'数据发布中':dataUpdateSteps[dataUpdate.step][1]+'中';
  return themes.some(t=>dataChanged(t).length)?'数据可用 · 待同步':'数据已就绪';
}
function dataBoardUpdated(){return boardDataThemes().map(t=>t.updated).sort().at(-1)?.slice(11)||'—'}
function dataResourceStatus(row){
  const running=dataUpdate.running&&dataModelIds(row).some(id=>dataUpdate.plan.modelIds.includes(id));
  if(running){const full=dataModelIds(row).every(id=>dataUpdate.plan.modelIds.includes(id));return `<span class="prep-status active">${icon('refresh','data-update-spin')}${full?(dataUpdate.step===3?'发布中':dataUpdateSteps[dataUpdate.step][1]+'中'):(row.modelIds?'依赖更新中':'部分模型更新中')}</span><small>上次版本仍可用</small>`}
  const changed=dataChanged(row).length;
  return `<span class="prep-status ${changed?'partial':'ready'}"><i></i>${changed?(row.modelIds?'可用 · 待同步':changed===dataModelIds(row).length?'模型已分批更新':'部分模型已更新'):'已就绪'}</span>${changed?`<small>${row.modelIds?'保留上次可用版本':changed+' / '+dataModelIds(row).length+' 个模型已更新'}</small>`:''}`;
}
function dataModelDetails(row){
  const ids=dataModelIds(row),themes=dataThemes.filter(t=>t.modelIds.some(id=>ids.includes(id)));
  return `<div class="prep-detail"><div class="prep-detail-heading"><strong>关联模型 · ${ids.length} 个</strong><span>${row.modelIds?'由以下数据源共同提供':'适配器中的模型可被多个业务主题复用'}</span></div><table class="prep-model-table"><thead><tr><th>模型</th><th>数据源 / 适配器</th><th>业务主题</th><th>状态</th><th>更新时间</th><th>最近拉取</th></tr></thead><tbody>${ids.map(id=>{const m=dataModel(id),running=dataUpdate.running&&dataUpdate.plan.modelIds.includes(id);return `<tr><td>${m.name}</td><td>${dataSources.find(s=>s.id===m.sourceId).name}</td><td>${dataThemes.filter(t=>t.modelIds.includes(id)).map(t=>t.name).join('、')}</td><td><span class="prep-status ${running?'active':'ready'}">${running?'更新中':'已就绪'}</span></td><td>${dataTime(m.updated)}</td><td>${dataTime(m.pulledAt)}</td></tr>`}).join('')}</tbody></table><p>${row.modelIds?'按业务主题更新，会自动选取全部依赖模型，共享模型只执行一次。':'按数据源更新，会执行该适配器的全部模型。'} 关联主题：${themes.map(t=>t.name).join('、')}。</p></div>`;
}
function dataResourceTable(){
  const rows=dataResources(),selected=selectedDataPlan().ids,all=rows.length&&rows.every(r=>selected.includes(r.id));
  return `<div class="prep-table-scroll"><table class="source-table prep-resource-table"><thead><tr><th class="prep-check"><input type="checkbox" data-data-select="all" aria-label="全选当前列表" ${all?'checked':''} ${dataUpdate.running||dataView.mode==='page'?'disabled':''}></th><th>${dataView.mode!=='source'?'业务主题':'适配器（数据源）'}</th><th>${dataView.mode!=='source'?'关联适配器':'关联业务主题'}</th><th>数据截止</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows.map(row=>{
    const ids=dataModelIds(row),related=dataView.mode!=='source'?dataSources.filter(s=>s.models.some(([id])=>ids.includes(id))):dataThemes.filter(t=>t.modelIds.some(id=>ids.includes(id)));
    return `<tr class="${selected.includes(row.id)?'prep-selected':''}"><td class="prep-check"><input type="checkbox" data-data-select="${row.id}" aria-label="选择${row.name}" ${selected.includes(row.id)?'checked':''} ${dataUpdate.running||dataView.mode==='page'?'disabled':''}></td><td><strong>${row.name}</strong><small>${ids.length} 个模型${row.description?' · '+row.description:''}</small></td><td class="prep-related">${related.map(x=>`<span>${x.name}</span>`).join('')}</td><td class="no-wrap">2026-10-15</td><td class="prep-status-cell">${dataResourceStatus(row)}</td><td class="source-updated">${dataTime(row.updated)}</td><td class="prep-operations"><button class="prep-link" data-action="data-detail" data-id="${row.id}" aria-expanded="${dataView.expanded===row.id}">${dataView.expanded===row.id?'收起':'查看模型'}</button>${dataView.mode==='page'?'':`<button class="prep-link" data-action="data-row-update" data-id="${row.id}" ${dataUpdate.running?'disabled':''}>选择更新</button>`}</td></tr>${dataView.expanded===row.id?`<tr><td colspan="7" class="prep-detail-cell">${dataModelDetails(row)}</td></tr>`:''}`;
  }).join('')}</tbody></table></div>`;
}
function dataStageState(index){
  if(!dataUpdate.plan)return 'idle';
  if(index<dataUpdate.start)return 'reused';
  if(!dataUpdate.running||index<dataUpdate.step)return 'done';
  return index===dataUpdate.step?'processing':'pending';
}
function dataUpdateProgress(){
  const plan=dataUpdate.running?dataUpdate.plan:selectedDataPlan();
  return `<section class="prep-progress"><div class="prep-section-heading"><div><h3>${dataUpdate.running?'本次更新进度':dataUpdate.completed?'最近一次更新已完成':'更新流程'}</h3><p>${dataUpdate.plan?esc(dataUpdate.plan.pageName)+' · '+({page:'当前页面全部数据',source:'按适配器',theme:'按业务主题'}[dataUpdate.plan.mode])+(dataUpdate.plan.mode==='page'?'':' · '+dataUpdate.plan.names.join('、')):'选择更新范围后，可执行完整流程，也可从指定阶段重跑。'}${dataUpdate.completed&&dataUpdate.completedAt?' · 完成时间 '+dataDateTime(dataUpdate.completedAt):''}</p></div>${dataUpdate.plan?`<span class="chip ${dataUpdate.running?'blue':'green'}">${dataUpdate.running?'进行中':'已完成'}</span>`:''}</div><div class="prep-stages">${dataUpdateSteps.map(([i,title,description],n)=>{
    const status=dataStageState(n);
    return `<div class="prep-stage ${status}"><div class="prep-stage-title"><span class="prep-stage-number">${status==='done'?icon('check'):n+1}</span><strong>${title}</strong></div><p>${description}</p>${plan.modelIds.length?`<p class="prep-stage-estimate">${status==='reused'?'本次无需执行':'本阶段预计 '+dataEstimateDuration(demoDataStageEstimate(n))}</p>`:''}<div class="prep-stage-bottom"><span>${{idle:'',done:'已完成',processing:n===3?'发布中':'处理中',pending:'等待中',reused:'沿用上次结果'}[status]}</span>${btn(n===3?'重新发布':'从此重跑','data-stage-update',`data-id="${n}" ${dataUpdate.running||!plan.modelIds.length?'disabled':''}`,'small prep-rerun')}</div></div>`;
  }).join('')}</div><p class="prep-hint">阶段重跑作用于当前所选范围，从所选阶段执行至就绪；前置阶段沿用上次成功结果。重新发布不会拉取新数据。</p>${dataUpdate.running?`<div class="prep-running-note">${dataUpdateLabel()} · 更新期间继续使用上次可用版本。可关闭面板，更新将在后台继续。</div>`:''}</section>`;
}
function dataSelectionSummary(){
  const plan=dataUpdate.running?dataUpdate.plan:selectedDataPlan();
  const completed=!dataUpdate.running&&dataUpdate.completed&&JSON.stringify(plan)===JSON.stringify(dataUpdate.plan);
  const estimate=dataUpdate.running?dataUpdate.remainingEstimate:plan.modelIds.length?demoDataEstimate(0):null;
  let timing;
  if(completed)timing=`<div class="prep-timing-heading complete">${icon('check')}<strong>本次更新已完成</strong></div><p class="prep-completed-time">完成时间 <strong>${dataDateTime(dataUpdate.completedAt)}</strong></p>`;
  else if(!estimate)timing=`<div class="prep-timing-heading">${icon('clock')}<strong>更新时间预估</strong></div><p class="prep-timing-note">${boardDataThemes().length?'选择更新范围后显示时间预估':dataUnavailableMessage()}</p>`;
  else timing=`<div class="prep-timing-heading">${icon(dataUpdate.running?'refresh':'clock',dataUpdate.running?'data-update-spin':'')}<strong>${dataUpdate.running?'当前阶段 · '+dataUpdateLabel():'更新时间预估'}</strong></div><div class="prep-estimate-grid"><div><small>${dataUpdate.running?'预计剩余时间':'预计耗时'}</small><strong>${dataEstimateDuration(estimate)}</strong></div><div><small>预计完成时间</small><strong>${dataEstimateWindow(estimate)}</strong></div></div><p class="prep-timing-note">${dataUpdate.running?'随阶段推进更新预估，可关闭面板后继续查看。':'按现在开始估算，点击更新可确认执行。'}</p>`;
  return `<div class="prep-selection"><div class="prep-timing" role="status" aria-live="polite">${timing}</div>${btn(icon('refresh',dataUpdate.running?'data-update-spin':'')+(dataUpdate.running?'更新中…':plan.mode==='page'?'更新当前页面全部数据':'更新所选数据'),'data-run',`${dataUpdate.running||!plan.modelIds.length?'disabled':''} ${dataUpdate.running?'aria-busy="true"':''}`,'primary')}</div>`;
}
function dataOverview(){
  const themes=boardDataThemes(),ids=new Set(themes.flatMap(t=>t.modelIds));
  const sources=dataSources.filter(s=>s.models.some(([id])=>ids.has(id))),changed=themes.filter(t=>dataChanged(t).length);
  return `<div class="prep-overview"><div class="prep-overview-status">${icon('shield')}<div><strong>${!themes.length?dataUpdateLabel():changed.length?'当前版本可用，'+changed.length+' 个主题待同步':'数据已准备就绪'}</strong><p>${!themes.length?dataUnavailableMessage():'可用数据截至 2026-10-15 · 最近更新 '+dataBoardUpdated()}</p></div></div><div class="prep-counts"><span><b>${sources.length}</b>适配器</span><span><b>${ids.size}</b>模型</span><span><b>${themes.length}</b>业务主题</span></div></div>`;
}
function dataWorkspace(){
  const modes=[['page','当前页面全部数据','自动汇总本页全部依赖模型'],['source','按适配器更新','选择数据源，更新其全部模型'],['theme','按业务主题更新','选择主题，跨数据源更新']];
  const note={page:'已包含当前页面依赖的全部业务主题，共享模型只执行一次。',source:'仅列出本页关联适配器。更新会执行所选适配器的全部模型，可能影响其他页面的主题。',theme:'仅列出当前页面使用的业务主题；支持多选，自动汇总各主题依赖模型。'};
  return `<div class="prep-workspace">${dataOverview()}<section class="prep-resources"><div class="prep-resource-heading"><h3>更新范围</h3></div><div class="prep-modes">${modes.map(([id,title,description])=>`<button data-action="data-view" data-value="${id}" aria-pressed="${dataView.mode===id}" class="${dataView.mode===id?'selected':''}"><strong>${title}</strong><small>${description}</small></button>`).join('')}</div><p class="prep-list-note">${note[dataView.mode]} 更新时间为上次完整成功更新的时间。</p>${dataResources().length?dataResourceTable():`<div class="prep-empty">${dataUnavailableMessage()}</div>`}</section>${dataUpdateProgress()}</div>`;
}
function dataDialogFooter(first=false){if(dataUpdateRequest&&!dataUpdateRequestMatches())dataUpdateRequest=null;return `${first?'':dataUpdateRequest?dataUpdateConfirmation():dataSelectionSummary()}<div class="prep-dialog-footer-note">${btn('关闭','close')}</div>`}
function dataFirstAccess(){return `<div class="prep-first"><div class="fact-card highlight"><h3>首次接入 · 数据准备中</h3><p>尚无历史可用版本，全部依赖准备就绪后才可查看看板。</p></div><div class="prep-stages">${dataUpdateSteps.map(([i,title,description],n)=>`<div class="prep-stage ${n<2?'done':n===2?'processing':'pending'}"><div class="prep-stage-title"><span class="prep-stage-number">${n+1}</span><strong>${title}</strong></div><p>${description}</p><small>${n<2?'已完成':n===2?'处理中':'等待中'}</small></div>`).join('')}</div><p class="prep-hint">首次接入为独立场景示意。尚无可复用的上游结果，不提供阶段重跑。</p></div>`}
function dataStatus(first=false){
  if(first||overlay?.kind!=='data-status')dataUpdateRequest=null;
  if(!first&&overlay?.kind!=='data-status'&&!dataUpdate.running){dataView.mode='page';dataView.selected=[];dataView.expanded=null}
  showOverlay(`${drawerHead('数据状态与更新',dataPage()?.name||'当前页面')}<div class="drawer-body prep-drawer-body"><div id="drawer-data-workspace">${first?dataFirstAccess():dataWorkspace()}</div></div><div class="drawer-footer prep-dialog-footer" id="data-dialog-footer">${dataDialogFooter(first)}</div>`,'data-prep-dialog','数据状态与更新');
  overlay={kind:'data-status',first};
}
function refreshDataUpdateUI(){
  // 只更新数据面板，后台任务不得覆盖查询草稿、配置表单或其他抽屉。
  const active=document.activeElement,host=active?.closest?.('#drawer-data-workspace,#data-dialog-footer');
  let focus='';
  if(host&&active.dataset.dataSelect!==undefined)focus=`[data-data-select="${active.dataset.dataSelect}"]`;
  else if(host&&active.dataset.action)focus=`[data-action="${active.dataset.action}"]${active.dataset.id?`[data-id="${active.dataset.id}"]`:''}${active.dataset.value?`[data-value="${active.dataset.value}"]`:''}`;
  if(state.nav==='home'&&$('#board-data-status'))$('#board-data-status').innerHTML=dashboardReady();
  if(overlay?.kind==='data-status'&&!overlay.first&&$('#drawer-data-workspace')){$('#drawer-data-workspace').innerHTML=dataWorkspace();$('#data-dialog-footer').innerHTML=dataDialogFooter()}
  if(focus){const next=$('#'+host.id+' '+focus);if(next&&!next.disabled)next.focus({preventScroll:true})}
}
// 以下单阶段区间用于交互演示，按演示流程顺序累加；真实预估需接入任务统计与调度依赖。
function demoDataStageEstimate(index,estimatedAt=Date.now()){
  const ranges=[[60,120],[60,60],[30,120],[30,60]];
  return {estimatedAt,minSeconds:ranges[index][0],maxSeconds:ranges[index][1]};
}
function demoDataEstimate(start,estimatedAt=Date.now()){
  return dataUpdateSteps.slice(start).reduce((total,step,i)=>{const estimate=demoDataStageEstimate(start+i);total.minSeconds+=estimate.minSeconds;total.maxSeconds+=estimate.maxSeconds;return total},{estimatedAt,minSeconds:0,maxSeconds:0});
}
function dataEstimateDuration(estimate){
  const minutes=estimate.minSeconds>=60&&estimate.maxSeconds>60&&estimate.minSeconds%60===0&&estimate.maxSeconds%60===0,divisor=minutes?60:1;
  return `约 ${estimate.minSeconds/divisor}${estimate.minSeconds===estimate.maxSeconds?'':'–'+estimate.maxSeconds/divisor} ${minutes?'分钟':'秒'}`;
}
function dataDateTime(ms){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms))}
function dataEstimateWindow(estimate){
  const from=dataDateTime(Math.floor((estimate.estimatedAt+estimate.minSeconds*1000)/60000)*60000);
  const to=dataDateTime(Math.ceil((estimate.estimatedAt+estimate.maxSeconds*1000)/60000)*60000);
  return from+'–'+(from.slice(0,10)===to.slice(0,10)?to.slice(11):to);
}
function dataUpdateRequestMatches(){
  return !!dataUpdateRequest&&dataUpdateRequest.role===state.role&&dataUpdateRequest.industry===state.industry&&JSON.stringify(dataUpdateRequest.config)===JSON.stringify(pageDataConfig(dataPage()))&&JSON.stringify(dataUpdateRequest.plan)===JSON.stringify(selectedDataPlan());
}
function dataUpdateConfirmation(){
  const r=dataUpdateRequest,plan=r.plan;
  const title=r.kind==='rerun'?(r.start===3?'准备重新发布':'准备从'+dataUpdateSteps[r.start][1]+'重跑'):plan.mode==='page'?'准备更新当前页面全部数据':plan.mode==='source'?'准备更新所选适配器':'准备更新所选业务主题';
  const stages=dataUpdateSteps.slice(r.start).map((step,i)=>i+r.start===3?'发布就绪':step[1]).join(' → ');

  <script>
// 本地原型：固定演示企业与用户；正式产品需使用服务端认证身份和行为记录。
const COMMON_REPORTS_LIMIT=6;
const COMMON_REPORTS_KEY='dolink_common_reports_demo_v1';
const COMMON_ROLE_DEFAULTS={
  boss:['store-workbench','store-profit','hr-overview','member-profile'],
  hq:['region-overview','store-workbench','supply-chain','marketing-campaign'],
  finance:['store-profit','joint-operation'],
  hr:[],
  brand:['member-profile','marketing-campaign'],
  region:['store-workbench','supply-chain','marketing-campaign'],
  store:[]
};
let commonData;
try{commonData=JSON.parse(localStorage.getItem(COMMON_REPORTS_KEY))}catch(_){}
const commonObject=value=>value&&typeof value==='object'&&!Array.isArray(value);
if(!commonObject(commonData)||!commonObject(commonData.contexts)||!commonObject(commonData.defaults))commonData={contexts:{},defaults:{}};
let commonSessions={},commonVisit=null,commonVisitTimer=null;
const commonDateFormat=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
function commonDay(time=Date.now()){const p=Object.fromEntries(commonDateFormat.formatToParts(time).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function commonWeek(time=Date.now()){const d=new Date(commonDay(time)+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)}
function commonContextKey(role,terminal='pc'){return `demo-tenant/demo-user/${role}/${terminal}`}
function saveCommonReports(){try{localStorage.setItem(COMMON_REPORTS_KEY,JSON.stringify(commonData));return true}catch(_){return false}}
function commonContext(role,terminal='pc'){
  const key=commonContextKey(role,terminal);let context=commonData.contexts[key];
  if(!commonObject(context))context=commonData.contexts[key]={};
  context.pins=Array.isArray(context.pins)?[...new Set(context.pins.filter(id=>typeof id==='string'))].slice(0,COMMON_REPORTS_LIMIT):[];
  context.order=Array.isArray(context.order)?[...new Set(context.order.filter(id=>typeof id==='string'))].slice(0,COMMON_REPORTS_LIMIT):[];
  if(!commonObject(context.usage))context.usage={};
  for(const [id,usage] of Object.entries(context.usage))if(!commonObject(usage))delete context.usage[id];
  if(!commonObject(context.snapshot)||typeof context.snapshot.week!=='string'||!Array.isArray(context.snapshot.ids))context.snapshot=null;
  else context.snapshot.ids=context.snapshot.ids.filter(id=>typeof id==='string');
  return context;
}
function commonEligible(role,terminal='pc'){
  const allowed=available(role,terminal),home=allowed.find(p=>p.id===homes[role]?.[terminal])||allowed[0];
  return allowed.filter(p=>p.id!==home?.id);
}
function getCommonRoleDefaults(role){
  const allowed=new Set(commonEligible(role).map(p=>p.id));
  const configured=commonData.defaults[role];
  return [...new Set(Array.isArray(configured)?configured:COMMON_ROLE_DEFAULTS[role]||[])].filter(id=>allowed.has(id)).slice(0,COMMON_REPORTS_LIMIT);
}
function setCommonRoleDefaults(map){
  if(!commonObject(map))return;
  for(const role of roles){if(!Array.isArray(map[role.id]))continue;const allowed=new Set(commonEligible(role.id).map(p=>p.id));commonData.defaults[role.id]=[...new Set(map[role.id])].filter(id=>allowed.has(id)).slice(0,COMMON_REPORTS_LIMIT)}
  saveCommonReports();
}
function commonRankedReports(context,time=Date.now()){
  const today=commonDay(time),cutoff=commonDay(time-29*86400000);
  return Object.entries(context.usage).map(([id,usage])=>{
    const used=Object.entries(usage).filter(([day,at])=>day>=cutoff&&day<=today&&Number.isFinite(at)&&at<=time&&commonDay(at)===day);
    return {id,days:used.length,last:Math.max(0,...used.map(([,at])=>at))};
  }).filter(x=>x.days>=3).sort((a,b)=>b.days-a.days||b.last-a.last||a.id.localeCompare(b.id)).map(x=>x.id);
}
function commonReports(role=state.role,terminal='pc'){
  const context=commonContext(role,terminal),key=commonContextKey(role,terminal),allowed=commonEligible(role,terminal),ids=new Set(allowed.map(p=>p.id));
  if(!commonSessions[key]){
    if(context.snapshot?.week!==commonWeek()){context.snapshot={week:commonWeek(),ids:commonRankedReports(context)};saveCommonReports()}
    commonSessions[key]=context.snapshot.ids.slice();
  }
  const selected=[...new Set([...context.pins,...commonSessions[key],...getCommonRoleDefaults(role)])].filter(id=>ids.has(id)).slice(0,COMMON_REPORTS_LIMIT);
  const ordered=[...context.order.filter(id=>selected.includes(id)),...selected.filter(id=>!context.order.includes(id))];
  return ordered.map(id=>allowed.find(p=>p.id===id));
}
function reorderCommonReport(id,targetId,after=false,role=state.role,terminal='pc'){
  const ids=commonReports(role,terminal).map(p=>p.id);

  const ordered=ids.filter(value=>value!==id);ordered.splice(ordered.indexOf(targetId)+(after?1:0),0,id);

`:''}

function publishingDisplaySettings(){

    ${mode==='icon'?`<div class="form-field"><label>选择图标</label><div class="publishing-image-row"><div class="publishing-icon-preview">${icon(selectedIcon)}<span>${publishingIcons.find(([key])=>key===selectedIcon)[1]}</span></div><div class="publishing-icon-options" role="group" aria-label="默认图标">${publishingIcons.map(([key,label])=>`<button type="button" data-action="editor-display-icon" data-value="${key}" aria-pressed="${selectedIcon===key}" class="${selectedIcon===key?'selected':''}">${icon(key)}<span>${label}</span></button>`).join('')}</div></div></div>`:`<div class="form-field"><label for="publishing-thumbnail">图片</label><div class="publishing-image-row">${thumbnail?`<img class="publishing-thumbnail" src="${esc(thumbnail)}" alt="${esc(draft.name||'页面')}的缩略图">`:'<div class="publishing-image-empty">'+icon(selectedIcon)+'<span>未上传时使用默认图标</span></div>'}<div><label class="btn small publishing-upload" for="publishing-thumbnail">${icon('upload')}${thumbnail?'更换图片':'上传图片'}<input id="publishing-thumbnail" type="file" accept="image/png,image/jpeg,image/webp"></label>${thumbnail?btn(icon('trash')+'删除图片','remove-thumbnail','','small ghost'):''}<p class="params-note">PNG、JPG 或 WebP，最大 300 KB</p></div></div></div>`}

function uploadPageThumbnail(file){
  if(!file||!draft)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){showPageError('请上传 PNG、JPG 或 WebP 图片。');return}
  if(file.size>300*1024){showPageError('图片不能超过 300 KB，请压缩后重新上传。');return}
  const request=++thumbnailRequest,page=draft,reader=new FileReader();
  const current=()=>draft===page&&request===thumbnailRequest;
  reader.onerror=()=>{if(current())showPageError('图片读取失败，请重新选择。')};
  reader.onload=()=>{
    if(!current())return;
    if(!pageThumbnail({thumbnail:reader.result})){showPageError('图片格式无效，请重新选择。');return}
    const image=new Image();
    image.onerror=()=>{if(current())showPageError('图片无法读取，请选择有效图片。')};
    image.onload=()=>{if(current()){draft.thumbnail=reader.result;draft.displayMode='image';editor()}};
    image.src=reader.result;
  };
  reader.readAsDataURL(file);
}
document.addEventListener('click',event=>{

      if(config.themeIds.length>=20)return;
      index=config.themeIds.length;config.themeIds.push('');
    }else{
      if(!Number.isInteger(index)||index<0||index>=config.themeIds.length)return;
      config.themeIds.splice(index,1);index=Math.min(index,config.themeIds.length-1);

  if(action==='remove-thumbnail'){thumbnailRequest++;draft.thumbnail='';draft.displayMode='icon';editor()}
  if(action==='identify-report-id'){const id=quickBiPageId(draft.url);if(id){draft.reportId=id;draft.reportIdManual=false;editor()}else showPageError('链接中未找到 pageId，请手动填写报表 ID。')}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(draft&&el.dataset.publishingDataEnabled!==undefined){draft.dataUpdate={...pageDataConfig(draft),enabled:el.checked};editor();$('[data-publishing-data-enabled]')?.focus();return}

    const config=pageDataConfig(draft),index=Number(el.dataset.publishingThemeRow),id=el.value;
    if(!config.enabled||draft.nodeType==='empty'||!Number.isInteger(index)||index<0||index>=config.themeIds.length)return;

  <script>
'use strict';
function pageIsSecond(page){return page.pageLevel===2||Boolean(page.parentId)}
function pageParentCandidates(page=draft){return pages.filter(p=>p.id!==page.id&&!pageIsSecond(p)).sort(pageSort)}
function pageChildren(id){return pages.filter(p=>p.parentId===id).sort(pageSort)}
function pageHierarchyFields(){
  const second=pageIsSecond(draft),hasChildren=pageChildren(draft.id).length>0,parents=pageParentCandidates();
  return `<div class="form-field"><label>页面层级</label><div class="publishing-radio-group" role="group" aria-label="页面层级">${[[1,'一级页面'],[2,'二级页面']].map(([level,label])=>`<button type="button" data-action="editor-level" data-value="${level}" aria-pressed="${second===(level===2)}" class="${second===(level===2)?'selected':''}" ${level===2&&hasChildren?'disabled title="已有二级页面，不能调整为二级"':''}><i></i>${label}</button>`).join('')}</div>${hasChildren?'<p class="params-note">已有二级页面。如需调整层级，请先将子页面移至其他一级页面。</p>':''}</div>
    ${second?`<div class="form-field"><label for="page-parent"><em>*</em>上级页面</label><select id="page-parent" data-page-parent>${options([['','请选择一级页面'],...parents.map(p=>[p.id,p.category+' / '+p.name])],draft.parentId||'')}</select><p class="params-note">${parents.length?'二级页面沿用上级的业务分类；访问角色、终端和上架状态分别配置。':'暂无可选的一级页面，请先创建并保存一级页面。'}</p></div>`:'<p class="params-note hierarchy-note">一级页面可独立打开，也可设置为空节点来组织二级页面。</p>'}`;
}
function pageHierarchyValidation(page,status){
  if(page.pageLevel!==undefined&&![1,2].includes(page.pageLevel))return '请选择一级页面或二级页面。';
  if(page.pageLevel===1&&page.parentId)return '一级页面不能设置上级页面。';
  if(pageIsSecond(page)){
    if(pageChildren(page.id).length)return '此页面已有二级页面，不能再调整为二级。';
    if(!page.parentId)return '请为二级页面选择上级页面。';
    const parent=pages.find(p=>p.id===page.parentId);
    if(!parent||parent.id===page.id||pageIsSecond(parent))return '上级页面必须是已保存的一级页面，最多支持两级。';
    if(page.category!==parent.category)return '二级页面的业务分类应与上级页面一致。';
  }
  return '';
}
function shelfHierarchyEntry(page,children=[],expanded=true){
  const second=pageIsSecond(page),active=shelfState.selectedId===page.id;
  return `<div class="shelf-page-branch" data-node-id="${esc(page.id)}"><div class="shelf-page-row">${children.length?`<button class="shelf-page-toggle" data-action="shelf-parent-toggle" data-id="${esc(page.id)}" aria-label="${expanded?'收起':'展开'}${esc(page.name)}的二级页面" aria-expanded="${expanded}">${icon(expanded?'down':'arrow')}</button>`:'<span class="shelf-page-spacer"></span>'}<button class="shelf-page-button ${active?'active':''}" data-action="edit" data-id="${esc(page.id)}" ${active?'aria-current="page"':''}>${pageDisplayVisual(page)}<span>${esc(page.name)}</span><i class="shelf-status-dot ${page.status}" title="${names[page.status]}" aria-label="${names[page.status]}"></i></button>${second?'':`<button class="shelf-add-child" data-action="new-child-page" data-id="${esc(page.id)}" title="新建二级页面" aria-label="在${esc(page.name)}下新建二级页面">${icon('plus')}</button>`}</div>${expanded&&children.length?`<div class="shelf-page-children">${children.map(child=>shelfHierarchyEntry(child)).join('')}</div>`:''}</div>`;
}
function shelfHierarchyGroup(group,query){
  const nodes=pages.filter(p=>p.category===group),matches=p=>(shelfState.status==='all'||p.status===shelfState.status)&&(!query||pageSearchText(p).includes(query));
  let count=0;
  const html=nodes.filter(p=>!p.parentId||!nodes.some(parent=>parent.id===p.parentId)).sort(pageSort).map(parent=>{
    const allChildren=nodes.filter(p=>p.parentId===parent.id).sort(pageSort);
    const parentMatches=matches(parent),children=allChildren.filter(p=>matches(p)||(query&&parentMatches&&(shelfState.status==='all'||p.status===shelfState.status)));
    if(!parentMatches&&!children.length)return '';
    count+=(parentMatches?1:0)+children.length;
    return shelfHierarchyEntry(parent,children,Boolean(query)||!shelfState.closedParents.includes(parent.id));
  }).join('');
  return {html,count};
}
function reportParent(page){
  return page.parentId?pages.find(p=>p.id===page.parentId&&p.status==='published'&&p.roles.includes(state.role)&&(p.terminal==='pc'||p.terminal==='both')):null;
}
function reportHierarchyLabel(page){const parent=reportParent(page);return parent?`<div class="report-parent-label">${icon('arrow')}<span>上级页面：${esc(parent.name)}</span></div>`:''}
function orderReportHierarchy(list,homeId){
  const result=[],done=new Set(),append=p=>{if(!done.has(p.id)){result.push(p);done.add(p.id)}};
  const home=list.find(p=>p.id===homeId);if(home)append(home);
  for(const page of list){
    if(done.has(page.id))continue;
    const parent=reportParent(page),root=parent?list.find(p=>p.id===parent.id):null;
    if(root)append(root);else append(page);
    const parentId=root?.id||parent?.id||page.id;
    list.filter(p=>p.parentId===parentId).forEach(append);
  }

}

function validation(p,status){if(!p.name.trim())return '请填写页面名称。';const hierarchyError=pageHierarchyValidation(p,status);if(hierarchyError)return hierarchyError;if(p.sort!==undefined&&(!Number.isInteger(p.sort)||p.sort<0))return '排序请填写大于或等于 0 的整数。';if(status==='draft'||p.nodeType==='empty')return '';let u;try{u=new URL(p.url)}catch(_){return '请输入完整的 HTTPS 页面链接。'}if(u.protocol!=='https:')return '页面链接需要使用 HTTPS。';if(p.terminal==='both'&&p.mobileUrl){try{if(new URL(p.mobileUrl).protocol!=='https:')throw Error()}catch(_){return '移动端链接需要是完整的 HTTPS 地址。'}}if(p.type==='quickbi'&&!p.reportId.trim())return '请填写 Quick BI 报表 ID。';if(!p.roles.length)return '请至少选择一个访问角色。';let keys=new Set;for(let par of p.params){if(!/^[a-zA-Z_][\w.-]*$/.test(par.key))return '参数名称请以字母或下划线开头，仅含字母、数字、下划线、点和横线。';if(keys.has(par.key))return '参数名称不能重复。';keys.add(par.key);if(par.source==='fixed'&&par.required&&!par.defaultValue.trim())return '必填的固定参数需要设置值。';if(par.type==='date'&&par.source==='fixed'&&par.defaultValue&&(!/^\d{4}-\d{2}-\d{2}$/.test(par.defaultValue)||Number.isNaN(Date.parse(par.defaultValue))||new Date(par.defaultValue).toISOString().slice(0,10)!==par.defaultValue))return '日期参数请填写有效日期，格式为 YYYY-MM-DD。'}return publishingDataValidation(p,status)}

function savePage(status){if(!['boss','hq'].includes(state.role)||!draft)return;let p={pageLevel:draft.parentId?2:1,parentId:'',nodeType:'url',openMode:'current',sort:0,tags:[],thumbnail:'',...clone(draft),dataUpdate:pageDataConfig(draft),status};let e=validation(p,status);if(e){showPageError(e);return}let affected=impacts(p);const save=()=>{const previousPages=clone(pages),previousHomes=clone(homes);p.updated=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());let idx=pages.findIndex(x=>x.id===p.id);if(idx<0)pages.push(p);else pages[idx]=p;if(!pageIsSecond(p))pageChildren(p.id).forEach(child=>child.category=p.category);affected.forEach(a=>homes[a.role][a.t]='');try{persist()}catch(_){pages=previousPages;homes=previousHomes;if(overlay)closeOverlay();showPageError('保存失败：本地存储空间不足或不可用。请移除图片后重试，当前修改尚未保存。');return}homeDraft=clone(homes);shelfSaved(p);closeOverlay();render();notify(status==='published'?(p.nodeType==='empty'?'目录节点已保存':'页面已发布，可配置为角色首页'):'页面草稿已保存')};if(affected.length)confirmAction('此更改会影响角色首页',`受影响：首页 ${affected.map(a=>a.label).join('、')}。\n确认后将清除这些首页指定，并回退到可访问页面。`,save);else save()}

function changeStatus(id){let p=clone(pages.find(p=>p.id===id));p.status=p.status==='published'?'disabled':'published';let error=validation(p,p.status==='published'?'published':'draft');if(error){draft=p;editor();$('#form-error').textContent=error;$('#form-error').classList.add('visible');return}let affected=impacts(p);const update=()=>{pages[pages.findIndex(x=>x.id===id)]=p;affected.forEach(a=>homes[a.role][a.t]='');homeDraft=clone(homes);persist();shelfSaved(p);closeOverlay();render();notify(p.status==='published'?'页面已发布':'页面已停用')};if(p.status==='disabled')confirmAction('停用「'+p.name+'」',affected.length?'该页面被以下首页使用：'+affected.map(a=>a.label).join('、')+'。\n停用后将清除这些首页指定，并回退到可访问页面。':'停用后，该页面将从用户报表列表中移除；配置会继续保留。',update);else update()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el){if(e.target.classList.contains('overlay'))closeOverlay();return}const a=el.dataset.action,v=el.dataset.value,id=el.dataset.id;switch(a){case'industry-insight':markCommonInteraction();industryInsightDetail(el.dataset.page,id);break;case'board-query-apply':applyBoardQuery();break;case'board-query-reset':resetBoardQuery();break;case'board-structure':dashboardStructure(el.dataset.page);break;case'role-chart':markCommonInteraction();state.roleChart=Number(id);render();break;case'metric-definition':metricDefinition(el.dataset.page,id);break;case'role-issue':markCommonInteraction();roleIssue(el.dataset.page,id);break;case'role-followup':{const key='role-review-'+state.industry+'-'+el.dataset.page+'-'+id;if(!tasks.includes(key))tasks.push(key);persist();roleIssue(el.dataset.page,id);notify('已加入本地待核实事项，尚未发送任务');break}case'nav':workspaceTopNav(v);break;case'tab':if(v==='overview')workspaceReturnHome();else workspaceLibrary(v);break;case'admin-tab':shelfAdminTab(v);break;case'shelf-group':shelfState.selectedGroup=v;shelfState.collapsed=shelfState.collapsed.includes(v)?shelfState.collapsed.filter(x=>x!==v):shelfState.collapsed.concat(v);render();break;case'new-group':shelfNewGroup();break;case'shelf-group-save':shelfSaveGroup();break;case'cancel-shelf':shelfCancelEdit();break;case'shelf-disable':if(shelfHasChanges())notify('请先保存或取消当前修改，再调整上架状态');else changeStatus(draft.id);break;case'chart':state.chart=v;render();break;case'category':state.category=v;render();break;case'clear-search':state.category='全部';state.search='';render();break;case'favorite':{e.stopPropagation();const p=pages.find(p=>p.id===id&&accessible(p));if(!p){notify('此页面不在当前角色的 PC 授权范围内');return}p.favorite=!p.favorite;persist();render();break}case'open-report':workspaceOpenReport(id);break;case'back-library':workspaceBackLibrary();break;case'back-home':workspaceReturnHome();break;case'common-pin':if(toggleCommonPin(id))render();break;case'common-help':commonReportsHelp();break;case'save-common':if(['boss','hq'].includes(state.role)){setCommonRoleDefaults(commonDefaultsDraft||{});commonDefaultsDraft=null;render();notify('角色默认常用报表已保存')}break;case'revert-common':commonDefaultsDraft=null;render();notify('已还原未保存的更改');break;case'new-page':newPage();break;case'edit':shelfOpenPage(id);break;case'editor-type':draft.type=v;updatePublishingField('url',draft.url);editor();break;case'editor-terminal':draft.terminal=v;editor();break;case'add-param':draft.params.push({key:'',source:'fixed',type:'string',required:false,defaultValue:''});editor();editorScrollContainer().scrollTop=900;break;case'remove-param':draft.params.splice(Number(id),1);editor();editorScrollContainer().scrollTop=600;break;case'save-draft':savePage('draft');break;case'publish-page':savePage('published');break;case'draft-preview':preview(draft,'pc',state.role,true);break;case'back-editor':editor();break;case'preview':preview(pages.find(p=>p.id===id));break;case'preview-terminal':{const o=overlay;const p=o.homeRole?(pages.find(p=>p.id===homeDraft[o.homeRole]?.[v]&&accessible(p,o.homeRole,v))||available(o.homeRole,v)[0]):o.p;if(p)preview(p,v,o.role,o.fromEditor,o.homeRole);else notify('此角色暂无该终端可用的页面');break}case'toggle-status':changeStatus(id);break;case'home-preview':{let rid=el.dataset.role;let p=pages.find(p=>p.id===homeDraft[rid]?.pc)||available(rid)[0];if(p)preview(p,'pc',rid,false,rid);else notify('此角色暂无可用的 PC 页面');break}case'save-homes':homes=clone(homeDraft);persist();render();notify('双端角色首页配置已保存');break;case'revert-homes':homeDraft=clone(homes);render();notify('已还原未保存的更改');break;case'close':closeOverlay();break;case'confirm':{let fn=confirmFn;confirmFn=null;returnOverlay=null;fn?.();break}case'cancel-confirm':if(returnOverlay){$('#overlay-root').innerHTML=returnOverlay;overlay=true;returnOverlay=null}else closeOverlay();break;case'data-run':startDataUpdate();break;case'data-confirm-update':confirmDataUpdate();break;case'data-cancel-update':cancelDataUpdate();break;case'data-view':changeDataView(v);break;case'data-detail':dataView.expanded=dataView.expanded===id?null:id;refreshDataUpdateUI();break;case'data-row-update':selectDataRow(id);break;case'data-stage-update':startDataStageUpdate(Number(id));break;case'data':case'data-daily':dataStatus(false);break;case'data-first':dataStatus(true);break;case'diagnosis':diagnosis(Number(id));break;case'add-review':tasks.push('review-'+id);persist();diagnosis(Number(id));notify('已加入待核实事项，等待业务确认');break;case'task':tasks=tasks.includes(id)?tasks.filter(x=>x!==id):tasks.concat(id);persist();render();break;case'guide':guide();break;case'notifications':roleNotifications();break;case'reset':confirmAction('恢复演示配置','将清除本浏览器内对页面、收藏、任务、角色首页及常用报表的修改，并恢复初始演示数据。',()=>{pages=clone(seed.pages);homes=clone(seed.homes);homeDraft=clone(homes);tasks=[];categories.splice(0,categories.length,...seedCategories);shelfState.ready=false;shelfState.search='';shelfState.status='all';shelfState.collapsed=[];shelfState.closedParents=[];draft=null;state.globalSearch='';resetCommonReports();commonDefaultsDraft=null;workspaceContext='';persist();closeOverlay();switchRole('boss');notify('已恢复初始演示配置')});break}});
let composingSearch=null,globalImeEnter=false;
const searchInputIds=['global-search-input','library-search','shelf-search'];
function handleSearchInput(event){
  const input=event.target;if(!searchInputIds.includes(input.id))return false;
  if(event.isComposing||composingSearch===input)return true;
  if(input.id==='global-search-input'){state.globalSearch=input.value;return true}
  const target=input.id==='shelf-search'?shelfState:state;
  if(target.search===input.value)return true;
  const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;
  target.search=input.value;render();
  const next=$('#'+input.id);next.focus();next.setSelectionRange(start,end);
  return true;
}
document.addEventListener('compositionstart',event=>{if(searchInputIds.includes(event.target.id))composingSearch=event.target});
document.addEventListener('compositionend',event=>{if(searchInputIds.includes(event.target.id)){composingSearch=null;handleSearchInput({target:event.target})}});
document.addEventListener('keydown',event=>{if(event.target.id==='global-search-input'&&event.key==='Enter')globalImeEnter=Boolean(event.isComposing||event.keyCode===229||composingSearch===event.target)});
document.addEventListener('keyup',event=>{if(event.key==='Enter')globalImeEnter=false});
document.addEventListener('input',e=>{const el=e.target;if(handleSearchInput(e))return;if(el.dataset.edit){updatePublishingField(el.dataset.edit,el.value);if($('#param-preview'))$('#param-preview').innerHTML=paramsPreview()}if(el.dataset.param!==undefined){draft.params[Number(el.dataset.param)][el.dataset.key]=el.type==='checkbox'?el.checked:el.value;if($('#param-preview'))$('#param-preview').innerHTML=paramsPreview()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='shelf-status'){shelfState.status=el.value;render();return}if(el.dataset.edit&&draft)updatePublishingField(el.dataset.edit,el.value);if(el.dataset.commonRole){updateCommonDefault(el.dataset.commonRole,Number(el.dataset.commonSlot),el.value);return}if(el.dataset.dataSelect!==undefined){selectDataResource(el.dataset.dataSelect,el.checked);return}if(el.dataset.boardQuery){changeBoardQuery(el.dataset.boardQuery,el.value);return}if(el.id==='library-sort'){state.librarySort=el.value;render();$('#library-sort').focus()}if(el.id==='role-switch')switchRole(el.value);if(el.id==='industry-switch')switchIndustry(el.value);if(el.dataset.filter){state[el.dataset.filter]=el.value;if(el.dataset.filter==='brand'&&el.value!=='all')state.format={hotpot:'火锅',rice:'快餐',tea:'茶饮'}[el.value];render()}if(el.dataset.homeRole){homeDraft[el.dataset.homeRole][el.dataset.homeTerminal]=el.value;$('#home-save-state').textContent='有未保存的更改'}if(el.dataset.editRole){draft.roles=el.checked?[...new Set([...draft.roles,el.dataset.editRole])]:draft.roles.filter(r=>r!==el.dataset.editRole)}if(el.dataset.param!==undefined&&el.dataset.key==='source'){const scroll=editorScrollContainer().scrollTop;editor();editorScrollContainer().scrollTop=scroll}});
document.addEventListener('submit',e=>{if(e.target.id==='global-search'){e.preventDefault();if(composingSearch?.id==='global-search-input'||globalImeEnter)return;workspaceSavePosition();state.search=new FormData(e.target).get('q').trim();state.globalSearch='';state.nav='home';state.tab='all';state.page=null;state.reportOrigin=null;state.category='全部';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay)closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.report-card')){e.preventDefault();e.target.click()}if(e.key==='Tab'&&overlay){const nodes=[...document.querySelectorAll('#overlay-root button:not(:disabled),#overlay-root input,#overlay-root select,#overlay-root [tabindex="0"]')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
if(!saved?.industryBoardsVersion){
  const priorDescriptions={
    'hr-overview':'汇总直营及受托联营 72 家门店的人员配置、实际工时与用工稳定性，不展示个人薪酬明细。',
    'brand-overview':'聚焦食光火锅 42 家授权门店的品牌经营、已识别顾客复购与营销活动复盘。',
    'supply-chain':'结合火锅食材、茶饮原料和烘焙批次，查看缺货、库存及报损的业务影响。'
  };
  for(const p of pages){
    const original=seed.pages.find(x=>x.id===p.id);
    if(!original)continue;
    if(p.description===priorDescriptions[p.id])p.description=original.description;
    if(!p.params.some(x=>x.key==='industry_type'||x.source==='industryType'))p.params.push({key:'industry_type',source:'industryType',type:'string',required:true,defaultValue:''});
  }
  persist();
}
if(!saved?.roleBoardsVersion)persist();
render();
