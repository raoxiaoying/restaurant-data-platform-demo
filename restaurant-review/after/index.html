<body class="hmw-app">
  <div class="hmw-shell">
    <aside class="hmw-sidebar">
      <a class="hmw-brand" href="#attribution"><span class="hmw-logo">好</span><span><b>好美味餐饮集团</b><small>智能决策平台</small></span></a>
      <nav class="hmw-nav" id="hmwNav" aria-label="经营决策导航"></nav>
    </aside>
    <div class="hmw-workspace">
      <header class="hmw-topbar"><div class="hmw-breadcrumb"><span>好美味餐饮集团智能决策平台</span><i>/</i><b id="hmwBreadcrumb">10月利润归因</b></div><div class="hmw-top-actions"><button class="hmw-button ghost" data-action="statement">管理利润表</button><button class="hmw-button ghost" id="hmwFullscreen">全屏</button></div></header>
      <main id="hmwMain" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="hmwDialog"><header><div><small id="hmwDialogLabel"></small><h2 id="hmwDialogTitle"></h2></div><button class="hmw-button ghost" id="hmwClose" aria-label="关闭详情">✕</button></header><div class="hmw-dialog-body" id="hmwDialogBody"></div></dialog>
  <div class="hmw-toast" id="hmwToast" role="status" hidden></div>
  <script>/* 好美味餐饮集团：用于产品演示的合成业务模型。金额：万元；采购价格：元/公斤。 */
(function (root) {
  'use strict';

  const SCALE = 1000000; // 万元保留至分，所有加总在金额最小单位上分配。
  const money = n => Math.round(n * SCALE) / SCALE;
  const sum = values => money(values.reduce((a, b) => a + b, 0));
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
  const expenseKeys = ['food', 'labor', 'rent', 'utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'];
  const labels = { revenue: '折后营业额', food: '食材成本', labor: '人工费用', rent: '租金及物业费', utilities: '能耗费用', tableware: '餐具', consumables: '物耗', maintenance: '维修维护费', marketing: '市场推广费', otherStoreExpense: '其他费用', profit: '门店经营利润' };
  function allocate(total, weights, scale = SCALE) {
    const units = Math.round(total * scale);
    const denominator = weights.reduce((a, b) => a + b, 0);
    const exact = weights.map(w => units * w / denominator);
    const result = exact.map(Math.floor);
    let left = units - result.reduce((a, b) => a + b, 0);
    const order = exact.map((v, i) => ({ i, fraction: v - result[i] })).sort((a, b) => b.fraction - a.fraction || a.i - b.i);
    for (let i = 0; i < left; i++) result[order[i].i]++;
    return result.map(n => n / scale);
  }
  function complete(row) {
    const result = { ...row };
    result.expenses = sum(expenseKeys.map(k => result[k] || 0));
    result.grossProfit = money(result.revenue - result.food);
    result.operatingExpenses = money(result.expenses - result.food);
    result.otherExRent = sum(['utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'].map(k => result[k] || 0));
    result.other = money(result.otherExRent + result.rent);
    result.profit = money(result.revenue - result.expenses);

  <script>const M = globalThis.HaomeiweiModel;

function trackingStoreTable(query=''){

}
function trackingBridge(){
  const t=M.tracking,s=t.summary;
  const factors=s.attributions.filter(r=>Math.abs(r.impact)>.000001).map(r=>({...r,shortName:({revenue:'营业额',food:'食材',labor:'人工',rent:'租金物业',utilities:'能耗',tableware:'餐具',consumables:'物耗',maintenance:'维修',marketing:'市场推广',otherStoreExpense:'其他费用'})[r.key]}));
  const max=Math.max(...factors.map(r=>Math.abs(r.impact))),height=factors.length*30+42;
  return `<div class="hmw-chart-wrap"><svg class="hmw-chart" viewBox="0 0 820 ${height}" role="img" aria-label="本周各损益项目利润偏差，合计${signed(s.actual.profit-s.plan.profit,4)}万元"><text x="160" y="18">减少利润 ←</text><text x="615" y="18">→ 增加利润</text><path d="M420 27V${height-15}" stroke="#d9e2f1"/>${factors.map((r,i)=>{const y=32+i*30,w=Math.abs(r.impact)/max*250;return `<text x="20" y="${y+15}">${r.shortName}</text><rect x="${r.impact<0?420-w:420}" y="${y+2}" width="${Math.max(2,w)}" height="18" rx="2" fill="${r.impact<0?'#d87680':'#28a087'}"/><text x="${r.impact<0?410-w:430+w}" y="${y+15}" text-anchor="${r.impact<0?'end':'start'}" style="fill:${r.impact<0?'#bd4a58':'#16846c'}">${signed(r.impact,4)}万</text>`;}).join('')}</svg></div><div class="hmw-equation"><div><small>周计划利润</small><strong>${num(s.plan.profit)}万</strong></div><b>＋</b><div><small>各项有符号偏差合计</small><strong>${signed(s.actual.profit-s.plan.profit,4)}万</strong></div><b>＝</b><div><small>实际利润</small><strong>${num(s.actual.profit)}万</strong></div></div>`;
}

function causeTabs(c,tab){return `<div class="hmw-tabs"><button class="${tab==='detail'?'active':''}" data-cause-tab="${c.id}" data-tab="detail">细项分析</button><button class="${tab==='stores'?'active':''}" data-cause-tab="${c.id}" data-tab="stores">120家门店分布</button></div>`;}
function showCause(id,tab='detail'){
  const c=M.getCauseDetail(id);if(!c)return;
  const back=c.parentId?`<p><button class="hmw-link" data-cause="${c.parentId}">← 返回${M.getCauseDetail(c.parentId).name}</button></p>`:'';
  let body=back+`<div class="hmw-mini-kpis"><div><small>本项利润影响</small><strong class="${badClass(c.impact)}">${signed(c.impact)}<span>万</span></strong></div><div><small>${c.parentId?'占上层不利影响':'占全部不利影响'}</small><strong>${c.impact<0?pct(-c.impact,c.parentId?-M.getCauseDetail(c.parentId).impact:M.group.negativeTotal):'—'}</strong></div><div><small>对净下降额的贡献</small><strong>${signed(-c.impact/M.group.profitDecline*100,1)}<span>%</span></strong></div></div>`+causeTabs(c,tab);
  if(tab==='stores')body+=causeStoreRows(c);
  else {
    body+=`<h3>经营场景</h3><p>${esc(c.reason)}</p><h3>金额依据</h3><p>${esc(c.evidence)}</p>${c.formula?`<div class="hmw-equation">${esc(c.formula)}</div>`:''}`;
    if(c.children.length)body+=`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>细分因素</th><th class="numeric">利润影响 / 万元</th><th class="numeric">本项占比</th><th>穿透分析</th></tr></thead><tbody>${c.children.map(child=>`<tr><td><button class="hmw-link" data-cause="${child.id}">${child.name}</button></td><td class="numeric bad">${signed(child.impact)}</td><td class="numeric">${pct(-child.impact,-c.impact)}</td><td><button class="hmw-link" data-cause="${child.id}">查看细项及门店 →</button></td></tr>`).join('')}<tr class="total"><td>合计</td><td class="numeric">${signed(c.impact)}</td><td class="numeric">100.0%</td><td>与本项一致</td></tr></tbody></table></div>`;
    if(c.id==='food'||c.id==='procurement')body+=materialsTable();
    if(c.id==='mix')body+=newProductsTable();
    if(c.material)body+=materialScene(c.material,c.id.startsWith('mix-'));
    if(c.id==='volume')body+=`<div class="hmw-mini-kpis"><div><small>9月就餐人次</small><strong>${num(M.actuals.september.guests/10000,1)}<span>万</span></strong></div><div><small>10月就餐人次</small><strong>${num(M.actuals.october.guests/10000,1)}<span>万</span></strong></div><div><small>10月实际人均消费</small><strong>${num(M.actuals.october.perCapita,2)}<span>元</span></strong></div></div>`;
    body+=`<p><button class="hmw-button" data-cause-tab="${c.id}" data-tab="stores">查看本项在120家门店的分布 →</button></p>`;
  }
  dialog(c.name,body,'10月归因 / 集团 → 细项 → 门店');$('#hmwDialogBody').dataset.activeStore='';
}
function causeStoreRows(c){return `<div class="hmw-table-wrap store-scroll"><table class="hmw-table"><thead><tr><th>门店</th><th>区域</th><th class="numeric">本项利润影响 / 万元</th><th class="numeric">占本项金额</th><th>门店分析</th></tr></thead><tbody>${[...c.storeRows].sort((a,b)=>a.impact-b.impact).map(r=>`<tr><td>${r.storeId} · ${r.storeName}</td><td>${r.region}</td><td class="numeric ${badClass(r.impact)}">${signed(r.impact,4)}</td><td class="numeric">${pct(r.impact,c.impact,2)}</td><td><button class="hmw-link" data-store="${r.storeId}" data-context="attribution" data-cause-context="${c.id}">查看本店 →</button></td></tr>`).join('')}<tr class="total"><td>120家合计</td><td></td><td class="numeric">${signed(c.impact,4)}</td><td class="numeric">100.00%</td><td>与集团本项一致</td></tr></tbody></table></div>`;}

}
function newProductsTable(){
  return `<h3>新品促销 · 同一总销量内的菜品替代</h3><p class="hmw-note">新品销量超预期带来的收入不视为损失。此项仅比较替代同价位老菜后，按基准采购价计量的标准配方成本变化。</p><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>新品 / 主原料</th><th class="numeric">原预计销量 / 份</th><th class="numeric">实际销量 / 份</th><th class="numeric">新品标准食材成本 / 元·份</th><th class="numeric">替代老菜成本</th><th class="numeric">组合影响 / 万元</th></tr></thead><tbody>${M.materials.filter(m=>m.newProduct).map(m=>`<tr><td><button class="hmw-link" data-cause="mix-${m.id}">${m.dish}</button><small>${m.name}</small></td><td class="numeric">${num(m.forecastServings,0)}</td><td class="numeric">${num(m.actualServings,0)}</td><td class="numeric">${num(m.standardDishCost)}</td><td class="numeric">${num(m.replacedDishCost)}</td><td class="numeric bad">${signed(m.mixImpact)}</td></tr>`).join('')}<tr class="total"><td>组合影响合计</td><td colspan="4"></td><td class="numeric">−52.00</td></tr></tbody></table></div>`;
}
function materialScene(m,isMix=false,storeId=null){
  const r=storeId?m.storeRows.find(row=>row.storeId===storeId):m;
  const priceImpact=r.priceImpact,mixImpact=r.mixImpact;
  return `<h3>${m.dish} · ${m.name}</h3><p>${esc(m.reason)}</p><div class="hmw-mini-kpis"><div><small>${isMix?'组合利润影响':'采购利润影响'}</small><strong>${signed(isMix?mixImpact:priceImpact,storeId?4:2)}<span>万</span></strong></div><div><small>基准采购价</small><strong>${num(m.basePrice)}<span>元/公斤</span></strong></div><div><small>实际加权采购价</small><strong>${num(m.actualPrice)}<span>元/公斤</span></strong></div></div>${m.newProduct?`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>原预计销量 / 份</th><th>实际销量 / 份</th><th>首批锁量 / 公斤</th><th>超量采购 / 公斤</th><th>超量现货价 / 元·公斤</th></tr></thead><tbody><tr><td>${num(r.forecastServings,0)}</td><td>${num(r.actualServings,0)}</td><td>${num(r.lockedKg,1)}</td><td>${num(r.spotKg,1)}</td><td>${num(m.spotPrice)}</td></tr></tbody></table></div><p>${esc(m.procurementNote)}</p><div class="hmw-equation">${isMix?`${num(r.actualServings,0)}份 ×（${num(m.standardDishCost)} − ${num(m.replacedDishCost)}）元/份 ÷10,000 = ${num(-mixImpact,storeId?4:2)}万元标准食材成本增加`:`${num(r.spotKg,1)}公斤 ×（${num(m.spotPrice)} − ${num(m.basePrice)}）元/公斤 ÷10,000 = ${num(-priceImpact,storeId?4:2)}万元采购成本增加`}</div>`:`<div class="hmw-equation">${num(r.purchaseKg,0)}公斤 ×（${num(m.actualPrice)} − ${num(m.basePrice)}）元/公斤 ÷10,000 = ${num(-priceImpact,storeId?4:2)}万元采购成本增加</div><p>${esc(m.procurementNote)}</p>`}`;
}
function showStore(id,context='attribution',causeId=null){
  const s=getStore(id);if(!s)return;
  let body='';
  if(context==='attribution'){
    const currentCause=causeId?M.getCauseDetail(causeId):null;
    if(currentCause){body+=`<p><button class="hmw-link" data-cause-tab="${causeId}" data-tab="stores">← 返回${currentCause.name}门店分布</button></p><h3>${currentCause.name} · 本店影响 ${signed(currentCause.storeRows.find(r=>r.storeId===id).impact,4)}万元</h3>`;if(currentCause.material)body+=materialScene(currentCause.material,causeId.startsWith('mix-'),id);else if(currentCause.id==='food'||currentCause.id==='procurement')body+=storeMaterialTable(id,currentCause.id);if(currentCause.children.length)body+=storeCauseChildren(currentCause,id);}
    body+=`<div class="hmw-mini-kpis"><div><small>9月门店利润</small><strong>${num(s.september.profit,2)}<span>万</span></strong></div><div><small>10月门店利润</small><strong>${num(s.october.profit,2)}<span>万</span></strong></div><div><small>门店利润变化</small><strong>${signed(s.october.profit-s.september.profit,2)}<span>万</span></strong></div></div><h3>本店利润归因</h3><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>因素</th><th class="numeric">利润影响 / 万元</th><th class="numeric">本店不利影响占比</th></tr></thead><tbody>${M.causes.map(c=>{const impact=s.causes[c.id];const negative=-M.causes.filter(x=>x.impact<0).reduce((sum,x)=>sum+s.causes[x.id],0);return `<tr><td>${c.name}</td><td class="numeric ${badClass(impact)}">${signed(impact,4)}</td><td class="numeric">${impact<0?pct(-impact,negative):'—'}</td></tr>`;}).join('')}<tr class="total"><td>净变化</td><td class="numeric">${signed(s.october.profit-s.september.profit,4)}</td><td>与本店利润表一致</td></tr></tbody></table></div>${!currentCause?storeMaterialTable(id,'food'):''}<h3>本店管理利润表</h3>`+pnlTable([{label:'9月实际',row:s.september,rate:true},{label:'10月实际',row:s.october,rate:true}]);
  }else if(context==='forecast'){
    const one=getForecast('steady'),two=getForecast('anniversary'),a=one.byStore.find(r=>key(r)===id),b=two.byStore.find(r=>key(r)===id),selected=state.plan==='steady'?a:b,f=state.plan==='steady'?one:two;
    body+=`<div class="hmw-mini-kpis"><div><small>方案一预计利润</small><strong>${num(a.profit)}<span>万</span></strong></div><div><small>方案二预计利润</small><strong>${num(b.profit)}<span>万</span></strong></div><div><small>当前方案产能使用率</small><strong>${num(selected.capacityUse,1)}<span>%</span></strong></div></div>${selected.capacityUse>100?'<div class="hmw-insight">本店预计就餐人次超过现有产能。需先确认分流、增能或下调销量后，再锁定执行计划。</div>':''}<p>${state.plan==='steady'?'方案一':'方案二'}预计就餐 ${num(selected.guests,0)}人次，日均 ${num(selected.dailyGuests,0)}人次；按现有餐位与翻台预算，月承接能力 ${num(selected.capacityGuests,0)}人次。</p>`+pnlTable([{label:'10月实际',row:s.october},{label:'方案一',row:a,rate:true},{label:'方案二',row:b,rate:true}])+`<h3>${state.plan==='steady'?'方案一':'方案二'} · 本店执行条件</h3><div class="hmw-action-list">${f.actions.map(action=>storeForecastAction(action,f,selected,s)).join('')}</div><p class="hmw-note">本店各项整改预计合计 ${num(selected.plannedSavings,4)}万元，已在上表食材、人工、能耗和物耗中扣减。人次达成率 ${num(state.volumeFactor*100,0)}%，整改达成率 ${num(state.executionRate*100,0)}%。</p>`;
  }else {
    const r=M.tracking.stores.find(row=>key(row)===id);
    body+=`<div class="hmw-mini-kpis"><div><small>周计划利润</small><strong>${num(r.plan.profit)}<span>万</span></strong></div><div><small>本周实际利润</small><strong>${num(r.actual.profit)}<span>万</span></strong></div><div><small>利润偏差</small><strong>${signed(r.actual.profit-r.plan.profit)}<span>万</span></strong></div></div><h3>${r.abnormal?r.scenario:'本店执行对照'}</h3>`;
    if(r.findings.length)body+=`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>核查项目</th><th class="numeric">计划 / 标准</th><th class="numeric">实际</th></tr></thead><tbody>${r.findings.map(f=>`<tr><td>${f.title}</td><td class="numeric">${num(f.plan,2)} ${f.unit}</td><td class="numeric">${num(f.actual,2)} ${f.unit}</td></tr>`).join('')}</tbody></table></div>`;
    body+=trackingEvidence(r);
    body+=`<h3>利润偏差勾稽</h3><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>项目</th><th class="numeric">周计划 / 万元</th><th class="numeric">实际 / 万元</th><th class="numeric">利润影响 / 万元</th></tr></thead><tbody>${r.attributions.map(c=>`<tr><td>${c.name}</td><td class="numeric">${num(r.plan[c.key],4)}</td><td class="numeric">${num(r.actual[c.key],4)}</td><td class="numeric ${badClass(c.impact)}">${signed(c.impact,4)}</td></tr>`).join('')}<tr class="total"><td>门店经营利润</td><td class="numeric">${num(r.plan.profit,4)}</td><td class="numeric">${num(r.actual.profit,4)}</td><td class="numeric">${signed(r.actual.profit-r.plan.profit,4)}</td></tr></tbody></table></div><h3>整改建议与复核</h3>${r.actions.length?`<div class="hmw-action-list">${r.actions.map(a=>actionCard(a,true)).join('')}</div>`:'<p>按既定节奏继续核对采购、实耗和排班，下一周期复核利润与服务表现。</p>'}<div class="hmw-mini-kpis"><div><small>高峰出餐P90</small><strong>${num(r.service.p90Minutes,0)}<span>分钟</span></strong></div><div><small>百客有效客诉</small><strong>${num(r.service.complaintPer100Guests,1)}<span>件</span></strong></div><div><small>下次复核</small><strong>11月14日</strong></div></div><p class="hmw-note">出餐P90为本店 ${num(r.service.completedDineInOrders,0)}笔完成堂食订单的第90百分位，目标≤20分钟；有效客诉 ${num(r.service.complaints,0)}件 / ${num(r.service.complaintGuests,0)}就餐人次，百客目标≤0.5件。动作状态变化不改写本周实际利润，收益待下一周期验证。</p>`;
  }
  dialog(`${id} · ${s.name}`,body,`${s.region} / ${s.format} / ${context==='tracking'?'11月1—7日执行':context==='forecast'?'11月预测':'10月归因'}`);$('#hmwDialogBody').dataset.activeStore=id;
}
function storeMaterialTable(id,type){return `<h3>本店食材细项</h3><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>原料</th><th class="numeric">标准用量 / 公斤</th><th class="numeric">采购价差影响 / 万元</th>${type==='food'?'<th class="numeric">组合影响 / 万元</th>':''}</tr></thead><tbody>${M.materials.map(m=>{const r=m.storeRows.find(row=>row.storeId===id);return `<tr><td><button class="hmw-link" data-store="${id}" data-context="attribution" data-cause-context="procurement-${m.id}">${m.name} →</button></td><td class="numeric">${num(r.purchaseKg,1)}</td><td class="numeric">${signed(r.priceImpact,4)}</td>${type==='food'?`<td class="numeric">${signed(r.mixImpact,4)}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;}
function storeCauseChildren(c,id){
  return `<h3>本店${c.name} · 细项勾稽</h3><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>细分因素</th><th class="numeric">本店利润影响 / 万元</th></tr></thead><tbody>${c.children.map(child=>`<tr><td><button class="hmw-link" data-store="${id}" data-context="attribution" data-cause-context="${child.id}">${child.name} →</button></td><td class="numeric">${signed(child.storeRows.find(r=>r.storeId===id).impact,4)}</td></tr>`).join('')}<tr class="total"><td>本店本项合计</td><td class="numeric">${signed(c.storeRows.find(r=>r.storeId===id).impact,4)}</td></tr></tbody></table></div>`;
}
function storeForecastAction(action,f,row,store){
  const target=action.id==='purchase'?`本店采购优化预计 ${num(row.purchaseSaving,4)}万元；逐项满足报价、锁量与分周交付条件。`:action.id==='usage'?`本店耗用优化预计 ${num(row.usageSaving,4)}万元；盘点实耗与标准应耗逐日核对。`:action.id==='labor'?`本店人工预算 ${num(row.labor)}万元、费率 ${pct(row.labor,row.revenue)}；其中可调工时优化 ${num(row.savingsByCost.labor,4)}万元。`:action.id==='utilities'?`本店能耗预算 ${num(row.utilities)}万元、费率 ${pct(row.utilities,row.revenue)}。`:action.id==='consumables'?`本店物耗预算 ${num(row.consumables)}万元、费率 ${pct(row.consumables,row.revenue)}。`:`本店预计 ${num(row.guests,0)}人次、人均 ${num(row.perCapita)}元；折扣 ${num(row.discount)}万元，市场推广预算 ${num(row.marketing)}万元。`;
  const prices=action.id==='purchase'?`<details class="hmw-detail"><summary>本店采购目标量与目标价</summary><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>原料</th><th class="numeric">本店预计公斤</th><th class="numeric">参考单价</th><th class="numeric">目标单价</th><th class="numeric">本店收益 / 万元</th></tr></thead><tbody>${f.priceTargets.map(p=>{const r=p.storeRows.find(r=>r.storeId===key(row));return `<tr><td>${p.name}</td><td class="numeric">${num(r.quantityKg,0)}</td><td class="numeric">${num(r.currentPrice)}</td><td class="numeric">${num(r.targetPrice)}</td><td class="numeric">${num(r.saving,4)}</td></tr>`;}).join('')}</tbody></table></div><p class="hmw-note">本店预计公斤×单价差÷10,000×整改达成率，计入上表食材成本；集团锁量由采购统一汇总，目标价待满足签约条件。</p></details>`:'';
  return `<article class="hmw-action"><h3>${action.title}</h3><p>${target}</p><p>${esc(action.condition)}</p><div class="hmw-action-meta"><span>门店负责人：${store.manager}</span><span>集团协同：${action.owner}</span><span>${action.deadlineRole||'截止'}：${action.deadline}</span></div>${prices}</article>`;
}
function trackingEvidence(r){
  let html='';
  const hours=r.findings.find(f=>f.hourlyCost);
  if(hours)html+=`<div class="hmw-equation">低峰临时工时（${num(hours.actual,0)} − ${num(hours.plan,0)}）小时 × ${num(hours.hourlyCost,0)}元/小时 ÷10,000 = ${num(-hours.impact,4)}万元额外人工费用</div>`;
  if(r.materialVariances?.length)html+=`<h3>临采价差明细</h3><div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>原料</th><th class="numeric">临采公斤</th><th class="numeric">目标价 / 元·公斤</th><th class="numeric">实际价</th><th class="numeric">超预算成本 / 万元</th></tr></thead><tbody>${r.materialVariances.map(m=>`<tr><td>${m.name}</td><td class="numeric">${num(m.quantityKg,0)}</td><td class="numeric">${num(m.targetPrice)}</td><td class="numeric">${num(m.actualPrice)}</td><td class="numeric">${num(m.extraCost,4)}</td></tr>`).join('')}</tbody></table></div><p class="hmw-note">各项为临采公斤×单价差÷10,000；销量变化对应的标准食材成本随实际人次另行变动。</p>`;
  if(r.usageVariance){const v=r.usageVariance;html+=`<div class="hmw-equation">${esc(v.basis)} ${num(v.standardUseCost,6)}万元 ×（${num(v.actualWasteRate,1)}% − ${num(v.allowedWasteRate,1)}%） = ${num(v.extraCost,6)}万元超标准报损</div>`;}
  return html;
}
function dialog(title,body,label='好美味餐饮集团 · 120家直营门店'){$('#hmwDialogTitle').textContent=title;$('#hmwDialogLabel').textContent=label;$('#hmwDialogBody').innerHTML=body;if(!$('#hmwDialog').open)$('#hmwDialog').showModal();$('#hmwDialog').scrollTop=0;}
function toast(message){$('#hmwToast').textContent=message;$('#hmwToast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#hmwToast').hidden=true,3200);}
function navigate(page){if(!pages.some(([id])=>id===page))page='attribution';if($('#hmwDialog').open)$('#hmwDialog').close();state.search='';location.hash=page;if(state.page===page)render();}
function render(){
  state.page=pages.some(([id])=>id===location.hash.slice(1))?location.hash.slice(1):'attribution';
  $('#hmwNav').innerHTML=pages.map(([id,label])=>`<button data-nav="${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span></button>`).join('');
  const title=pages.find(([id])=>id===state.page)[1];$('#hmwBreadcrumb').textContent=title;document.title=`${title} · 好美味餐饮集团智能决策平台`;
  $('#hmwMain').innerHTML=({attribution:renderAttribution,forecast:renderForecast,tracking:renderTracking})[state.page]();
}
document.addEventListener('click',event=>{
  const nav=event.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
  const cause=event.target.closest('[data-cause]');if(cause){showCause(cause.dataset.cause);return;}
  const causeTab=event.target.closest('[data-cause-tab]');if(causeTab){showCause(causeTab.dataset.causeTab,causeTab.dataset.tab);return;}
  const store=event.target.closest('[data-store]');if(store){showStore(store.dataset.store,store.dataset.context,store.dataset.causeContext);return;}
  const plan=event.target.closest('[data-select-plan]');if(plan){state.plan=plan.dataset.selectPlan;render();return;}
  const adjustment=event.target.closest('[data-adjust]');if(adjustment){adjustments[adjustment.dataset.adjust]=true;try{localStorage.setItem('haomeiwei-actions-v1',JSON.stringify(adjustments));}catch{}const dialogStore=$('#hmwDialogBody').dataset.activeStore;render();if($('#hmwDialog').open&&dialogStore)showStore(dialogStore,'tracking');toast('整改动作已登记，执行效果待下一周期复核');return;}
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='statement')dialog('9月与10月管理利润表',pnlTable([{label:'9月实际',row:M.actuals.september,rate:true},{label:'10月实际',row:M.actuals.october,rate:true}]));
  if(action==='stress'){state.volumeFactor=.8;render();toast('两套方案已按就餐人次80%同步重算');}
  if(action==='reset'){state.volumeFactor=1;state.executionRate=1;render();}
});
document.addEventListener('input',event=>{
  if(event.target.id==='volumeInput')$('#volumeValue').value=`${event.target.value}%`;
  if(event.target.id==='executionInput')$('#executionValue').value=`${event.target.value}%`;
  if(event.target.dataset.search){state.search=event.target.value;const type=event.target.dataset.search;$('#'+type+'Stores').innerHTML=type==='attribution'?attributionStoreTable(state.search):type==='forecast'?forecastStoreTable(getForecast(state.plan),state.search):trackingStoreTable(state.search);}
});
document.addEventListener('change',event=>{
  if(event.target.id==='volumeInput'||event.target.id==='executionInput'){state[event.target.id==='volumeInput'?'volumeFactor':'executionRate']=Number(event.target.value)/100;const top=scrollY;render();window.scrollTo(0,top);}
  if(event.target.id==='trackingFilter'){state.trackingFilter=event.target.value;$('#trackingStores').innerHTML=trackingStoreTable(state.search);}
});
$('#hmwClose').onclick=()=>$('#hmwDialog').close();
$('#hmwDialog').addEventListener('click',event=>{if(event.target===$('#hmwDialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
$('#hmwFullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('请在独立浏览器中使用全屏');}};
window.addEventListener('hashchange',()=>{state.search='';render();window.scrollTo(0,0);});
render();
</script>
</body>
</html>
