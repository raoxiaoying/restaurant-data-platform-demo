.ai-platform .hmw-mini-kpis{padding:18px;border:1px solid #e1e9f6;border-radius:11px;background:#f7faff}
.ai-platform #hmwDialog::backdrop{background:#14243d65;backdrop-filter:blur(5px)}
.ai-platform #hmwDialogLabel{color:#7993b5;font-size:12px;letter-spacing:.3px}
.ai-platform .hmw-dialog-body{padding:25px;background:#fff;scrollbar-width:thin;scrollbar-color:#cfdcee transparent}
.ai-platform .platform-context-drawer{top:68px;border-color:#dce6f5;background:#fbfcff;box-shadow:-12px 0 40px #254c7b0c}
.ai-platform .platform-context-drawer h2{color:#2c456a}
.ai-platform .platform-context-section h3{color:#7590b8;font-size:11px;letter-spacing:.6px}
.ai-platform .platform-context-section p,.ai-platform .platform-context-section li{color:#637e9f;font-size:13px}
.ai-platform .platform-context-section{border-color:#e4ebf6}

/* Category colors identify content; red and green always describe profit impact. */
.ai-platform .platform-thread .hmw-button.primary{border-color:var(--dolink-blue-strong);background:var(--dolink-blue-strong)}
.ai-platform .platform-thread .hmw-button.primary:hover{filter:brightness(.94)}
.ai-platform .ai-brief-section h3{color:var(--dolink-blue-strong)}
.ai-platform .ai-brief-caption{border-color:#d4e3ff;border-left-color:var(--dolink-blue);background:#f0f6ff}
.ai-platform .ai-brief-caption>strong{color:var(--dolink-blue-strong)}
.ai-platform .ai-brief-caption strong.bad{color:#be3453}
.ai-platform .ai-brief-caption strong.good{color:#087760}
.ai-platform .ai-brief-priorities [data-category=pricing]{--category-color:#995a0c;--category-soft:#fff7e9;--category-line:#e7b65c}
.ai-platform .ai-brief-priorities [data-category=food]{--category-color:#8054b8;--category-soft:#f7f0ff;--category-line:#b08bdb}
.ai-platform .ai-brief-priorities [data-category=labor]{--category-color:#3762ba;--category-soft:#eef5ff;--category-line:#79a1ee}
.ai-platform .ai-brief-priorities [data-category=opex]{--category-color:#a92370;--category-soft:#fff1f8;--category-line:#db2777}
.ai-platform .ai-brief-priorities li[data-category]{border-color:#e1e9f5;border-left:3px solid var(--category-line);background:#fff}
.ai-platform .ai-brief-priorities li[data-category]>strong{color:var(--category-color)}
.ai-platform .ai-brief-priorities strong .bad{color:#be3453}
.ai-platform .ai-brief-priorities strong .good{color:#087760}
.ai-platform .ai-insight-card{border-top:3px solid color-mix(in srgb,var(--task-accent) 55%,white);background:linear-gradient(140deg,var(--task-soft),#fff)}
.ai-platform .ai-insight-card h4{color:var(--task-accent)}
.ai-platform [data-page=forecast] .ai-insight-card:nth-child(2),.ai-platform [data-page=tracking] .ai-insight-card{border-color:#f0d9ad;border-top-color:#e2b25c;background:linear-gradient(140deg,#fff6e7,#fff)}
.ai-platform [data-page=forecast] .ai-insight-card:nth-child(2) h4,.ai-platform [data-page=tracking] .ai-insight-card h4{color:#945a08}
.ai-platform .ai-next-step>strong{color:var(--task-accent)}
.ai-platform .platform-artifact-button{border-color:color-mix(in srgb,var(--task-accent) 24%,white);background:linear-gradient(105deg,#fff,var(--task-soft))}
.ai-platform .platform-artifact-button>span,.ai-platform .platform-artifact-button>svg{color:var(--task-accent)}
.ai-platform .hmw-kpi{--kpi-color:#255ac7;--kpi-soft:#edf4ff;--kpi-line:#759cec}
.ai-platform .hmw-kpi:nth-child(2){--kpi-color:#7551c8;--kpi-soft:#f3edff;--kpi-line:#ae8bdc}
.ai-platform .hmw-kpi:nth-child(3){--kpi-color:#117970;--kpi-soft:#eaf8f3;--kpi-line:#69baa9}
.ai-platform .hmw-kpi,.ai-platform .ai-artifact .hmw-kpi{border-top:3px solid var(--kpi-line);background:linear-gradient(140deg,var(--kpi-soft),#fff)}
.ai-platform .hmw-kpi strong:not(.bad):not(.good),.ai-platform .ai-artifact .hmw-kpi strong:not(.bad):not(.good){color:var(--kpi-color)}
.ai-platform .hmw-table td.bad{background:#fff3f6}
.ai-platform .hmw-table td.good{background:#edf9f4}
.ai-platform .hmw-table tr[data-metric=revenue] td:not(.bad):not(.good){color:#0e7d82;background:#eef9fa}
.ai-platform .hmw-table tr[data-metric=grossProfit] td:not(.bad):not(.good){color:#7551c8;background:#f5f0fd}
.ai-platform .hmw-table tr[data-metric=profit] td:not(.bad):not(.good){color:#255ac7;background:#eaf2ff}
.ai-platform .hmw-plan{--plan-color:#255ac7;--plan-line:#739cec;--plan-soft:#edf4ff}
.ai-platform .hmw-plan[data-plan=anniversary]{--plan-color:#7551c8;--plan-line:#ad91e4;--plan-soft:#f1ecfc}
.ai-platform .hmw-plan:not(.selected){border-top:3px solid var(--plan-line)}
.ai-platform .hmw-plan.selected{border-color:var(--plan-line);background:linear-gradient(140deg,#fff,var(--plan-soft));box-shadow:inset 0 3px var(--plan-line),0 4px 18px #7551c810}
.ai-platform .hmw-plan .hmw-plan-title,.ai-platform .hmw-plan .hmw-plan-kpis>div:nth-child(2) strong{color:var(--plan-color)}
.ai-platform .hmw-plan .hmw-button.primary{border-color:var(--dolink-blue-strong);background:var(--dolink-blue-strong)}
.ai-platform .hmw-plan-kpis>div:nth-child(3) strong{color:#0e817c}
.ai-platform .hmw-tag.warn{border:1px solid #f1d59c;background:#fff0d3;color:#945a08}
.ai-platform .hmw-tag.good{border:1px solid #b8e3d4;background:#e5f6ee;color:#087760}
.ai-platform .hmw-tag.bad{border:1px solid #f0c5d0;background:#ffedf2;color:#be3453}
.ai-platform .hmw-tag.blue{border:1px solid #cbdcfc;background:#eaf2ff;color:#255ac7}
.ai-platform .ai-strategy-panel{border-color:#c7dbff;background:linear-gradient(125deg,#fff,#edf4ff)}
.ai-platform #aiEvidence .ai-strategy-panel h2,.ai-platform .ai-strategy-panel .ai-message-label{color:var(--dolink-blue-strong)}


.ai-platform .hmw-action{border-left:3px solid color-mix(in srgb,var(--task-accent,#326fff) 55%,white)}

/* Direct labels and shared scales keep the graphics readable without color. */
.ai-platform .ai-data-figure{min-width:0;margin:25px 0;padding:21px 0;border-block:1px solid #e5ebf5}
.ai-platform .ai-data-figure>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 14px;margin-bottom:18px}
.ai-platform .ai-data-figure>header>div{min-width:0;flex:1}
.ai-platform .ai-data-figure h4{width:100%;margin:0;color:#314e76;font-size:16px;font-weight:650;line-height:1.6}
.ai-platform .ai-summary .ai-data-figure>header p,.ai-platform .ai-data-description{flex:1;margin:0;color:#72849e;font-size:12px;line-height:1.85}
.ai-platform .ai-data-unit{flex:none;color:#7a8ca5;font-size:11px}
.ai-platform .ai-comparison{display:grid;gap:15px;margin:0;padding:0;list-style:none}
.ai-platform .ai-comparison-row{display:grid;grid-template-columns:minmax(115px,1fr) minmax(0,2.1fr) 112px;align-items:center;gap:13px;min-width:0}
.ai-platform .ai-comparison-label{color:#526b8e;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.ai-platform .ai-comparison-track{position:relative;height:23px;background:repeating-linear-gradient(90deg,#eef2f8 0 1px,transparent 1px 25%);isolation:isolate}
.ai-platform .ai-comparison-zero{position:absolute;top:-5px;bottom:-5px;width:1px;background:#97a9c4;z-index:1}
.ai-platform .ai-comparison-fill{position:absolute;top:2px;height:19px;background:var(--metric-color,#255ac7);border-radius:3px}
.ai-platform .ai-comparison-row[data-tone=positive]{--metric-color:#087760}
.ai-platform .ai-comparison-row[data-tone=negative]{--metric-color:#be3453}
.ai-platform .ai-comparison-row[data-tone=negative] .ai-comparison-fill{background:#df5d73}
.ai-platform .ai-comparison-row[data-tone=reference] .ai-comparison-fill{background:#8460dc}
.ai-platform .ai-comparison-row[data-tone=history] .ai-comparison-fill{background:#8199ba}
.ai-platform .ai-comparison-row strong.ai-comparison-value{color:var(--metric-color,#255ac7);font-size:15px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.ai-platform .ai-comparison-value>span{margin-left:4px;font-size:11px;font-weight:400}
.ai-platform .ai-comparison-scale{display:grid;grid-template-columns:minmax(115px,1fr) minmax(0,2.1fr) 112px;gap:13px;margin-bottom:7px}
.ai-platform .ai-comparison-scale-track{position:relative;height:15px}
.ai-platform .ai-comparison-origin{position:absolute;transform:translateX(-50%);color:#7b8ea9;font-size:10px;line-height:1.5}
.ai-platform .ai-data-figure>figcaption{margin-top:17px;padding:12px 14px;border-left:3px solid #c5d6f3;border-radius:0 7px 7px 0;background:#f4f7fc;color:#657b9b;font-size:12px;line-height:1.85}
.ai-platform .ai-progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.ai-platform .ai-progress-grid>div{min-width:0;padding:16px;border:1px solid #e0e9f6;border-radius:11px;background:#f8fbff}
.ai-platform .ai-progress-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:#547095;font-size:12px}
.ai-platform .ai-progress-label strong{color:#117970;font-size:23px;line-height:1.4;font-variant-numeric:tabular-nums;white-space:nowrap}
.ai-platform .ai-progress-label strong small{color:#7c8faa;font-size:11px;font-weight:400}
.ai-platform .ai-progress-grid>div:nth-child(2) .ai-progress-label strong{color:#255ac7}
.ai-platform .ai-progress-grid progress{display:block;width:100%;height:10px;overflow:hidden;border:0;border-radius:5px;background:#e8edf6;accent-color:#188e84;appearance:none}
.ai-platform .ai-progress-grid progress::-webkit-progress-bar{border-radius:5px;background:#e8edf6}
.ai-platform .ai-progress-grid progress::-webkit-progress-value{border-radius:5px;background:#188e84}
.ai-platform .ai-progress-grid progress::-moz-progress-bar{border-radius:5px;background:#188e84}
.ai-platform .ai-progress-grid>div:nth-child(2) progress::-webkit-progress-value{background:#4a79df}
.ai-platform .ai-progress-grid>div:nth-child(2) progress::-moz-progress-bar{background:#4a79df}
.ai-platform .ai-summary .ai-progress-grid p{margin:10px 0 0;color:#7488a7;font-size:11px;line-height:1.8}
.ai-platform .ai-result-block>.ai-data-figure{margin-block:22px}

.ai-platform .ai-contribution-composition{margin:0 0 20px}
.ai-platform .ai-donut-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.ai-platform .ai-donut-card{min-width:0;margin:0;padding:20px 18px 16px;border:1px solid #e3e9f3;border-radius:13px;background:#fff;--donut-tone:#be3453}
.ai-platform .ai-donut-card[data-kind=gain]{--donut-tone:#087760}
.ai-platform .ai-donut-card[data-kind=mixed]{--donut-tone:#304c75}
.ai-platform .ai-donut-card[data-kind=mixed] .ai-donut-content{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:center;gap:28px}
.ai-platform .ai-donut-card[data-kind=mixed] .ai-donut-plot{width:220px}
.ai-platform .ai-donut-card>header h4{margin:0;color:var(--donut-tone);font-size:15px;font-weight:650;line-height:1.6}
.ai-platform .ai-donut-content{display:flex;flex-direction:column;gap:14px}
.ai-platform .ai-donut-plot{width:180px;max-width:100%;margin:10px auto 0}
.ai-platform .ai-donut-svg{display:block;width:100%;height:auto;overflow:visible;font-family:inherit}
.ai-platform .ai-donut-svg text{text-anchor:middle}
.ai-platform .ai-donut-center-label{fill:#798ba5;font-size:11px}
.ai-platform .ai-donut-center-total{fill:var(--donut-tone);font-size:26px;font-weight:650;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.ai-platform .ai-donut-center-unit{fill:#798ba5;font-size:12px}
.ai-platform .ai-donut-legend{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.ai-platform .ai-donut-legend button{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto;align-items:center;gap:9px;width:100%;padding:9px 0;border:0;border-bottom:1px solid #edf1f7;border-radius:0;background:transparent;color:#526b8d;text-align:left;cursor:pointer}
.ai-platform .ai-donut-legend li:last-child button{border-bottom:0}
.ai-platform .ai-donut-legend button:hover{background:#f5f8fd;color:#2f5b9d}
.ai-platform .ai-donut-dot{display:block;width:8px;height:8px;border-radius:50%}
.ai-platform .ai-donut-label{min-width:0;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
.ai-platform .ai-donut-direction{display:inline-block;margin-left:7px;padding:0 5px;border-radius:4px;font-size:10px;white-space:nowrap}
.ai-platform .ai-donut-direction[data-direction=loss]{color:#be3453;background:#fff0f3}
.ai-platform .ai-donut-direction[data-direction=gain]{color:#087760;background:#eaf7f1}
.ai-platform .ai-donut-card[data-kind=mixed] [data-direction=loss] .ai-donut-value{color:#be3453}
.ai-platform .ai-donut-card[data-kind=mixed] [data-direction=gain] .ai-donut-value{color:#087760}
.ai-platform .ai-donut-value{color:#6c809e;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ai-platform .ai-donut-share{min-width:44px;color:#334f78;font-size:15px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ai-platform .ai-donut-card>figcaption{margin-top:12px;padding-top:11px;border-top:1px solid #e9eef6;color:#617590;font-size:12px;line-height:1.85}
.ai-platform .ai-contribution-net{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin-top:17px;padding:17px 19px;border:1px solid #e1e9f5;border-radius:11px;background:#f5f8fd}
.ai-platform .ai-contribution-net small{display:block;color:#7084a3;font-size:12px}
.ai-platform .ai-contribution-net strong{display:block;margin-top:5px;font-size:23px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.6px;white-space:nowrap}
.ai-platform .ai-contribution-net .is-loss strong{color:#be3453}
.ai-platform .ai-contribution-net .is-gain strong{color:#087760}
.ai-platform .ai-contribution-net strong span{margin-left:5px;color:#7c8ea8;font-size:11px;font-weight:400;letter-spacing:0}
.ai-platform .ai-contribution-net>b{color:#8ea3c1;font-size:21px;font-weight:400}
.ai-platform .ai-contribution-detail{margin-top:18px}
.ai-platform .ai-contribution-detail>summary{width:fit-content;padding:8px 0;color:#5176b0;font-size:13px;line-height:1.7;cursor:pointer}
.ai-platform .ai-contribution-detail[open]>summary{margin-bottom:12px}

.ai-platform .ai-week-variance{min-width:0}
.ai-platform .ai-week-variance .is-loss{--variance-color:#be3453;--variance-fill:#df6c82;--variance-soft:#fff3f6}
.ai-platform .ai-week-variance .is-gain{--variance-color:#087760;--variance-fill:#28a68b;--variance-soft:#eef9f4}
.ai-platform .ai-week-variance .is-flat{--variance-color:#526b8f;--variance-soft:#f2f6fc}
.ai-platform .ai-variance-summary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:24px;padding:22px;border:1px solid #f0d1d9;border-radius:13px;background:#fff5f7;--outcome-color:#be3453;--outcome-soft:#fbe4eb}
.ai-platform .ai-variance-summary[data-direction=gain]{border-color:#cbe6dc;background:#f0faf5;--outcome-color:#087760;--outcome-soft:#dbf2e8}
.ai-platform .ai-variance-summary[data-direction=flat]{border-color:#dfe7f4;background:#f6f9fd;--outcome-color:#526b8f;--outcome-soft:#e8eef7}
.ai-platform .ai-variance-outcome{display:flex;align-items:center;gap:14px;min-width:0}
.ai-platform .ai-variance-icon,.ai-platform .ai-variance-group-icon{display:grid;place-items:center;flex:none;width:43px;height:43px;border-radius:12px;background:var(--outcome-soft);color:var(--outcome-color)}
.ai-platform .ai-variance-icon svg{width:25px;height:25px}
.ai-platform .ai-variance-outcome>div{min-width:0}
.ai-platform .ai-variance-outcome small{display:block;color:#886272;font-size:13px}
.ai-platform .ai-variance-outcome strong{display:block;margin-top:3px;color:var(--outcome-color);font-size:33px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.45;white-space:nowrap}
.ai-platform .ai-variance-outcome strong>span{margin-left:6px;font-size:14px;font-weight:500;letter-spacing:0}
.ai-platform .ai-variance-summary dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0;padding-left:22px;border-left:1px solid #e8cdd7}
.ai-platform .ai-variance-summary dt{color:#7b7f94;font-size:12px}
.ai-platform .ai-variance-summary dd{margin:6px 0 0;color:#4d617e;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ai-platform .ai-variance-summary dd>span{margin-left:4px;font-size:11px;font-weight:400}
.ai-platform .ai-variance-equation{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin:20px 0}
.ai-platform .ai-variance-equation>div{min-width:0;padding:15px 16px;border:1px solid #e5eaf3;border-radius:10px;background:var(--variance-soft)}
.ai-platform .ai-variance-equation small{display:block;color:#6a7c96;font-size:12px}
.ai-platform .ai-variance-equation strong{display:block;margin-top:5px;color:var(--variance-color);font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.4px}
.ai-platform .ai-variance-equation strong>span{margin-left:4px;font-size:11px;font-weight:400}
.ai-platform .ai-variance-equation>b{color:#97a8bf;font-size:20px;font-weight:400}
.ai-platform .ai-variance-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:18px}
.ai-platform .ai-variance-groups>section{min-width:0;padding:19px;border:1px solid #e1e8f3;border-radius:12px;background:#fff}
.ai-platform .ai-variance-groups header{display:flex;align-items:center;gap:11px;margin-bottom:19px}
.ai-platform .ai-variance-group-icon{width:34px;height:34px;border-radius:9px;background:var(--variance-soft);color:var(--variance-color)}
.ai-platform .ai-variance-group-icon svg{width:20px;height:20px}
.ai-platform #aiEvidence .ai-variance-groups h3{margin:0;color:var(--variance-color);font-size:15px;font-weight:650;line-height:1.6}
.ai-platform #aiEvidence .ai-variance-groups header p{margin:4px 0 0;color:#7b8ca6;font-size:11px;line-height:1.8}
.ai-platform .ai-variance-groups ol{display:grid;gap:17px;margin:0;padding:0;list-style:none}
.ai-platform .ai-variance-row-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;margin-bottom:8px}
.ai-platform .ai-variance-row-head>span{color:#526a8c;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.ai-platform .ai-variance-row-head strong{color:var(--variance-color);font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.ai-platform .ai-variance-row-head strong small{margin-left:4px;font-size:10px;font-weight:400}
.ai-platform .ai-variance-track{height:5px;overflow:hidden;border-radius:3px;background:#f0f3f8}
.ai-platform .ai-variance-track i{display:block;height:100%;border-radius:3px;background:var(--variance-fill)}
.ai-platform .ai-variance-empty{color:#8a99af;font-size:12px}
.ai-platform #aiEvidence .ai-variance-footnote{margin:18px 0 0;color:#7487a3;font-size:12px;line-height:1.9}

@media(max-width:1100px){
  .ai-platform .hmw-topbar{padding-inline:20px}
  .ai-platform #hmwMain{padding:26px 24px 20px}
  .ai-platform .platform-composer-wrap{padding-inline:24px}
  .ai-platform .platform-suggestions{gap:10px}
  .ai-platform .platform-suggestion{padding:17px}
  .ai-platform .platform-app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ai-platform .ai-summary-metrics>div{padding-inline:14px}
  .ai-platform .ai-summary-metrics strong{font-size:25px}
  .ai-platform [data-page=tracking] .ai-insight-grid{grid-template-columns:minmax(0,1fr)}
  .ai-platform .hmw-plan-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ai-platform .ai-variance-summary{grid-template-columns:minmax(0,1fr);gap:16px}
  .ai-platform .ai-variance-summary dl{padding-left:0;padding-top:14px;border-left:0;border-top:1px solid #e8cdd7}
  .ai-platform .ai-variance-groups{grid-template-columns:minmax(0,1fr)}
  .ai-platform .ai-variance-equation{gap:8px}
  .ai-platform .ai-variance-equation>div{padding:13px 10px}
  .ai-platform .ai-variance-equation strong{font-size:18px}
  .ai-platform .ai-donut-grid{grid-template-columns:minmax(0,1fr)}
  .ai-platform .ai-donut-content{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;gap:18px}

  <script>/* 好美味餐饮集团：用于产品演示的合成业务模型。金额：万元；采购价格：元/公斤。 */
(function (root) {
  'use strict';

  const SCALE = 1000000; // 万元保留至分，所有加总在金额最小单位上分配。
  const DATA_VERSION = 'DEMO-COST-FOCUS-V5';
  const FORECAST_VERSION = 'NOV-COST-FOCUS-V3';
  const money = n => Math.round(n * SCALE) / SCALE;
  const sum = values => money(values.reduce((a, b) => a + b, 0));
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
  const expenseKeys = ['food', 'labor', 'rent', 'utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'];
  const labels = { revenue: '折后营业额', food: '食材成本', labor: '人工费用', rent: '租金及物业费', utilities: '能耗费用', tableware: '餐具', consumables: '物耗', maintenance: '维修维护费', marketing: '市场推广费', otherStoreExpense: '其他费用', profit: '门店经营利润' };
  function allocate(total, weights, scale = SCALE) {
    const units = Math.round(total * scale);
    const denominator = weights.reduce((a, b) => a + b, 0);
    const exact = weights.map(w => units * w / denominator);
    const result = exact.map(Math.floor);
    let left = units - result.reduce((a, b) => a + b, 0);
    const order = exact.map((v, i) => ({ i, fraction: v - result[i] })).sort((a, b) => b.fraction - a.fraction || a.i - b.i);
    for (let i = 0; i < left; i++) result[order[i].i]++;
    return result.map(n => n / scale);
  }
  function complete(row) {
    const result = { ...row };
    result.expenses = sum(expenseKeys.map(k => result[k] || 0));
    result.grossProfit = money(result.revenue - result.food);
    result.operatingExpenses = money(result.expenses - result.food);
    result.otherExRent = sum(['utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'].map(k => result[k] || 0));
    result.other = money(result.otherExRent + result.rent);
    result.profit = money(result.revenue - result.expenses);
    result.margin = result.revenue ? result.profit / result.revenue * 100 : 0;
    result.foodRate = result.revenue ? result.food / result.revenue * 100 : 0;
    result.laborRate = result.revenue ? result.labor / result.revenue * 100 : 0;
    result.perCapita = result.guests ? result.revenue * 10000 / result.guests : 0;
    return result;
  }
  function aggregate(rows) {
    const keys = ['revenue', ...expenseKeys, 'grossSales', 'discount', 'guests', 'orders'];
    return complete(Object.fromEntries(keys.map(key => [key, sum(rows.map(row => row[key] || 0))])));
  }
  const locations = [
    ['上海', '华东'], ['杭州', '华东'], ['南京', '华东'], ['苏州', '华东'],
    ['北京', '华北'], ['天津', '华北'], ['济南', '华北'], ['青岛', '华北'],
    ['广州', '华南'], ['深圳', '华南'], ['佛山', '华南'], ['东莞', '华南']
  ];
  const storeBases = Array.from({ length: 120 }, (_, i) => {
    const [city, region] = locations[Math.floor(i / 10)];
    const rank = i * 37 % 120;
    const size = rank < 12 ? 3.2 : rank < 36 ? 1.6 : rank < 84 ? .7 : .25;
    const weight = (80 + i * 37 % 61) * size;
    return { id: `HMW-${String(i + 1).padStart(3, '0')}`, name: `${city}${String(i % 10 + 1).padStart(2, '0')}店`, city, region,
      manager: `${city}${i % 10 + 1}店店长`, format: i % 4 === 0 ? '社区店' : '商场店', seats: Math.max(36, Math.round((96 + i * 17 % 8 * 12) * size)),
      weight, demandWeight: weight * (.88 + i * 7 % 11 / 40),
      staffingWeight: weight * (.25 + (i * 17 + 5) % 23 / 7),
      promoWeight: weight * (.25 + (i * 19 + 3) % 23 / 7) };
  });
  const weights = key => storeBases.map(s => s[key] || s.weight);
  const ingredientWeights = index => storeBases.map((s, i) => s.weight * (0.8 + (i * (index + 3) + index * 7) % 41 / 100));
  const distribute = (total, key = 'weight') => allocate(total, weights(key));
  const septemberInputs = { revenue: 4000, food: 1400, labor: 1000, rent: 600, utilities: 120, tableware: 32, consumables: 48, maintenance: 40, marketing: 100, otherStoreExpense: 260, grossSales: 4200, guests: 480000, orders: 200000 };
  const septemberColumns = Object.fromEntries(Object.entries(septemberInputs).map(([k, v]) => [k, allocate(v, weights('weight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const volumeColumns = Object.fromEntries(Object.entries({ revenue: 200, food: 70, labor: 30, utilities: 6, tableware: 1.6, consumables: 2.4, maintenance: 2, marketing: 5, otherStoreExpense: 13, grossSales: 210, guests: 24000, orders: 10000 }).map(([k, v]) => [k, allocate(v, weights('demandWeight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const priceDiscount = distribute(50, 'promoWeight');
  const laborExcess = distribute(120, 'staffingWeight');
  const usageExcess = allocate(23, ingredientWeights(12).map((weight, i) => weight * (.2 + (i * 29 + 7) % 19 / 5)));
  const opexExcessTotals = { utilities: 4, tableware: 0, consumables: 2, maintenance: 2, marketing: 7, otherStoreExpense: 25 };
  const opexExcessColumns = Object.fromEntries(Object.entries(opexExcessTotals).map(([k, total], i) => [k, allocate(total, ingredientWeights(i + 15))]));

  const materialSpecs = [
    { id: 'chicken', name: '鸡肉', dish: '招牌香煎鸡腿', kg: 100000, basePrice: 18, actualPrice: 20, reason: '原料市场价上行；月度到货价较9月基准上涨2.00元/公斤。', evidence: '10月验收入库100,000公斤，采购发票加权价20.00元/公斤；9月同等级同规格18.00元/公斤。' },
    { id: 'beef', name: '牛肉', dish: '黑椒牛肉粒', kg: 50000, basePrice: 60, actualPrice: 66, reason: '同等级冷鲜牛肉到货价上升，既有月度合约未覆盖全部需求。', evidence: '10月同规格验收50,000公斤，实际66.00元/公斤，对比9月60.00元/公斤。' },
    { id: 'pork', name: '五花肉', dish: '砂锅红烧肉', kg: 50000, basePrice: 28, actualPrice: 30, reason: '同部位规格采购价上涨2.00元/公斤。', evidence: '10月验收50,000公斤，实际30.00元/公斤，对比9月28.00元/公斤。' },
    { id: 'cheese', name: '芝士', dish: '芝士焗鸡肉饭', forecastServings: 50000, standardKg: 0.1, basePrice: 40, spotPrice: 56, netSellingPrice: 32, reason: '新品预估5万份，仅锁定5,000公斤试销配额；实际10万份，追加5,000公斤按现货价采购。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'hairtail', name: '带鱼', dish: '香酥带鱼', forecastServings: 40000, standardKg: 0.25, basePrice: 24, spotPrice: 30, netSellingPrice: 48, reason: '新品预估4万份，锁定10,000公斤试销配额；实际8万份，超量现货采购10,000公斤。', minimumCommitmentKg: 20000, quoteDeadline: '10月05日' },
    { id: 'crab', name: '螃蟹', dish: '蟹肉豆腐煲', forecastServings: 25000, standardKg: 0.2, basePrice: 45, spotPrice: 55, netSellingPrice: 58, reason: '新品预估2.5万份，锁定5,000公斤试销配额；实际5万份，追加5,000公斤未签整月合约。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'pigeon', name: '鸽子', dish: '脆皮乳鸽拼盘', forecastServings: 20000, standardKg: 0.25, basePrice: 40, spotPrice: 48, netSellingPrice: 48, reason: '新品预估2万份，锁定5,000公斤试销配额；实际4万份，追加5,000公斤按临采价结算。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'fishball', name: '鱼丸', dish: '鲜汤鱼丸煲', forecastServings: 50000, standardKg: 0.2, basePrice: 16, spotPrice: 18, netSellingPrice: 28, reason: '新品预估5万份，锁定10,000公斤试销配额；实际10万份，新增10,000公斤未进入首单配额。', minimumCommitmentKg: 20000, quoteDeadline: '10月05日' }
  ];
  const materials = materialSpecs.map((spec, materialIndex) => {
    const newProduct = Boolean(spec.forecastServings);
    const portions = newProduct ? allocate(spec.forecastServings, ingredientWeights(materialIndex), 1) : null;
    const quantities = newProduct ? null : allocate(spec.kg, ingredientWeights(materialIndex), 1);
    const storeRows = storeBases.map((store, i) => {
      const forecastServings = newProduct ? portions[i] : 0;
      const actualServings = forecastServings * 2;
      const lockedKg = newProduct ? forecastServings * spec.standardKg : 0;
      const purchaseKg = newProduct ? actualServings * spec.standardKg : quantities[i];
      const spotKg = newProduct ? purchaseKg - lockedKg : 0;
      const actualPrice = newProduct ? (spec.basePrice + spec.spotPrice) / 2 : spec.actualPrice;
      const priceImpact = money(-(newProduct ? spotKg * (spec.spotPrice - spec.basePrice) : purchaseKg * (actualPrice - spec.basePrice)) / 10000);
      return { storeId: store.id, storeName: store.name, region: store.region, forecastServings, actualServings, purchaseKg: money(purchaseKg), standardKg: spec.standardKg || null,
        lockedKg: money(lockedKg), spotKg: money(spotKg), basePrice: spec.basePrice, actualPrice, impact: priceImpact, priceImpact,
        actualPurchaseAmount: money(purchaseKg * actualPrice / 10000), referencePurchaseAmount: money(purchaseKg * spec.basePrice / 10000) };
    });
    const forecastServings = newProduct ? spec.forecastServings : 0;
    const actualServings = forecastServings * 2;
    const purchaseKg = newProduct ? actualServings * spec.standardKg : spec.kg;
    const actualPrice = newProduct ? (spec.basePrice + spec.spotPrice) / 2 : spec.actualPrice;
    return { ...spec, newProduct, unit: '公斤', quantity: purchaseKg, quantityKg: purchaseKg, purchaseKg, forecastServings, actualServings, forecastQuantity: forecastServings, actualQuantity: actualServings, standardUsageKg: purchaseKg, baselinePrice: spec.basePrice, scene: spec.reason,
      lockedKg: newProduct ? purchaseKg / 2 : 0, spotKg: newProduct ? purchaseKg / 2 : 0, actualPrice,
      impact: sum(storeRows.map(row => row.priceImpact)), priceImpact: sum(storeRows.map(row => row.priceImpact)),
      actualPurchaseAmount: sum(storeRows.map(row => row.actualPurchaseAmount)), referencePurchaseAmount: sum(storeRows.map(row => row.referencePurchaseAmount)),
      evidence: spec.evidence || `首单试销配额${purchaseKg / 2}公斤，实际标准用量${purchaseKg}公斤；首单配额结算价${spec.basePrice}元/公斤（与9月该原料同规格发票基准价相同），超量现货价${spec.spotPrice}元/公斤，加权价${actualPrice}元/公斤。`,
      formula: newProduct ? '超出锁价量的采购公斤 ×（现货结算价－原锁量价）÷10,000' : '同规格实际采购公斤 ×（10月加权价－9月基准价）÷10,000',
      procurementNote: newProduct ? `首单${purchaseKg / 2}公斤为供应商限量试销配额，沿用9月同规格结算价，并非正式整月批量合约。正式整月采购需在${spec.quoteDeadline}前承诺${spec.minimumCommitmentKg}公斤；原预估不足以承诺，该门槛未落实，追加部分按现货价结算。归因只计已结算价差，不叠加未签意向报价。` : '只比较同品级同规格实际发票价，不把不同等级混在价格差中。',
      storeRows };
  });
  const procurementByStore = storeBases.map((_, i) => sum(materials.map(m => m.storeRows[i].priceImpact)));
  const stores = storeBases.map((base, i) => {
    const september = complete(Object.fromEntries(Object.entries(septemberColumns).map(([k, values]) => [k, values[i]])));
    september.discount = money(september.grossSales - september.revenue);
    const octoberRow = { ...september };
    for (const [key, values] of Object.entries(volumeColumns)) octoberRow[key] = money(octoberRow[key] + values[i]);
    octoberRow.revenue = money(octoberRow.revenue - priceDiscount[i]);
    octoberRow.food = money(octoberRow.food - procurementByStore[i] + usageExcess[i]);
    octoberRow.labor = money(octoberRow.labor + laborExcess[i]);
    for (const [key, values] of Object.entries(opexExcessColumns)) octoberRow[key] = money(octoberRow[key] + values[i]);
    octoberRow.discount = money(octoberRow.grossSales - octoberRow.revenue);
    const october = complete(octoberRow);
    return { ...base, storeId: base.id, storeName: base.name, september, october, actuals: { september, october },
      causes: {}, profitChange: money(october.profit - september.profit), capacityGuestsPerDay: base.seats * 2.1 };
  });
  const actuals = { september: aggregate(stores.map(s => s.september)), october: aggregate(stores.map(s => s.october)) };
  // 独立的演示渠道输入；不从既有堂食桌单 orders 反推外卖订单。
  const deliveryCounts = { september: allocate(120000, weights('weight'), 1), october: allocate(126000, weights('demandWeight'), 1) };
  const opexKeys = expenseKeys.filter(k => !['food', 'labor'].includes(k));
  const fixedLabor = allocate(900, weights('weight'));
  const attributionByStore = stores.map((store, i) => {
    const a = store.september, b = store.october;
    const channels = Object.fromEntries(['september', 'october'].map(month => {
      const row = store[month], orders = deliveryCounts[month][i], dineRevenue = money(row.revenue * .8);
      const guests = row.guests - orders; // 演示假设：每个外卖有效订单计1份综合就餐人次。
      return [month, { dineIn: { guests, orders: row.orders, revenue: dineRevenue, unitPrice: dineRevenue * 10000 / guests },
        delivery: { orders, revenue: money(row.revenue - dineRevenue), unitPrice: (row.revenue - dineRevenue) * 10000 / orders } }];
    }));
    const dineRevenue = money(channels.september.dineIn.unitPrice * channels.october.dineIn.guests / 10000);
    const deliveryRevenue = money(channels.september.delivery.unitPrice * channels.october.delivery.orders / 10000);
    const referenceRevenue = sum([dineRevenue, deliveryRevenue]);
    const referenceCosts = Object.fromEntries(expenseKeys.map(k => [k, money(referenceRevenue * a[k] / a.revenue)]));
    const baseline = complete({ ...referenceCosts, revenue: referenceRevenue, grossSales: money(referenceRevenue * a.grossSales / a.revenue),
      discount: money(referenceRevenue * a.discount / a.revenue), guests: b.guests, orders: b.orders });
    channels.baseline = { dineIn: { ...channels.october.dineIn, revenue: dineRevenue, unitPrice: channels.september.dineIn.unitPrice },
      delivery: { ...channels.october.delivery, revenue: deliveryRevenue, unitPrice: channels.september.delivery.unitPrice } };
    const foodStandard = { rateReferenceCost: baseline.food, standardCost: money(a.food + volumeColumns.food[i]),
      priceCost: -procurementByStore[i], excessCost: usageExcess[i], actualCost: b.food };
    foodStandard.alignmentImpact = money(foodStandard.rateReferenceCost - foodStandard.standardCost);
    const standardLaborCost = money(a.labor + volumeColumns.labor[i]);
    const laborStandard = { rateReferenceCost: baseline.labor, fixedCost: fixedLabor[i], standardCost: standardLaborCost, actualCost: b.labor,
      hourlyCost: 30, standardHours: (standardLaborCost - fixedLabor[i]) * 10000 / 30,
      actualHours: (b.labor - fixedLabor[i]) * 10000 / 30,
      structureImpact: money(baseline.labor - standardLaborCost), executionImpact: money(standardLaborCost - b.labor) };
    const factors = { volume: money(baseline.profit - a.profit), pricing: money(b.revenue - baseline.revenue),
      food: money(baseline.food - b.food), procurement: procurementByStore[i], usage: -usageExcess[i],
      'food-standard': foodStandard.alignmentImpact, labor: money(baseline.labor - b.labor),
      opex: sum(opexKeys.map(k => money(baseline[k] - b[k]))) };
    store.causes = factors;
    let row = { ...baseline };
    const steps = [{ id: 'september', label: '9月实际利润', row: a, impact: 0 },
      { id: 'volume', label: '替换堂食人次与外卖订单', row: baseline, impact: factors.volume }];
    function replace(id, label, changes) {
      const next = complete({ ...row, ...changes });
      steps.push({ id, label, row: next, impact: money(next.profit - row.profit) }); row = next;
    }
    replace('pricing', '替换净成交价与销售优惠', { revenue: b.revenue, grossSales: b.grossSales, discount: b.discount });
    replace('food-standard', '衔接实际销量的标准食材成本', { food: foodStandard.standardCost });
    replace('procurement', '替换同规格原料采购价格', { food: money(row.food - factors.procurement) });

(function () {

          <span class="ai-comparison-fill" style="left:${left}%;width:${width}%"></span>

    }).join('');

    const legend = rows.map(row => {
      const share = Math.abs(row.value) / total * 100;

  }
  function createDocuments(state, storeId, weeklyKey, nowISO) {
    const weekly = currentWeekly(state, storeId, weeklyKey), plan = weekly.plan;

    const receipt = {
      batchId: 'DEMO-BATCH-' + suffix, key: weeklyKey, storeId, storeName: plan.storeName,

        payload: { storeId, sourceVersion: plan.sourceVersion,
          employees: clone(plan.staffing.employees), daily: clone(plan.staffing.daily) }
      }
    };

    next.dispatches.push(clone(receipt));
    return { state: next, receipt, reused: false };

  return `<div class="hmw-table-wrap store-scroll"><table class="hmw-table"><thead><tr><th>门店</th><th class="numeric">计划营业额</th><th class="numeric">实际营业额</th><th class="numeric">计划利润</th><th class="numeric">实际利润</th><th class="numeric">利润偏差 / 万元</th><th>执行状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="hmw-link" data-store="${key(r)}" data-context="tracking">${key(r)} · ${storeName(r)}</button><small>${r.region}</small></td><td class="numeric">${amt(r.plan.revenue)}</td><td class="numeric">${amt(r.actual.revenue)}</td><td class="numeric">${amt(r.plan.profit)}</td><td class="numeric">${amt(r.actual.profit)}</td><td class="numeric ${badClass(r.actual.profit-r.plan.profit)}">${signedAmt(r.actual.profit-r.plan.profit,6)}</td><td><span class="hmw-tag ${r.actions?.length?'warn':'good'}">${r.actions?.length?(r.actions.every(actionAdjusted)?'效果待复核':'待整改'):'按计划执行'}</span></td></tr>`).join('')||'<tr><td colspan="7" class="hmw-empty">没有匹配门店</td></tr>'}</tbody></table></div>`;
}
function trackingBridge(){
  const s=M.tracking.summary,net=(Math.round(s.actual.profit*1000000)-Math.round(s.plan.profit*1000000))/1000000;
  const factors=s.attributions.filter(r=>r.impact!==0);
  const losses=factors.filter(r=>r.impact<0).sort((a,b)=>a.impact-b.impact),gains=factors.filter(r=>r.impact>0).sort((a,b)=>b.impact-a.impact);
  const loss=-losses.reduce((sum,r)=>sum+Math.round(r.impact*1000000),0)/1000000,gain=gains.reduce((sum,r)=>sum+Math.round(r.impact*1000000),0)/1000000,max=Math.max(0,...factors.map(r=>Math.abs(r.impact)));
  const isLoss=net<0,tone=net<0?'loss':net>0?'gain':'flat',money=value=>amt(value,6);
  const trendMark=up=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${up?'M4 17l6-6 4 4 6-8M14 7h6v6':'M4 7l6 6 4-4 6 8M14 17h6v-6'}"/></svg>`;
  const rows=items=>items.map(r=>{
    const label=r.key==='revenue'?`营业额${r.impact<0?'低于':'高于'}计划`:`${r.name}${['tableware','consumables'].includes(r.key)?'费用':''}${r.impact<0?'超出':'低于'}计划`;
    return `<li data-variance-key="${r.key}" data-impact="${r.impact}"><div class="ai-variance-row-head"><span>${esc(label)}</span><strong>${signedAmt(r.impact,6)}<small>万元</small></strong></div><div class="ai-variance-track" aria-hidden="true"><i style="width:${max?Math.abs(r.impact)/max*100:0}%"></i></div></li>`;
  }).join('');
  const unchanged=s.attributions.filter(r=>r.impact===0).map(r=>r.name);
  return `<section class="ai-week-variance" aria-label="本周利润差额与原因，金额单位：万元"><div class="ai-variance-summary" data-direction="${tone}"><div class="ai-variance-outcome"><span class="ai-variance-icon">${net===0?'<span aria-hidden="true">＝</span>':trendMark(net>0)}</span><div><small>${net===0?'本周利润与计划持平':`本周比计划${isLoss?'少赚':'多赚'}`}</small><strong data-net-yuan="${net*10000}">${money(Math.abs(net))}<span>万元</span></strong></div></div><dl><div><dt>周计划利润</dt><dd>${money(s.plan.profit)}<span>万元</span></dd></div><div><dt>本周实际利润</dt><dd>${money(s.actual.profit)}<span>万元</span></dd></div></dl></div><div class="ai-variance-equation" aria-label="增利与减利相抵后的净差额，金额单位：万元"><div class="${isLoss?'is-loss':'is-gain'}"><small>${isLoss?'减利合计':'增利合计'}</small><strong>${money(isLoss?loss:gain)}<span>万元</span></strong></div><b aria-hidden="true">−</b><div class="${isLoss?'is-gain':'is-loss'}"><small>${isLoss?'增利抵消':'减利抵消'}</small><strong>${money(isLoss?gain:loss)}<span>万元</span></strong></div><b aria-hidden="true">＝</b><div class="is-${tone}"><small>${net===0?'净变化':isLoss?'净少赚':'净多赚'}</small><strong>${money(Math.abs(net))}<span>万元</span></strong></div></div><div class="ai-variance-groups"><section class="is-loss"><header><span class="ai-variance-group-icon">${trendMark(false)}</span><div><h3>哪些项目拉低利润</h3><p>${losses.length}项 · 减利${money(loss)}万元</p></div></header><ol>${rows(losses)||'<li class="ai-variance-empty">没有减利项目</li>'}</ol></section><section class="is-gain"><header><span class="ai-variance-group-icon">${trendMark(true)}</span><div><h3>${isLoss?'哪些项目抵消了下降':'哪些项目增加利润'}</h3><p>${gains.length}项 · 增利${money(gain)}万元</p></div></header><ol>${rows(gains)||'<li class="ai-variance-empty">没有增利项目</li>'}</ol></section></div><p class="ai-variance-footnote">两组条形共用金额尺度，按利润影响大小排序。费用低于计划不自动认定为整改收益。${unchanged.length?`${esc(unchanged.join('、'))}与计划一致，利润影响0万元。`:''}</p></section>`;
}
function forecastAssumptions(f){

  return `<p>${esc(f.assumptions.demand)}</p><div class="hmw-mini-kpis"><div><small>食材目标费率</small><strong>${pct(f.totals.food,f.totals.revenue)}</strong></div><div><small>人工目标费率</small><strong>${pct(f.totals.labor,f.totals.revenue)}</strong></div><div><small>产能余量≥10%门店</small><strong>${f.capacityReadyStoreCount}<span>/120</span></strong></div></div><ul class="hmw-note">${f.assumptions.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><p class="hmw-note">${esc(f.assumptions.note)}</p><p class="hmw-note">${esc(f.assumptions.readiness||'')}</p>${overloaded.length?`<div class="hmw-insight"><span><strong>${overloaded.length}家门店预计超过现有产能</strong>　须先调整活动客流分配或确认增加承接能力；本预测以约束得到解决为条件。</span></div>`:''}`;
}
function causeTabs(c,tab){return `<div class="hmw-tabs"><button class="${tab==='detail'?'active':''}" data-cause-tab="${c.id}" data-tab="detail">细项分析</button><button class="${tab==='stores'?'active':''}" data-cause-tab="${c.id}" data-tab="stores">120家门店分布</button></div>`;}
function showCause(id,tab='detail'){
  const c=M.getCauseDetail(id);if(!c)return;
  const back=c.parentId?`<p><button class="hmw-link" data-cause="${c.parentId}">← 返回${M.getCauseDetail(c.parentId).name}</button></p>`:'';
  const parent=c.parentId?M.getCauseDetail(c.parentId):null;
  let body=back+`<div class="hmw-mini-kpis"><div><small>本项利润影响</small><strong class="${badClass(c.impact)}">${signed(c.impact)}<span>万</span></strong></div><div><small>${parent?'占上层净影响':'占顶层不利影响'}</small><strong>${parent?(parent.impact?signed(c.impact/parent.impact*100,1)+'%':'—'):(c.impact<0?pct(-c.impact,M.group.negativeTotal):'—')}</strong></div><div><small>对环比净下降的贡献</small><strong>${signed(c.netDeclineShare,1)}<span>%</span></strong></div></div>`+causeTabs(c,tab);
  if(tab==='stores')body+=causeStoreRows(c);
  else {
    body+=`<h3>经营场景</h3><p>${esc(c.reason)}</p><h3>金额依据</h3><p>${esc(c.evidence)}</p>${c.formula?`<div class="hmw-equation">${esc(c.formula)}</div>`:''}`;
    if(c.children.length)body+=`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>细分因素</th><th class="numeric">利润影响 / 万元</th><th class="numeric">占本项净影响</th><th>穿透分析</th></tr></thead><tbody>${c.children.map(child=>`<tr><td><button class="hmw-link" data-cause="${child.id}">${child.name}</button></td><td class="numeric ${badClass(child.impact)}">${signed(child.impact,4)}</td><td class="numeric">${c.impact?signed(child.impact/c.impact*100,1)+'%':'—'}</td><td><button class="hmw-link" data-cause="${child.id}">查看细项及门店</button></td></tr>`).join('')}<tr class="total"><td>合计</td><td class="numeric">${signed(c.impact,4)}</td><td class="numeric">${c.impact?'100.0%':'—'}</td><td>与本项一致</td></tr></tbody></table></div><p class="hmw-note">子项可能同时包含增利和减利，子项占本项净影响可为负或超过100%；父项净影响为零时不计算占比。</p>`;
    if(c.id==='food'){const f=M.attribution.foodStandard;body+=`<h3>实际销量的标准成本衔接</h3><div class="hmw-equation">标准食材成本 ${num(f.standardCost,4)} ＋ 采购价差 ${num(f.priceCost,4)} ＋ 超耗 ${num(f.excessCost,4)} ＝ 实际食材 ${num(f.actualCost,4)} 万元</div><p class="hmw-note">全费率参考与标准配方成本的差额${signed(f.alignmentImpact,4)}万元已单列衔接，不重分配到采购或报损。</p>`;}
    if(c.id==='labor'||c.id==='labor-structure'){const l=M.attribution.laborStandard;body+=`<h3>人工费率参考与工时标准</h3><div class="hmw-equation">费率参考 ${num(l.rateReferenceCost)}万元 → 固定人工及弹性工时标准 ${num(l.standardCost)}万元 → 实际 ${num(l.actualCost)}万元</div><p>基本人工${num(l.fixedCost)}万元；标准弹性工时${num(l.standardHours,2)}小时，实际${num(l.actualHours,2)}小时，按${num(l.hourlyCost,0)}元综合时薪核算。结构摊薄${signed(l.structureImpact)}万元、超标准工时${signed(l.executionImpact)}万元分别解释。</p>`;}
    if(c.id==='food'||c.id==='procurement')body+=materialsTable();
    if(['usage','usage-prep','usage-waste'].includes(c.id))body+=usageMaterialsTable(c.id);
    if(c.material)body+=materialScene(c.material);
    if(c.id==='volume'){const t=M.attribution.channels;body+=`<h3>两类业务量独立计量</h3><p>堂食就餐人次：${num(t.september.dineIn.guests,0)} → ${num(t.october.dineIn.guests,0)}；外卖有效订单：${num(t.september.delivery.orders,0)} → ${num(t.october.delivery.orders,0)}。堂食桌单不用于外卖推导，客流与订单的影响只在形成基准时计算一次。</p><button class="hmw-button" data-action="baseline">查看完整基准测算</button>`;}
    body+=`<p><button class="hmw-button" data-cause-tab="${c.id}" data-tab="stores">查看本项在120家门店的分布 →</button></p>`;
  }
  dialog(c.name,body,'10月归因 / 集团 → 细项 → 门店');$('#hmwDialogBody').dataset.activeStore='';
}
function causeStoreRows(c){return `<div class="hmw-table-wrap store-scroll"><table class="hmw-table"><thead><tr><th>门店</th><th>区域</th><th class="numeric">本项利润影响 / 万元</th><th class="numeric">占本项净影响</th><th>门店分析</th></tr></thead><tbody>${[...c.storeRows].sort((a,b)=>a.impact-b.impact).map(r=>`<tr><td>${r.storeId} · ${r.storeName}</td><td>${r.region}</td><td class="numeric ${badClass(r.impact)}">${signed(r.impact,4)}</td><td class="numeric">${c.impact?signed(r.impact/c.impact*100,2)+'%':'—'}</td><td><button class="hmw-link" data-store="${r.storeId}" data-context="attribution" data-cause-context="${c.id}">查看本店 →</button></td></tr>`).join('')}<tr class="total"><td>120家合计</td><td></td><td class="numeric">${signed(c.impact,4)}</td><td class="numeric">100.00%</td><td>与集团本项一致</td></tr></tbody></table></div>`;}
function materialsTable(){

    {key:'utilities',owner:'工程负责人 / 店长',time:'启动后2天核对账单与设备，第1周复查启停执行',action:'核查高能耗门店的计费价格、营业时长与设备启停，落实分时控制。',goal:()=>`11月能耗预算${amt(f.totals.utilities)}万元，约${amt(f.totals.utilities*1000000/f.inputs.guests)}元/百客；相同经营量下预计改善${amt(f.baseline.utilities-f.totals.utilities)}万元。`,steps:['核对电、水、燃气账单、计费价格、营业时长及设备运行记录，区分价格和用量因素。','检查非营业时段空转、温控与设备故障，形成设备启停表及需维修清单。','按门店执行启停安排，按相近业务量复核实际用量与账单，保留食品储存及必要服务能耗。'],verification:'比较同营业时长与业务量下的用量和费用，同时检查温控、设备可用性及顾客服务。'},

igned(c.netDeclineShare,1)}%</td></tr>`).join('')}<tr class="total" data-brief-total><td>利润净变化</td><td class="numeric bad">${signedAmt(-decline)}</td><td class="numeric">100.0%</td></tr></tbody></table></div><p class="ai-brief-method"><strong>占比口径：</strong>本表贡献＝−单项利润影响 ÷ 环比净下降${amt(decline,0)}万元，原始贡献合计100%；分项显示可能因四舍五入与合计略有差异。增利因素抵减降幅，记负贡献；减利因素记正贡献，可超过100%。顶层增利合计${amt(positive)}万元、减利合计${amt(negative)}万元；${amt(t.baseline.profit)}万元基准是检查点，不作为额外贡献相加。</p></details></section>

function recalculate(){
  const previous=scenario.applied.inputs,next=AI.normalize(scenario.draft);
  scenario.lastChanges=[];
  if(previous.plan!==next.plan)scenario.lastChanges.push(`策略：${planNames[previous.plan]} → ${planNames[next.plan]}`);
  strategyFields.forEach(([id,label,unit])=>{if(next[id]!==previous[id])scenario.lastChanges.push(`${label}：${amt(previous[id]*(unit==='%'?100:1),id==='guests'?0:2)} → ${amt(next[id]*(unit==='%'?100:1),id==='guests'?0:2)}${unit}`);});
  scenario.applied=AI.calculate(next);scenario.draft={...next};scenario.revision++;scenario.dirty=false;state.search='';
  render();$('#aiForecastResult').scrollIntoView({block:'start',behavior:'instant'});toast('已重新测算集团、120家门店及相应行动条件');
}

  <script>/* AI application shell. Responses use the existing business model; no remote model is connected. */

  const apps=[
    {id:'attribution',name:'利润归因',description:'以9月经营模式重算10月基准，再逐层核对量价、标准成本和门店差异。',prompt:'帮我复盘10月经营，营收增长了，为什么利润反而下降？',tag:'经营诊断',detail:'9月模式基准 · 连环替代 · 标准成本穿透'},

  function welcome(){return `<section class="platform-welcome"><div class="platform-welcome-mark">${svg('spark')}</div><span class="platform-eyebrow">好美味 · 经营工作空间</span><h1>把经营问题，交给 AI 一起解决。</h1><p>从一个问题开始，连接分析、决策与行动。</p><div class="platform-suggestions">${apps.map(a=>`<button class="platform-suggestion" data-platform-prompt="${a.id}">${icon(a.id)}<h3>${a.name}</h3><p>${a.prompt}</p><small>${a.tag}</small></button>`).join('')}</div><div class="platform-welcome-hint">${svg('database')} 工作空间已包含120家门店的经营资料</div></section>`;}

  function resources(){
    const rows=[['statement','管理利润表','9月与10月 · 14项损益指标 · 集团及120家门店','结构化数据'],['stores','门店档案','华东、华北、华南 · 120家直营正餐门店','门店资料'],['materials','菜品与原料','8种重点原料 · 标准用量、采购价格及价差','经营数据'],['rules','经营规则与指标口径','9月模式基准、连环替代、标准成本与贡献分母','知识文档']];
    return `<section class="platform-catalog"><header><span class="platform-eyebrow">经营分析的共同依据</span><h1>数据与知识</h1><p>管理应用当前可使用的资料，查看来源、范围与计算口径。</p></header><div class="platform-resource-list">${rows.map(([id,name,desc,type])=>`<article>${svg(id==='rules'?'file':'database')}<div><h3>${name}</h3><p>${desc}</p></div><span class="hmw-tag">${type}</span><button class="hmw-button" ${id==='statement'?'data-action="statement"':`data-platform-resource="${id}"`}>查看</button></article>`).join('')}</div><p class="platform-catalog-note">当前为工作空间内置资料，来自产品演示业务模型；外部业务系统尚未连接。</p></section>`;
  }
  function turns(messages){return messages.map((m,index)=>{
    const oldData=m.dataVersion!==M.dataVersion,historical=oldData||state.page==='attribution'&&m.methodVersion!==M.attribution.version;
    const displayAnswer=m.answer.replace(/(\d[\d,]*)\.(\d+)(?=万元)/g,(_,integer,fraction)=>{const digits=fraction.replace(/0+$/,'');return digits?`${integer}.${digits}`:integer;});
    return `<article class="platform-chat-turn"><div class="platform-user-message">${esc(m.question)}</div><div class="platform-turn-controls"><button class="hmw-button ghost" data-delete-turn="${index}" aria-label="删除这条提问及回复">删除</button></div><div class="platform-assistant-message"><div class="ai-thread-head"><span class="ai-avatar">${svg('spark')}</span><b>经营助手</b>${historical?`<span class="hmw-tag">历史回答 · ${oldData?'旧数据':'旧口径'}</span>`:''}</div>${m.format==='attribution-brief'&&!historical?aiAttributionBrief():`<p>${esc(displayAnswer)}</p>`}${historical?'<p class="hmw-note">此处保留原回答快照；当前报告已使用更新后的演示数据。</p><button class="hmw-button" data-action="show-evidence">查看当前报告</button>':m.action?replyAction(m.action):''}</div></article>`;
  }).join('');}
  function deleteTurn(index){
    const task=activeTask(),messages=task?.messages||saved.messages[state.page];
    if(!Number.isInteger(index)||!messages?.[index])return;
    removedTurn={page:state.page,index,message:messages[index],task,title:task?.title};
    messages.splice(index,1);
    if(task&&index===0)task.title=messages[0]?.question.slice(0,24)||appFor(task.page).name+'任务';

    $('#hmwToast').insertAdjacentHTML('beforeend',' <button class="hmw-button ghost" data-platform-action="undo-delete">撤销</button>');

  }
  function replyAction(a){

    if(a.type==='baseline')return '<button class="hmw-button" data-action="baseline">查看9月模式基准</button>';

    return `<button class="hmw-button" data-action="${state.page==='forecast'?'edit-strategy':'show-evidence'}">${state.page==='forecast'?'打开策略测算':'查看完整报告'}</button>`;
  }
  function threadView(page,content){
    const task=pushTasks().find(t=>t.id===page),custom=activeTask(),app=appFor(page),messages=custom?custom.messages:saved.messages[page]||[];
    if(page==='forecast'&&globalThis.AdviceWorkspace)return `<div class="platform-thread" data-page="forecast"><header class="platform-task-heading"><span class="platform-task-icon">${icon(page)}</span><div class="platform-task-copy"><span class="platform-eyebrow">经营建议 / 好美味餐饮集团</span><h1>${esc(custom?.title||task.title)}</h1><p>经营方案 · 店长确认 · 7天物料与人员计划</p></div></header>${content}<div id="platformConversation" aria-live="polite">${turns(messages)}</div></div>`;

  }
  function afterRender(){
    const task=activeTask();
    $('#platformAppSelect').value=task?.page||state.page;
    if(task){$('#hmwBreadcrumb').textContent=task.title;document.title=`${task.title} · 好美味 AI 应用平台`;document.querySelectorAll('#hmwNav button').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current');});}
    sidebar();
  }
  function revealEvidence(){opened.add(activeTask()?.id||state.page);if($('#aiEvidence'))$('#aiEvidence').hidden=false;}
  function classify(text,fallback,newTask){if(/执行|跟进|整改进度|本周|周计划|异常门店/.test(text))return 'tracking';if(/经营建议|经营预测|经营推演|11月|优惠.*(?:增加|提高|多|加)/.test(text)||newTask&&/预测|推演|方案|营销|预算/.test(text))return 'forecast';if(/归因|10月|9月模式|基准利润/.test(text))return 'attribution';if(newTask&&/利润|食材|采购|原料|人工|堂食|外卖/.test(text))return 'attribution';return fallback;}
  function answer(question,page){
    const store=M.stores.find(s=>question.includes(s.id)||question.includes(s.name));
    if(store){const row=page==='forecast'?scenario.applied.byStore.find(s=>s.storeId===store.id):page==='tracking'?M.tracking.stores.find(s=>s.storeId===store.id)?.actual:store.october;return {answer:`${store.name}（${store.region}）${page==='forecast'?'当前方案预测':page==='tracking'?'本周实际':'10月实际'}：折后营业额${amt(row.revenue)}万元，门店经营利润${amt(row.profit)}万元。可打开门店详情，继续核对费用与行动条件。`,action:{type:'store',id:store.id,context:page}};}
    if(page==='forecast'){
      const f=scenario.applied,match=question.match(/优惠.*?(?:增加|提高|多|加)\s*(\d+(?:\.\d+)?)\s*元/);
      if(match){const discount=f.inputs.discountPerGuest+Number(match[1]);if(discount>40)return {answer:'增加后的每客优惠超过当前模型40元上限。请在策略测算中选择范围内的优惠，并确认客流假设。'};const next=AI.calculate({...f.inputs,discountPerGuest:discount});return {answer:`在当前已测算方案、客流和其他条件不变时，人均优惠由${amt(f.inputs.discountPerGuest)}元增加至${amt(discount)}元，预计营业额${amt(next.totals.revenue)}万元，利润${amt(next.totals.profit)}万元，利润变化${signedAmt(next.totals.profit-f.totals.profit)}万元。\n这是独立试算，尚未应用到方案。可打开策略编辑器调整参数后重新测算。`,action:{type:'report'}};}
      return {answer:`${planNames.steady}预计利润${amt(AI.base('steady').totals.profit)}万元；${planNames.anniversary}预计利润${amt(AI.base('anniversary').totals.profit)}万元。\n当前已测算版本预计营业额${amt(f.totals.revenue)}万元，利润${amt(f.totals.profit)}万元。你可以调整客流、优惠和营销预算，提交后重新计算。采购报价与门店产能仍需确认。`,action:{type:'report'}};
    }
    if(page==='tracking')return {answer:`本周120家门店实际利润${amt(M.tracking.summary.actual.profit)}万元，较冻结周计划少${amt(M.tracking.summary.plan.profit-M.tracking.summary.actual.profit)}万元。\n优先跟进上海06店低峰临时工时、北京07店临采价差、深圳02店报损及设备能耗。登记动作完成后，收益仍需在后续周期复核。`,action:{type:'report'}};
    const method=M.attribution,a=M.actuals.september,b=M.actuals.october;
    if(/连环替代|替换顺序|分解顺序/.test(question))return {answer:`归因采用以下顺序：\n${method.methodSteps.map((step,i)=>`${i+1}. ${step}`).join('\n')}\n9月利润${amt(a.profit)}万元，先替换业务量得到基准利润${amt(method.baseline.profit)}万元，再逐项衔接到10月实际${amt(b.profit)}万元。业务量只在形成基准时计算一次；这是一套账面分解，不能据此证明促销造成了客流增长。`,action:{type:'substitution'}};
    if(/9月模式|按9月|基准|堂食|外卖|客单|单均|目标/.test(question)){
      const sep=method.channels.september,oct=method.channels.october;
      return {answer:`本报告以9月经营模式为基准。\n堂食：9月人均${amt(sep.dineIn.unitPrice)}元/人 × 10月${num(oct.dineIn.guests,0)}就餐人次；外卖：9月单均${amt(sep.delivery.unitPrice)}元/单 × 10月${num(oct.delivery.orders,0)}有效订单。逐店按未舍入单价计算后汇总，基准营业额${amt(method.baseline.revenue)}万元。\n再按各店9月成本费用率计算，得到基准利润${amt(method.baseline.profit)}万元，较10月实际利润${amt(b.profit)}万元高${amt(method.baselineGap)}万元。10月目标用于目标完成情况，不进入本归因桥。基准已经包含10月业务量，之后不再重复计算客流贡献。\n${method.sourceNote}`,action:{type:'baseline'}};
    }
    if(/损耗|耗用|备料|出成率|报损|余料/.test(question)){
      const id=/备料|出成率/.test(question)?'usage-prep':/报损|余料/.test(question)?'usage-waste':'usage',cause=M.getCauseDetail(id);

      return {answer:`${cause.name}减利${amt(-cause.impact)}万元。物料TOP5：${top}。\n打开明细可查看应耗、实耗、超耗、报损及门店台账。`,action:{type:'cause',id}};
    }
    if(/采购|原料|食材|牛肉|新品/.test(question)){
      const food=M.getCauseDetail('food'),purchase=M.getCauseDetail('procurement'),usage=M.getCauseDetail('usage');

    const checks=current?(a.checks||{}):view.checks;
    const attention=proposal.attention.map(item=>`<div class="aw-attention-row" data-attention-item="${item.key}"><div><strong>${esc(item.label)}</strong><span class="${item.tone==='bad'?'bad':''}">${amt(item.value)}<small>万元</small></span></div><p>${esc(item.focus)}</p><small>核对：${esc(item.verification)}</small></div>`).join('');
    return `<section class="aw-store-panel" id="awStorePanel"><header><div><span class="aw-eyebrow">门店测算与生效</span><h3>${esc(proposal.storeName)} <small>${esc(proposal.storeId)}</small></h3><p>本次演示店长：${esc(proposal.manager)} · ${esc(planNames[proposal.planId])}</p></div><span class="hmw-tag ${current?'good':'warn'}">${current?'店长已确认 · 本店生效':'本次测算待确认'}</span></header><div class="aw-store-metrics"><div><small>本店预计营业额</small><strong>${amt(proposal.finance.revenue)}<span>万元</span></strong></div><div><small>本店预计利润</small><strong>${amt(proposal.finance.profit)}<span>万元</span></strong></div><div><small>接待产能使用率</small><strong>${amt(proposal.storeResource.capacityUse,1)}<span>%</span></strong></div></div>${proposal.storeResource.capacityUse>100?`<p class="aw-warning">本店预计客流超过现有承接能力，确认前须落实增能或预约分流，并核对分时高峰。</p>`:''}${a?`<div class="aw-effective-version"><strong>当前生效：${esc(a.versionLabel)}</strong><span>${esc(planNames[a.proposal.planId])} · 店长${esc(a.proposal.manager)} · 确认于${esc(new Date(a.confirmedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</span>${!current?'<p>新参数尚未替代该版本。第二部分继续使用本店已确认版本，直到店长确认新方案。</p>':''}</div>`:'<p class="aw-note">测算结果尚未生效，店长完成以下核对并确认后，才能生成本店执行计划。</p>'}<details class="aw-attention"><summary>查看14项经营与成本指标的店长关注提示</summary><div class="aw-attention-list">${attention}</div></details><div class="aw-manager-checks">${proposal.checks.map(c=>`<label><input type="checkbox" data-aw-monthly-check="${c.id}" ${checks[c.id]?'checked':''} ${current?'disabled':''}><span><strong>${esc(c.label)}</strong><small>${esc(c.description)}</small></span></label>`).join('')}</div><p class="aw-warning" id="awDraftNotice" ${scenario.dirty?'':'hidden'}>经营参数已有修改，请先重新测算，再由店长确认。</p><button class="hmw-button primary" id="awConfirmMonthly" data-aw-action="confirm-monthly" ${scenario.dirty||current||!proposal.checks.every(c=>view.checks[c.id])?'disabled':''}>${current?'本店方案已确认生效':'以本店店长身份确认方案生效'}</button></section>`;
  }
  function materialsTable(p){
    return `<div class="hmw-table-wrap"><table class="hmw-table aw-materials"><thead><tr><th>物料 / 供货参考</th><th class="numeric">7天需求 / 公斤</th><th>现存 / 公斤</th><th>在途 / 公斤</th><th>安全库存 / 公斤</th><th class="numeric">建议申请 / 公斤</th><th class="numeric">参考价 / 元·公斤</th></tr></thead><tbody>${p.materials.map(m=>`<tr data-week-material="${m.materialId}"><td><strong>${esc(m.name)}</strong><small>${esc(m.supplierName||'综合食材供应（示例）')}</small></td><td class="numeric">${amt(m.demandKg,3)}</td>${['onHandKg','inboundKg','safetyKg'].map(field=>`<td><input type="number" min="0" step="0.001" aria-label="${esc(m.name)}${field==='onHandKg'?'现存':field==='inboundKg'?'在途':'安全库存'}" data-aw-stock="${m.materialId}" data-field="${field}" value="${view.inventory[m.materialId]?.[field]??m[field]}"></td>`).join('')}<td class="numeric"><strong>${amt(m.purchaseKg,3)}</strong></td><td class="numeric">${amt(m.unitPrice)}</td></tr>`).join('')}</tbody></table></div><p class="aw-note">建议申请＝需求＋安全库存－现存－在途，最低为0，再按包装量取整。修改库存后请更新清单。</p><details class="aw-secondary-detail"><summary>查看7天逐日物料需求</summary><div class="hmw-table-wrap"><table class="hmw-table aw-daily-materials"><thead><tr><th>物料 / 公斤</th>${p.dates.map(d=>`<th class="numeric">${esc(d.slice(5))}</th>`).join('')}</tr></thead><tbody>${p.materials.map(m=>`<tr><td>${esc(m.name)}</td>${m.dailyDemand.map(q=>`<td class="numeric">${amt(q,3)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  }
  function staffingTable(p){
    const s=p.staffing;
    return `<div class="aw-week-metrics"><div><small>计划排班工时</small><strong>${amt(s.totalHours)}<span>小时</span></strong></div><div><small>排班折算费用</small><strong>${money(s.totalCostYuan)}</strong></div><div><small>本店7天人工预算</small><strong>${money(s.budgetYuan)}</strong></div></div><div class="hmw-table-wrap"><table class="hmw-table aw-daily-staff"><thead><tr><th>日期</th><th class="numeric">预计客流</th><th class="numeric">早班人数</th><th class="numeric">晚班人数</th><th class="numeric">工时</th><th class="numeric">折算费用 / 元</th></tr></thead><tbody>${s.daily.map(d=>`<tr><td>${esc(d.date)}</td><td class="numeric">${amt(d.guests,0)}</td><td class="numeric">${d.earlyCount}</td><td class="numeric">${d.lateCount}</td><td class="numeric">${amt(d.hours)}</td><td class="numeric">${amt(d.costYuan)}</td></tr>`).join('')}</tbody></table></div><details class="aw-secondary-detail"><summary>查看逐人排班与休息安排（${s.employees.length}名示例人员）</summary><div class="hmw-table-wrap"><table class="hmw-table aw-roster"><thead><tr><th>员工</th><th>岗位</th>${p.dates.map(d=>`<th>${esc(d.slice(5))}</th>`).join('')}<th class="numeric">7天工时</th></tr></thead><tbody>${s.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td>${e.days.map(day=>`<td>${esc(day)}</td>`).join('')}<td class="numeric">${amt(e.hours)}</td></tr>`).join('')}</tbody></table></div></details><p class="aw-note">${esc(s.sourceNote||'示例人员与可用性；早班10:00—16:00、晚班16:00—22:00，按每班6小时、综合30元/小时折算。请店长核对真实人员和可用时段。')}</p>`;
  }
  function receiptPanel(r){
    return `<section class="aw-receipts"><header><h4>单据与排班创建回执</h4><span class="hmw-tag">演示回执</span></header><p>${esc(r.storeName)} · ${esc(r.sourceVersion)} · ${esc(r.startDate)}—${esc(r.endDate)}</p><div class="aw-receipt-grid">${[['supplyChain','供应链系统'],['humanResources','人事系统']].map(([id,name])=>{const d=r[id];return `<article><small>${name}</small><h4>${esc(d.type)}</h4><span class="hmw-tag ${d.status==='not_required'?'':'blue'}">${d.status==='not_required'?'库存充足，无需补货申请':'演示创建成功'}</span><p>${esc(d.id||'本次不创建空申请单')}</p><button class="hmw-link" data-aw-action="view-document" data-document="${id}">查看单据内容</button></article>`;}).join('')}</div><p class="aw-note">回执为本演示生成的示例记录，未写入真实供应链或人事系统；重复点击会复用同一批次。</p></section>`;
  }
  function weekPanel(){
    const a=approval(),w=weekly(),p=w?.plan,valid=validWeekly(),r=receipt();
    if(!a)return `<div class="aw-empty"><h3>先确认本店经营方案</h3><p>${esc(getStore(view.storeId).name)}尚无店长确认的生效方案。确认后，系统才会据此生成7天物料与人员计划。</p><button class="hmw-button" data-aw-scroll="awStorePanel">前往本店方案确认</button></div>`;
    return `<div class="aw-week-source"><strong>${esc(a.proposal.storeName)} · ${esc(a.versionLabel)}</strong><span>${esc(planNames[a.proposal.planId])}</span><p>仅使用本店已确认的方案。物料和人员清单确认后，再创建对应单据。</p></div><div class="aw-week-controls"><label><span>执行开始日期</span><input id="awStartDate" type="date" min="${today()}" value="${esc(view.startDate)}"></label><label><span>额外可用支援人数</span><input id="awExtraStaff" type="number" min="0" max="50" step="1" value="${view.extraStaff}"></label><button class="hmw-button primary" data-aw-action="generate-week">${p?'更新7天执行清单':'生成本店7天执行清单'}</button></div>${!p?'<p class="aw-note">将按该店已生效方案生成物料需求、库存扣减和早晚班安排，跨月日期会明确提示。</p>':`<div class="aw-week-plan" data-week-key="${esc(p.key)}"><header><h3>${esc(p.startDate)}—${esc(p.endDate)} · 7天计划</h3><span class="hmw-tag ${!valid?'warn':w.confirmedAt?'good':''}">${!valid?'来源已变更，须重新生成':w.confirmedAt?'店长已确认':'待店长确认清单'}</span></header>${!valid?'<p class="aw-warning">本店已确认新的月度方案，旧清单不可继续确认或创建单据，请先更新。</p>':''}${weekExpired()?'<p class="aw-warning">执行开始日期已早于今天，请更新日期并重新生成接下来7天的清单。历史单据回执仍可查看。</p>':''}${p.warnings.length?`<details class="aw-secondary-detail" ${p.crossMonth?'open':''}><summary>计划依据与执行提示（${p.warnings.length}项）</summary>${list(p.warnings)}</details>`:''}${p.blockers.length?`<div class="aw-blockers"><strong>以下问题解决后才能确认</strong>${list(p.blockers)}</div>`:''}<h4>物料清单</h4><p>${esc(p.sourceNote)}</p>${materialsTable(p)}<h4>人员排班清单</h4>${staffingTable(p)}<p class="aw-warning" id="awWeekDraftNotice" ${view.weekDirty?'':'hidden'}>日期、库存或支援人数已有修改，请更新清单后重新确认。</p><label class="aw-week-ack"><input type="checkbox" id="awWeekAck" ${view.weekAck||w.confirmedAt?'checked':''} ${w.confirmedAt?'disabled':''}><span>本店店长已核对物料需求、现存与在途、人员可用性及日期安排${p.crossMonth?'，并确认跨月计划口径':''}。</span></label><div class="aw-week-actions"><button class="hmw-button" id="awConfirmWeek" data-aw-action="confirm-week" ${!valid||weekExpired()||view.weekDirty||!view.weekAck||p.blockers.length||w.confirmedAt?'disabled':''}>${w.confirmedAt?'本店7天清单已确认':'确认本店物料与排班清单'}</button><button class="hmw-button primary" id="awCreateDocuments" data-aw-action="create-documents" ${!valid||weekExpired()||view.weekDirty||!w.confirmedAt||p.blockers.length||r?'disabled':''}>${r?'本批次已创建演示单据':'一键创建补货申请与排班单'}</button></div><p class="aw-note">演示对接：当前未连接外部系统。确认后将生成两类示例单据及回执，不执行真实采购或人员变更。</p>${r?receiptPanel(r):''}</div>`}`;
  }
  function renderWorkspace(){
    const proposal=P.build(scenario.applied,M,view.storeId),d=P.describe(scenario.applied,M),sig=P.signature(scenario.applied);
    const confirmed=Object.values(flow.approvals).filter(a=>a.proposal.signature===sig).length;
    return `<div class="aw-workspace" id="aiEvidence"><nav class="aw-flow-nav"><span>方案生成与测算</span><span>店长确认生效</span><span>7天计划与单据</span><button class="hmw-link" data-aw-scroll="awWeeklySection">前往7天执行</button></nav><section class="aw-section" id="awProposalSection"><header><span class="aw-eyebrow">第一部分</span><h2>经营方案与门店确认</h2><p>基于品牌特性与可用资源生成建议，调整参数后测算到门店，由各店店长确认后生效。</p></header><details class="aw-brand-basis" open><summary>品牌与资源依据</summary>${list(d.brandFacts)}</details><div class="aw-plan-options">${['steady','anniversary'].map(planCard).join('')}</div>${strategyEditor()}<section id="aiForecastResult" class="aw-current-result"><div><strong>当前测算：${esc(planNames[scenario.applied.plan])}</strong><p>预计营业额${amt(scenario.applied.totals.revenue)}万元，利润${amt(scenario.applied.totals.profit)}万元；测算不等于各店已确认生效。</p></div><span class="hmw-tag blue">本版已确认 ${confirmed} / ${M.stores.length} 店</span></section><div class="aw-store-selector"><label><span>选择门店 / 店长视角</span><select id="awStoreSelect">${M.stores.map(s=>`<option value="${s.id}" ${s.id===view.storeId?'selected':''}>${esc(s.name)} · ${esc(s.region)} · ${esc(s.manager)}</option>`).join('')}</select></label></div><details class="aw-secondary-detail aw-all-stores"><summary>查看120家门店测算与确认状态</summary><input class="hmw-search" data-aw-store-search placeholder="搜索门店、编号或区域" aria-label="搜索门店测算" value="${esc(view.query)}"><div class="hmw-table-wrap store-scroll"><table class="hmw-table"><thead><tr><th>门店</th><th class="numeric">预计客流</th><th class="numeric">营业额 / 万元</th><th class="numeric">利润 / 万元</th><th class="numeric">产能使用率</th><th>店长确认</th></tr></thead><tbody id="awStoreRows">${storeRows()}</tbody></table></div></details>${storePanel(proposal)}<details class="aw-secondary-detail aw-model-evidence"><summary>查看完整财务测算与行动依据</summary>${forecastResult(scenario.applied,AI.base(scenario.applied.plan))}</details></section><section class="aw-section" id="awWeeklySection"><header><span class="aw-eyebrow">第二部分</span><h2>门店接下来7天的执行计划</h2><p>物料清单与人员排班使用该店已生效方案，经店长二次确认后，一键创建两类单据。</p></header>${weekPanel()}</section></div>`;
  }
  function showDocument(type){
    const r=receipt();if(!r)return;const d=r[type];if(!d)return;
    const payload=d.payload;
    const body=type==='supplyChain'?`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>物料</th><th class="numeric">申请量 / 公斤</th><th class="numeric">参考价 / 元·公斤</th></tr></thead><tbody>${(payload.lines||[]).map(x=>`<tr><td>${esc(x.name)}</td><td class="numeric">${amt(x.quantityKg,3)}</td><td class="numeric">${amt(x.unitPrice)}</td></tr>`).join('')||'<tr><td colspan="3">库存充足，本批次无需补货申请。</td></tr>'}</tbody></table></div>`:`<div class="hmw-table-wrap"><table class="hmw-table"><thead><tr><th>员工</th><th>岗位</th>${weekly().plan.dates.map(date=>`<th>${esc(date.slice(5))}</th>`).join('')}<th>工时</th></tr></thead><tbody>${payload.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td>${e.days.map(day=>`<td>${esc(day)}</td>`).join('')}<td>${amt(e.hours)}</td></tr>`).join('')}</tbody></table></div>`;
    dialog(d.type,`<p>${esc(d.id||'无需创建')} · ${esc(r.storeName)} · ${esc(r.sourceVersion)} · ${esc(r.startDate)}—${esc(r.endDate)}</p>${body}<p>演示单据，未写入真实外部系统。</p>`,'店长已确认 · 演示创建回执');
  }
  document.addEventListener('click',event=>{
    const store=event.target.closest('[data-aw-store]');if(store){setStore(store.dataset.awStore);return;}
    const scroll=event.target.closest('[data-aw-scroll]');if(scroll){$('#'+scroll.dataset.awScroll)?.scrollIntoView({block:'start',behavior:'instant'});return;}
    const button=event.target.closest('[data-aw-action]');if(!button)return;
    try{
      const action=button.dataset.awAction,now=new Date().toISOString();
      if(action==='confirm-monthly'){
        if(scenario.dirty)throw new Error('请先重新测算，再确认本店方案。');
        const p=P.build(scenario.applied,M,view.storeId);if(save(F.approveStore(flow,p,view.checks,now))){view.weekDirty=false;view.weekAck=false;render();toast('本店店长已确认，经营方案生效。');}
      }
      if(action==='generate-week'){
        const a=approval();if(!a)throw new Error('请先由店长确认本店经营方案。');
        const date=$('#awStartDate');if(!date.reportValidity())return;
        const o=options(),p=W.build(a,o);if(save(F.setWeekly(flow,p,o))){view.weekDirty=false;view.weekAck=false;render();$('#awWeeklySection').scrollIntoView({block:'start',behavior:'instant'});toast('已生成本店7天清单，请店长核对后确认。');}
      }
      if(action==='confirm-week'){
        if(weekExpired())throw new Error('执行开始日期已过去，请更新为接下来7天的清单。');
        if(view.weekDirty)throw new Error('清单参数已修改，请先更新。');
        if(save(F.confirmWeekly(flow,view.storeId,weekly()?.plan.key,view.weekAck,now))){render();toast('本店店长已确认物料与排班清单。');}
      }
      if(action==='create-documents'){
        if(weekExpired())throw new Error('执行开始日期已过去，请更新为接下来7天的清单。');
        if(view.weekDirty)throw new Error('清单参数已修改，请先更新并重新确认。');
        const result=F.createDocuments(flow,view.storeId,weekly()?.plan.key,now);
        if(save(result.state)){render();$('.aw-receipts')?.scrollIntoView({block:'start',behavior:'instant'});toast(result.reused?'已复用本批次演示单据，没有重复创建。':'演示单据与排班已创建，请查看回执。');}
      }
      if(action==='view-document')showDocument(button.dataset.document);
    }catch(error){toast(error.message||'操作未完成，请检查当前方案与确认状态。');}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.awStoreSearch!==undefined){view.query=t.value;$('#awStoreRows').innerHTML=storeRows();}
    if(t.dataset.awStock){const id=t.dataset.awStock,field=t.dataset.field;view.inventory[id]={...(view.inventory[id]||{}),[field]:Number(t.value)};view.weekDirty=true;view.weekAck=false;}
    if(t.id==='awStartDate'){view.startDate=t.value;view.weekDirty=true;view.weekAck=false;}
    if(t.id==='awExtraStaff'){view.extraStaff=Number(t.value);view.weekDirty=true;view.weekAck=false;}
    if(state.page==='forecast'&&(t.dataset.scenarioField||t.dataset.awStock||['awStartDate','awExtraStaff'].includes(t.id)))refreshGates();
  });
  document.addEventListener('change',event=>{
    const t=event.target;
    if(t.id==='awStoreSelect'){setStore(t.value);return;}
    if(t.dataset.awMonthlyCheck){view.checks[t.dataset.awMonthlyCheck]=t.checked;refreshGates();}
    if(t.id==='awWeekAck'){view.weekAck=t.checked;refreshGates();}
  });
  root.AdviceWorkspace={render:renderWorkspace};
  render();
})(globalThis);
</script>
</body>
</html>
