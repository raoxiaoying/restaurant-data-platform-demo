<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245bdb">
  <title>好美味餐饮集团 · 经营管理</title>
  <style>
    :root{font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#23354f;background:#f5f7fb;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}h1,h2,p{margin:0}a{color:inherit;text-decoration:none}
    main{width:min(1120px,100%);padding:64px 40px 88px}h1{font-size:34px;line-height:1.4;font-weight:650;letter-spacing:1px;margin-bottom:35px}
    .systems{display:grid;grid-template-columns:1fr 1fr;gap:24px}.system{display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:350px;padding:30px 32px;background:#fff;border:1px solid #dfe6f0;border-radius:12px;box-shadow:0 8px 28px #233e6805;transition:border-color .15s,box-shadow .15s}
    .system:hover{border-color:#a7bce1;box-shadow:0 10px 32px #233e680b}.system:focus-visible{outline:3px solid #245bdb;outline-offset:5px}.system.dolink{border-top:3px solid #3b6ed3;padding-top:28px}
    .label{font-size:13px;font-weight:500;color:#667a97;background:#f0f3f8;border:1px solid #e4eaf3;padding:3px 9px;border-radius:4px;letter-spacing:.5px}.dolink .label{background:#edf3ff;border-color:#dce7ff;color:#3b65ac}
    .system-icon{position:relative;width:48px;height:48px;margin-top:28px;border:1px solid #e0e7f2;border-radius:11px;background:#f5f8fd;color:#6c84a8}.dolink .system-icon{background:#edf3ff;border-color:#dce7ff;color:#356bd4}
    .report-icon:before{content:"";position:absolute;inset:12px 11px;border:1.5px solid currentColor;border-radius:2px}.report-icon:after{content:"";position:absolute;left:17px;right:16px;top:18px;height:1.5px;background:currentColor;box-shadow:0 6px currentColor,0 12px currentColor}
    .network-icon:before{content:"";position:absolute;left:22px;top:14px;width:1.5px;height:18px;background:currentColor}.network-icon:after{content:"";position:absolute;left:13px;top:28px;width:20px;height:1.5px;background:currentColor}
    .network-icon i{position:absolute;width:8px;height:8px;border:1.5px solid currentColor;border-radius:2px;background:#edf3ff;z-index:1}.network-icon i:nth-child(1){top:10px;left:19px}.network-icon i:nth-child(2){top:26px;left:9px}.network-icon i:nth-child(3){top:26px;left:29px}
    h2{font-size:24px;line-height:1.5;font-weight:650;margin-top:19px;letter-spacing:.3px}.description{font-size:15px;color:#72839d;margin-top:6px}.enter{font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;min-height:39px;min-width:108px;border:1px solid #d9e2ef;border-radius:5px;padding:7px 18px;margin-top:28px;background:#fff;color:#526e98}.dolink .enter{background:#245bdb;border-color:#245bdb;color:#fff}
    @media(max-width:700px){main{padding:36px 22px 50px}h1{font-size:28px;margin-bottom:25px}.systems{grid-template-columns:1fr;gap:18px}.system{min-height:300px;padding:25px 26px}.system.dolink{padding-top:23px}.system-icon{margin-top:22px}h2{font-size:23px}.description{font-size:14px}.enter{margin-top:23px}}
    @media(prefers-reduced-motion:reduce){.system{transition:none}}
  </style>
</head>
<body>
  <main>
    <h1>好美味餐饮集团 · 经营管理</h1>
    <div class="systems">
      <a class="system" href="./before/index.html" aria-label="使用多链前，进入经营报表系统">
        <span class="label">使用多链前</span>
        <span class="system-icon report-icon" aria-hidden="true"></span>
        <h2>经营报表系统</h2>
        <p class="description">9月与10月管理利润表</p>
        <span class="enter">进入系统</span>
      </a>
      <a class="system dolink" href="./after/index.html" aria-label="使用多链后，进入好美味餐饮集团智能决策平台">
        <span class="label">使用多链后</span>
        <span class="system-icon network-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <h2>好美味餐饮集团<br>智能决策平台</h2>
        <p class="description">10月利润归因 · 11月经营预测 · 执行跟进</p>
        <span class="enter">进入系统</span>
      </a>
    </div>
  </main>
</body>
</html>
