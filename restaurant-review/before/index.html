  <div class="toast" id="toast" role="status"></div>
  <script>/* 好美味餐饮集团：用于产品演示的合成业务模型。金额：万元；采购价格：元/公斤。 */
(function (root) {
  'use strict';

  const SCALE = 1000000; // 万元保留至分，所有加总在金额最小单位上分配。
  const money = n => Math.round(n * SCALE) / SCALE;
  const sum = values => money(values.reduce((a, b) => a + b, 0));
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
  const expenseKeys = ['food', 'labor', 'rent', 'utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'];
  const labels = { revenue: '折后营业额', food: '食材成本', labor: '人工费用', rent: '租金及物业费', utilities: '能耗费用', tableware: '餐具', consumables: '物耗', maintenance: '维修维护费', marketing: '市场推广费', otherStoreExpense: '其他费用', profit: '门店经营利润' };
  function allocate(total, weights, scale = SCALE) {
    const units = Math.round(total * scale);
    const denominator = weights.reduce((a, b) => a + b, 0);
    const exact = weights.map(w => units * w / denominator);
    const result = exact.map(Math.floor);
    let left = units - result.reduce((a, b) => a + b, 0);
    const order = exact.map((v, i) => ({ i, fraction: v - result[i] })).sort((a, b) => b.fraction - a.fraction || a.i - b.i);
    for (let i = 0; i < left; i++) result[order[i].i]++;
    return result.map(n => n / scale);
  }
  function complete(row) {
    const result = { ...row };
    result.expenses = sum(expenseKeys.map(k => result[k] || 0));
    result.grossProfit = money(result.revenue - result.food);
    result.operatingExpenses = money(result.expenses - result.food);
    result.otherExRent = sum(['utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'].map(k => result[k] || 0));
    result.other = money(result.otherExRent + result.rent);
    result.profit = money(result.revenue - result.expenses);
    result.margin = result.revenue ? result.profit / result.revenue * 100 : 0;
    result.foodRate = result.revenue ? result.food / result.revenue * 100 : 0;
    result.laborRate = result.revenue ? result.labor / result.revenue * 100 : 0;
    result.perCapita = result.guests ? result.revenue * 10000 / result.guests : 0;
    return result;
  }
  function aggregate(rows) {
    const keys = ['revenue', ...expenseKeys, 'grossSales', 'discount', 'guests', 'orders'];
    return complete(Object.fromEntries(keys.map(key => [key, sum(rows.map(row => row[key] || 0))])));
  }
  const locations = [
    ['上海', '华东'], ['杭州', '华东'], ['南京', '华东'], ['苏州', '华东'],
    ['北京', '华北'], ['天津', '华北'], ['济南', '华北'], ['青岛', '华北'],
    ['广州', '华南'], ['深圳', '华南'], ['佛山', '华南'], ['东莞', '华南']
  ];
  const storeBases = Array.from({ length: 120 }, (_, i) => {
    const [city, region] = locations[Math.floor(i / 10)];
    return { id: `HMW-${String(i + 1).padStart(3, '0')}`, name: `${city}${String(i % 10 + 1).padStart(2, '0')}店`, city, region,
      manager: `${city}${i % 10 + 1}店店长`, format: i % 4 === 0 ? '社区店' : '商场店', seats: 96 + (i * 17 % 8) * 12,
      weight: 80 + (i * 37 % 61), demandWeight: (80 + (i * 37 % 61)) * (0.95 + (i * 7 % 11) / 100),
      staffingWeight: (80 + (i * 37 % 61)) * (0.94 + (i * 13 % 17) / 100),
      promoWeight: (80 + (i * 37 % 61)) * (0.92 + (i * 11 % 17) / 100) };
  });
  const weights = key => storeBases.map(s => s[key] || s.weight);
  const ingredientWeights = index => storeBases.map((s, i) => s.weight * (0.8 + (i * (index + 3) + index * 7) % 41 / 100));
  const distribute = (total, key = 'weight') => allocate(total, weights(key));
  const septemberInputs = { revenue: 4000, food: 1400, labor: 1000, rent: 600, utilities: 120, tableware: 32, consumables: 48, maintenance: 40, marketing: 100, otherStoreExpense: 260, grossSales: 4200, guests: 480000, orders: 200000 };
  const septemberColumns = Object.fromEntries(Object.entries(septemberInputs).map(([k, v]) => [k, allocate(v, weights('weight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const volumeColumns = Object.fromEntries(Object.entries({ revenue: 1200, food: 420, labor: 200, utilities: 24, tableware: 6.4, consumables: 9.6, maintenance: 4, marketing: 20, otherStoreExpense: 16, grossSales: 1260, guests: 144000, orders: 60000 }).map(([k, v]) => [k, allocate(v, weights('demandWeight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const priceDiscount = distribute(400, 'promoWeight');
  const laborExcess = distribute(120, 'staffingWeight');
  const usageExcess = allocate(20, ingredientWeights(12));
  const opexExcessTotals = { utilities: 30, tableware: 0, consumables: 9.6, maintenance: 4, marketing: 33.6, otherStoreExpense: 40.8 };
  const opexExcessColumns = Object.fromEntries(Object.entries(opexExcessTotals).map(([k, total], i) => [k, allocate(total, ingredientWeights(i + 15))]));

  const materialSpecs = [
    { id: 'chicken', name: '鸡肉', dish: '招牌香煎鸡腿', kg: 100000, basePrice: 18, actualPrice: 19.5, reason: '原料市场价上行；月度到货价较9月基准上涨1.50元/公斤。', evidence: '10月验收入库100,000公斤，采购发票加权价19.50元/公斤；9月同等级同规格18.00元/公斤。' },
    { id: 'beef', name: '牛肉', dish: '黑椒牛肉粒', kg: 50000, basePrice: 60, actualPrice: 64, reason: '同等级冷鲜牛肉到货价上升，既有月度合约未覆盖全部需求。', evidence: '10月同规格验收50,000公斤，实际64.00元/公斤，对比9月60.00元/公斤。' },

    { id: 'cheese', name: '芝士', dish: '芝士焗鸡肉饭', forecastServings: 50000, standardKg: 0.1, basePrice: 40, spotPrice: 56, netSellingPrice: 32, standardDishCost: 12, replacedDishCost: 10.4, reason: '新品预估5万份，仅锁定5,000公斤试销配额；实际10万份，追加5,000公斤按现货价采购。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'hairtail', name: '带鱼', dish: '香酥带鱼', forecastServings: 40000, standardKg: 0.25, basePrice: 24, spotPrice: 30, netSellingPrice: 48, standardDishCost: 12, replacedDishCost: 10.5, reason: '新品预估4万份，锁定10,000公斤试销配额；实际8万份，超量现货采购10,000公斤。', minimumCommitmentKg: 20000, quoteDeadline: '10月05日' },

document.querySelector('.brand').removeAttribute('data-step');document.querySelector('.brand').setAttribute('aria-label','经营报表系统首页');
document.querySelector('.nav-label').textContent='报表目录';
document.querySelector('.sidebar-chain')?.remove();document.querySelector('.sidebar-foot')?.remove();
$('#systemName').textContent='仪表板';$('#breadcrumb').textContent='经营看板';
$('#navigation').innerHTML='<button class="active">▦ <span>经营看板</span></button>';
document.body.classList.add('overview-page','report-dashboard');document.title='好美味餐饮集团经营看板 · 经营报表系统';
document.addEventListener('click',event=>{
  const card=event.target.closest('[data-metric]');if(card){reportState.metric=card.dataset.metric;render();$('#reportTrend').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}
  const month=event.target.closest('[data-report-month]');if(month){const top=scrollY;selectMonth(month.dataset.reportMonth);window.scrollTo(0,top);return;}
  const mode=event.target.closest('[data-trend-mode]');if(mode){const open=$('.report-trend-table').open;reportState.trendMode=mode.dataset.trendMode;$('#reportTrend').innerHTML=renderTrend();$('.report-trend-table').open=open;return;}
  if(event.target.closest('[data-action="meeting"]')){document.body.classList.toggle('meeting-mode');render();window.scrollTo(0,0);}
});
document.addEventListener('change',event=>{if(event.target.id==='reportMonth')selectMonth(event.target.value);});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#detailDialog').open){document.body.classList.remove('meeting-mode');render();}if(['Enter',' '].includes(event.key)&&event.target.matches('g[data-report-month]')){event.preventDefault();const top=scrollY;selectMonth(event.target.dataset.reportMonth);window.scrollTo(0,top);}});
$('#methodButton').textContent='查看利润表';$('#methodButton').setAttribute('aria-label','查看当前月份管理利润表');$('#methodButton').onclick=statement;
$('#closeDialog').onclick=()=>$('#detailDialog').close();
$('#fullscreenButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
render();
</script>
