  `<div class="two-col"><div>${panel('试点计划与实际对照',`<table class="task-table"><thead><tr><th>门店范围</th><th>净营收 / 万元</th><th>经营利润 / 万元</th><th>状态</th></tr></thead><tbody><tr class="store-row selected" data-action="exception"><td>滨江店 · S007<small>本期重点核查</small></td><td>${money(one.revenue,2)}<small>计划 ${money(one.planRevenue,2)}</small></td><td class="negative">${money(one.profit,4)}<small>计划 ${money(one.planProfit,4)}</small></td><td><span class="tag amber">${state.adjusted?'动作已改 / 待复核':'利润偏差'}</span></td></tr><tr><td>其余19家合计<small>查看门店清单可逐店核对</small></td><td>${money(r.revenue-one.revenue,2)}</td><td>${money(r.profit-one.profit,2)}</td><td><span class="tag green">计划内</span></td></tr><tr><td><b>20家合计</b></td><td><b>${money(r.revenue,2)}</b></td><td><b>${money(r.profit,2)}</b></td><td><button class="link-button" data-action="reviewDetail">查看勾稽</button></td></tr></tbody></table>`,`<small>1家待闭环</small>`)}
  ${panel('滨江店 · 分时客流与临时工时',`<div class="panel-body"><div class="chart-legend"><span><i style="background:#ccdaf4"></i>计划客流</span><span><i style="background:#4e7edd"></i>实际客流</span><span><i style="background:#d1a15d"></i>实际临时工时</span></div>${reviewChart()}<p class="note">示例分时窗口汇总，非全店整周客流；实际临时工时合计76小时，与原排班一致。午后低峰客流下降，班次未同步调整。</p></div>`,`<span class="tag amber">${state.adjusted?'下周班次已调整':'午后低峰待调整'}</span>`)}</div>
  <div>${panel('偏差定位 · 滨江店 S007',`<div class="panel-body"><div class="store-heading"><div class="store-identity"><span>店</span><div><h3>销量低于预测，用工未联动</h3><p>运营与店长已核查原排班记录</p></div></div></div><div class="mini-kpis"><div><label>完成订单数</label><b>800<span style="font-size:11px;font-weight:400">单</span></b><small>计划1,000单 · −20%</small></div><div><label>临时用工</label><b>76<span style="font-size:11px;font-weight:400">小时</span></b><small>与原排班一致</small></div><div><label>利润偏差</label><b class="negative">−${money(one.planProfit-one.profit,4)}<span style="font-size:11px;font-weight:400">万</span></b><small>费用未超上限，利润仍偏低</small></div></div><div class="review-bridge"><span>计划利润 ${money(one.planProfit,4)}万</span><em>−</em><span>标准销量贡献 ${money(Math.abs(r.salesProfitImpact),4)}万</span><em>−</em><span>工时未联动 ${money(r.excessLaborCost,4)}万</span><em>=</em><span>实际 ${money(one.profit,4)}万</span></div><p class="note">临时人工未超原排班。按销量下调工时的测算基准为60.8小时，仍用76小时，多出的15.2小时×25元＝0.038万元，已包含在上述差额中。</p><div class="recommendation" style="margin-top:18px"><h3>智能建议 · 核查低峰时段临时班次</h3><p>${state.adjusted?'下周临时工时合计由76小时调整为60小时：低峰36→20小时，高峰40小时保留。计划少排16小时，按25元/小时，预计可少支出0.04万元；实际费用与出餐效果待下次复核。':'结合分时客流与服务要求，调整可取消的低峰临时班次；保留晚高峰配置，避免影响出餐与客诉。'}</p>${state.adjusted?'<div class="status-line" style="margin-top:13px"><i></i>排班计划已调整 · 执行效果待复核</div>':'<button class="button primary" data-action="adjust">登记已核实的排班调整</button>'}</div><p class="note" style="margin-top:14px">责任人：运营总监 / 滨江店店长<br>下次复核：11月19日 · 人工费用、出餐P90、有效客诉率</p></div>`,`<span class="tag ${state.adjusted?'blue':'amber'}">${state.adjusted?'效果待复核':'待处理'}</span>`)}</div></div>`+
  insight('服务指标达标，利润与单店偏差仍需复核',`实际利润率 ${money(r.profit/r.revenue*100,2)}%，低于4.5%扩大阈值；滨江店执行效果待核验，暂不扩大。`);
}
const renders={overview:renderOverview,preflight:renderPreflight,attribution:renderAttribution,plans:renderPlans,pilot:renderPilot,review:renderReview};
function render(){
  const current=steps[state.step];
  document.body.classList.toggle('overview-page',current.view==='overview');
  if(current.view!=='overview')document.body.classList.remove('meeting-mode');
  $('#navigation').innerHTML=navs.map(n=>`<button data-step="${n[1]}" class="${current.view===n[0]?'active':''}">${icon(n[0])}<span>${n[2]}</span></button>`).join('');
  $('#breadcrumb').textContent=viewNames[current.view];
  $('#main').innerHTML=renders[current.view]();$('#main').classList.remove('fade-in');void $('#main').offsetWidth;$('#main').classList.add('fade-in');
  document.title=`${viewNames[current.view]} · ${systemName}`;
}
function go(step){
  state.step=isLegacy ? 0 : (step>=2&&step<=10 ? step : initialStep);
  if(state.step===6||state.step===7||state.step===8){state.volumeFactor=.8;state.actualQuotes=true;}
  if(state.step===8){state.confirmed=true;}
  if(state.step===10){state.adjusted=true;}
  render();window.scrollTo({top:0,behavior:'instant'});if(state.step===5)document.querySelector('.condition-grid').scrollIntoView({block:'center',behavior:'instant'});if(state.step===10)document.querySelector('.recommendation').scrollIntoView({block:'center',behavior:'instant'});
}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
function dialog(title,html,eyebrow='数据口径'){$('#dialogTitle').textContent=title;$('#dialogEyebrow').textContent=eyebrow;$('#dialogContent').innerHTML=html;$('#detailDialog').showModal();}
function statement(){
 const rows=M.managementStatement();
 dialog('9—10月管理利润表',`<table><thead><tr><th>项目 / 万元</th><th>9月</th><th>10月</th><th>变化</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row.label}</td><td>${row.previous==null?'—':money(row.previous,2)}</td><td>${row.current==null?'—':money(row.current,2)}</td><td>${row.previous==null||row.current==null?'—':signed(row.current-row.previous,2)}</td></tr>`).join('')}</tbody></table><p>折后营业额为不含税口径，收入占比以折后营业额为分母。门店经营利润不含总部费用分摊、利息及所得税。</p>`);
}
function method(){
 if(isLegacy){statement();return;}
 dialog('数据口径与测算边界',`<h3>实际损益与利润归因</h3><p>100家持续营业可比门店，不含新开、闭店或停业门店。统一不含税、权责发生制口径。净营收已扣商家折让与退款；经营利润＝净营收−食材耗用−人工−其他经营费用。其他费用含租金、能耗和门店折旧，不含利息与所得税。</p><div class="formula">4,000 → 4,800万元（+20%）；400 → 120万元（−70%）<br>400 + ${M.bridge.map(r=>`(${signed(r.value)})`).join(' + ')} = 120万元</div><p>差异桥顺序：销量→促销→销售结构→采购价格→食材耗用→人工→其他费用。差异桥按固定顺序逐项计算。促销降价只在净营收中计一次；历史采购与耗用以固定顺序分解；未来方案按不同品类清单计算采购与耗用收益，避免重复。</p><h3>11月情景预测</h3><p>按30天单独编制，排除将国庆客流直接外推。两案采用同样的净营收、相同销售组合与同口径经营费用，仅采购、耗用和可调临时人工不同。销量系数作用于100家门店全盘销量，净单价与菜品结构保持不变，故净营收随销量同比例变化。取实报价时，目标价未达到的部分仅按已有报价计入，尚未谈成的额外降幅不计收益；品质、规格与交付标准保持一致。</p><h3>20店一周试点</h3><p>11月5—11日，逐店一周预算与班次汇总；独立预算，不能将100店月度方案按20%再按7/30机械分摊。审批采用“实报价＋销量80%”版本。费用上限包含新增执行费，新增执行费不再次相加。试点期与前一可比7日的利润率只作观察比较，不认定为干预净效应。</p><h3>服务指标与闭环</h3><p>出餐P90为堂食订单从下单到最后一道热菜的时长，第90百分位，采用合并订单口径，不对各店P90取平均。有效客诉率＝去重有效客诉订单数÷完成订单数。无单店未闭环偏差才评估扩大。排班调整只记录计划与预计费用，不提前记为实现收益。</p><button class="button" data-action="statement">查看损益明细</button>`);
}
function planDetail(){const f=M.forecast(state);dialog('经营方案的计算与执行条件',`<p>当前销量系数 ${money(state.volumeFactor*100)}%，采购${state.actualQuotes?'采用已取得报价':'按目标价测算'}。所有金额单位为万元。</p><div class="formula">${M.forecastExplanation||''}</div><table><thead><tr><th>损益项目</th><th>营销方案</th><th>联动方案</th></tr></thead><tbody>${[['净营收',f.revenue,f.revenue],['食材成本',f.marketing.food,f.joint.food],['人工费用',f.marketing.labor,f.joint.labor],['其他经营费用',f.marketing.other,f.joint.other],['经营利润',f.marketing.profit,f.joint.profit]].map(r=>`<tr><td>${r[0]}</td><td>${money(r[1],2)}</td><td>${money(r[2],2)}</td></tr>`).join('')}</tbody></table><h3>与10月实际的差异</h3><p>11月基准另含营销与销售组合调整、国庆后用工和费用回归。利润由10月120万元变为本方案500万元，并非都由联动动作产生；两案之间的100万元差额才对应采购、耗用与用工三项动作（实报价后为88万元）。共同经营费用均已计入。</p><h3>采购报价与数量边界</h3><p>${M.quoteExplanation||''}</p><table><thead><tr><th>食材</th><th>原合同 / 元每公斤</th><th>目标价</th><th>已报价</th><th>报价进展</th></tr></thead><tbody>${M.quoteLines.map(q=>`<tr><td>${q.item}</td><td>${q.currentPrice}</td><td>${q.targetPrice}</td><td>${q.quotedPrice}</td><td>${q.quotedPrice<=q.targetPrice?'已达目标价':'已有报价 / 目标仍在谈'}</td></tr>`).join('')}</tbody></table><h3>收益确认顺序</h3><p>按已报价数量确认采购节约；耗用节约来自另一组已确认品类清单，和采购优化范围互斥；人工只算可取消的临时班次。预测收益需通过销量、出品与排班的实际执行核验。</p>`);}
function storeList(){const rows=M.pilot.stores;dialog('20家试点门店 · 一周独立预算',`<p>金额单位：万元。</p><table><thead><tr><th>门店</th><th>净营收计划</th><th>经营利润计划</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id} · ${r.name}</td><td>${money(r.revenue,2)}</td><td>${money(r.profit,2)}</td></tr>`).join('')}<tr><td>合计</td><td>${money(M.pilot.revenue,2)}</td><td>${money(M.pilot.profit,2)}</td></tr></tbody></table>`);}
function reviewDetail(){const r=M.review,p=M.pilot;dialog('一周试点实际损益与服务口径',`<table><thead><tr><th>项目 / 万元</th><th>计划</th><th>实际</th></tr></thead><tbody>${[['净营收','revenue'],['食材成本','food'],['人工费用','labor'],['其他经营费用','other'],['经营利润','profit']].map(([l,k])=>`<tr><td>${l}</td><td>${money(p[k],2)}</td><td>${money(r[k],2)}</td></tr>`).join('')}</tbody></table><h3>滨江店偏差闭环</h3><p>完成订单计划1,000单、实际800单，单均净收入100元。在人工可随销量调整的基准下，每单标准变动成本52.24元，少200单的贡献损失＝200×（100−52.24）÷10,000＝0.9552万元。临时工时按销量测算应从76降至60.8小时，实际仍为76小时，相对该基准多15.2小时×25元＝0.038万元。两项合计利润少0.9932万元，计划0.4760→实际−0.5172万元。0.038万元已在差异中计入一次。</p><h3>服务护栏</h3><p>20店完成订单 ${money(r.orders)} 单；去重有效客诉 ${r.complaints} 单；客诉率 ${money(r.complaints/r.orders*100,2)}%。堂食出餐P90为 ${money(r.p90,1)} 分钟，采用合并堂食订单口径，不对各店P90取平均。利润率 ${money(r.profit/r.revenue*100,2)}%，与同口径前7日4.0%的观察基线对照，不能直接认定为方案净收益。</p><h3>下一轮</h3><p>11月19日核对实际临时人工费用、出餐P90与客诉率。临时工时合计从76小时调整为60小时（低峰36→20，高峰40小时不变），25元/小时，预计少支出0.04万元，尚未计入本次实际利润。</p>`);}
document.addEventListener('click',event=>{
  const jump=event.target.closest('[data-step]');if(jump){event.preventDefault();go(Number(jump.dataset.step));return;}
  const row=event.target.closest('[data-bridge]');if(row){const r=M.bridge.find(item=>item.id===row.dataset.bridge);dialog(`${r.label} · 利润影响${signed(r.value)}万元`,`<span class="tag green">${r.owner} · 已复核</span><h3>计算口径</h3><div class="formula">${r.formula}</div><h3>复核说明</h3><p>${r.detail}</p><h3>复核边界</h3><p>此处解释历史利润变化。可优化空间需要结合报价、库存、服务与执行条件重新测算，不能将历史不利影响直接当成可追回金额。</p>`);return;}
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='meeting'){document.body.classList.toggle('meeting-mode');render();window.scrollTo(0,0);}
  if(action==='method')method();
  if(action==='statement'){if($('#detailDialog').open)$('#detailDialog').close();statement();}
  if(action==='planDetail')planDetail();
  if(action==='stress'){state.volumeFactor=.8;state.actualQuotes=true;render();toast('已按实报价与80%全盘销量重算两套方案');}
  if(action==='pilot')go(7);
  if(action==='confirm'){state.confirmed=true;go(8);toast('试点计划已确认，执行任务已建立');}
  if(action==='stores')storeList();
  if(action==='reviewDetail'||action==='exception')reviewDetail();
  if(action==='adjust'){state.adjusted=true;go(10);toast('排班计划已调整；执行效果待11月19日复核');}
});
document.addEventListener('change',event=>{if(event.target.id==='quoteInput'){state.actualQuotes=event.target.checked;render();}if(event.target.id==='volumeInput'){state.volumeFactor=Number(event.target.value)/100;render();}});
document.addEventListener('input',event=>{if(event.target.id==='volumeInput')event.target.nextElementSibling.value=`${event.target.value}%`;});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.body.classList.contains('meeting-mode')&&!$('#detailDialog').open){document.body.classList.remove('meeting-mode');render();return;}if($('#detailDialog').open||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;if(event.key==='Enter'&&event.target.dataset.bridge)event.target.click();});
$('#methodButton').addEventListener('click',method);$('#closeDialog').addEventListener('click',()=>$('#detailDialog').close());
$('#detailDialog').addEventListener('click',event=>{if(event.target===$('#detailDialog')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.target.close();}});
$('#fullscreenButton').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('当前浏览器不支持全屏，可在独立浏览器中打开');}});
document.body.classList.add(isLegacy ? 'legacy-system' : 'dolink-system');
$('#systemName').textContent=systemName;
const brand=document.querySelector('.brand');
brand.dataset.step=String(initialStep);
brand.setAttribute('aria-label',`${systemName}首页`);
if(isLegacy){
  brand.innerHTML=`<span class="legacy-mark">${icon('overview')}</span><span><b>经营报表</b><small>集团财务系统</small></span>`;
  document.querySelector('.nav-label').textContent='报表目录';
  $('#systemName').textContent='电子表格';
  document.querySelector('.sidebar-chain').remove();
}
render();
</script>
</body>
</html>
