      <header class="topbar"><div class="breadcrumb"><span id="systemName">经营报表系统</span><span>/</span><b id="breadcrumb">管理利润表</b></div><div class="top-actions"><button class="icon-button" id="methodButton" aria-label="查看数据口径">数据口径</button><button class="icon-button" id="fullscreenButton" aria-label="进入全屏展示">全屏展示</button></div></header>

  <dialog id="detailDialog"><header><div><small id="dialogEyebrow"></small><h2 id="dialogTitle"></h2></div><button class="icon-button" id="closeDialog" aria-label="关闭详情">✕</button></header><div id="dialogContent"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>/* 好美味餐饮集团：用于产品演示的合成业务模型。金额：万元；采购价格：元/公斤。 */
(function (root) {
  'use strict';

  const SCALE = 1000000; // 万元保留至分，所有加总在金额最小单位上分配。
  const DATA_VERSION = 'DEMO-COST-FOCUS-V3';
  const FORECAST_VERSION = 'NOV-COST-FOCUS-V2';
  const money = n => Math.round(n * SCALE) / SCALE;
  const sum = values => money(values.reduce((a, b) => a + b, 0));
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
  const expenseKeys = ['food', 'labor', 'rent', 'utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'];
  const labels = { revenue: '折后营业额', food: '食材成本', labor: '人工费用', rent: '租金及物业费', utilities: '能耗费用', tableware: '餐具', consumables: '物耗', maintenance: '维修维护费', marketing: '市场推广费', otherStoreExpense: '其他费用', profit: '门店经营利润' };
  function allocate(total, weights, scale = SCALE) {
    const units = Math.round(total * scale);
    const denominator = weights.reduce((a, b) => a + b, 0);
    const exact = weights.map(w => units * w / denominator);
    const result = exact.map(Math.floor);
    let left = units - result.reduce((a, b) => a + b, 0);
    const order = exact.map((v, i) => ({ i, fraction: v - result[i] })).sort((a, b) => b.fraction - a.fraction || a.i - b.i);
    for (let i = 0; i < left; i++) result[order[i].i]++;
    return result.map(n => n / scale);
  }
  function complete(row) {
    const result = { ...row };
    result.expenses = sum(expenseKeys.map(k => result[k] || 0));
    result.grossProfit = money(result.revenue - result.food);
    result.operatingExpenses = money(result.expenses - result.food);
    result.otherExRent = sum(['utilities', 'tableware', 'consumables', 'maintenance', 'marketing', 'otherStoreExpense'].map(k => result[k] || 0));
    result.other = money(result.otherExRent + result.rent);
    result.profit = money(result.revenue - result.expenses);
    result.margin = result.revenue ? result.profit / result.revenue * 100 : 0;
    result.foodRate = result.revenue ? result.food / result.revenue * 100 : 0;
    result.laborRate = result.revenue ? result.labor / result.revenue * 100 : 0;
    result.perCapita = result.guests ? result.revenue * 10000 / result.guests : 0;
    return result;
  }
  function aggregate(rows) {
    const keys = ['revenue', ...expenseKeys, 'grossSales', 'discount', 'guests', 'orders'];
    return complete(Object.fromEntries(keys.map(key => [key, sum(rows.map(row => row[key] || 0))])));
  }
  const locations = [
    ['上海', '华东'], ['杭州', '华东'], ['南京', '华东'], ['苏州', '华东'],
    ['北京', '华北'], ['天津', '华北'], ['济南', '华北'], ['青岛', '华北'],
    ['广州', '华南'], ['深圳', '华南'], ['佛山', '华南'], ['东莞', '华南']
  ];
  const storeBases = Array.from({ length: 120 }, (_, i) => {
    const [city, region] = locations[Math.floor(i / 10)];
    return { id: `HMW-${String(i + 1).padStart(3, '0')}`, name: `${city}${String(i % 10 + 1).padStart(2, '0')}店`, city, region,
      manager: `${city}${i % 10 + 1}店店长`, format: i % 4 === 0 ? '社区店' : '商场店', seats: 96 + (i * 17 % 8) * 12,
      weight: 80 + (i * 37 % 61), demandWeight: (80 + (i * 37 % 61)) * (0.95 + (i * 7 % 11) / 100),
      staffingWeight: (80 + (i * 37 % 61)) * (0.94 + (i * 13 % 17) / 100),
      promoWeight: (80 + (i * 37 % 61)) * (0.92 + (i * 11 % 17) / 100) };
  });
  const weights = key => storeBases.map(s => s[key] || s.weight);
  const ingredientWeights = index => storeBases.map((s, i) => s.weight * (0.8 + (i * (index + 3) + index * 7) % 41 / 100));
  const distribute = (total, key = 'weight') => allocate(total, weights(key));
  const septemberInputs = { revenue: 4000, food: 1400, labor: 1000, rent: 600, utilities: 120, tableware: 32, consumables: 48, maintenance: 40, marketing: 100, otherStoreExpense: 260, grossSales: 4200, guests: 480000, orders: 200000 };
  const septemberColumns = Object.fromEntries(Object.entries(septemberInputs).map(([k, v]) => [k, allocate(v, weights('weight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const volumeColumns = Object.fromEntries(Object.entries({ revenue: 200, food: 70, labor: 30, utilities: 6, tableware: 1.6, consumables: 2.4, maintenance: 2, marketing: 5, otherStoreExpense: 13, grossSales: 210, guests: 24000, orders: 10000 }).map(([k, v]) => [k, allocate(v, weights('demandWeight'), ['guests', 'orders'].includes(k) ? 1 : SCALE)]));
  const priceDiscount = distribute(50, 'promoWeight');
  const laborExcess = distribute(120, 'staffingWeight');
  const usageExcess = allocate(23, ingredientWeights(12));
  const opexExcessTotals = { utilities: 4, tableware: 0, consumables: 2, maintenance: 2, marketing: 7, otherStoreExpense: 25 };
  const opexExcessColumns = Object.fromEntries(Object.entries(opexExcessTotals).map(([k, total], i) => [k, allocate(total, ingredientWeights(i + 15))]));

  const materialSpecs = [
    { id: 'chicken', name: '鸡肉', dish: '招牌香煎鸡腿', kg: 100000, basePrice: 18, actualPrice: 20, reason: '原料市场价上行；月度到货价较9月基准上涨2.00元/公斤。', evidence: '10月验收入库100,000公斤，采购发票加权价20.00元/公斤；9月同等级同规格18.00元/公斤。' },
    { id: 'beef', name: '牛肉', dish: '黑椒牛肉粒', kg: 50000, basePrice: 60, actualPrice: 66, reason: '同等级冷鲜牛肉到货价上升，既有月度合约未覆盖全部需求。', evidence: '10月同规格验收50,000公斤，实际66.00元/公斤，对比9月60.00元/公斤。' },
    { id: 'pork', name: '五花肉', dish: '砂锅红烧肉', kg: 50000, basePrice: 28, actualPrice: 30, reason: '同部位规格采购价上涨2.00元/公斤。', evidence: '10月验收50,000公斤，实际30.00元/公斤，对比9月28.00元/公斤。' },
    { id: 'cheese', name: '芝士', dish: '芝士焗鸡肉饭', forecastServings: 50000, standardKg: 0.1, basePrice: 40, spotPrice: 56, netSellingPrice: 32, reason: '新品预估5万份，仅锁定5,000公斤试销配额；实际10万份，追加5,000公斤按现货价采购。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'hairtail', name: '带鱼', dish: '香酥带鱼', forecastServings: 40000, standardKg: 0.25, basePrice: 24, spotPrice: 30, netSellingPrice: 48, reason: '新品预估4万份，锁定10,000公斤试销配额；实际8万份，超量现货采购10,000公斤。', minimumCommitmentKg: 20000, quoteDeadline: '10月05日' },
    { id: 'crab', name: '螃蟹', dish: '蟹肉豆腐煲', forecastServings: 25000, standardKg: 0.2, basePrice: 45, spotPrice: 55, netSellingPrice: 58, reason: '新品预估2.5万份，锁定5,000公斤试销配额；实际5万份，追加5,000公斤未签整月合约。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'pigeon', name: '鸽子', dish: '脆皮乳鸽拼盘', forecastServings: 20000, standardKg: 0.25, basePrice: 40, spotPrice: 48, netSellingPrice: 48, reason: '新品预估2万份，锁定5,000公斤试销配额；实际4万份，追加5,000公斤按临采价结算。', minimumCommitmentKg: 10000, quoteDeadline: '10月05日' },
    { id: 'fishball', name: '鱼丸', dish: '鲜汤鱼丸煲', forecastServings: 50000, standardKg: 0.2, basePrice: 16, spotPrice: 18, netSellingPrice: 28, reason: '新品预估5万份，锁定10,000公斤试销配额；实际10万份，新增10,000公斤未进入首单配额。', minimumCommitmentKg: 20000, quoteDeadline: '10月05日' }
  ];
  const materials = materialSpecs.map((spec, materialIndex) => {
    const newProduct = Boolean(spec.forecastServings);
    const portions = newProduct ? allocate(spec.forecastServings, ingredientWeights(materialIndex), 1) : null;
    const quantities = newProduct ? null : allocate(spec.kg, ingredientWeights(materialIndex), 1);
    const storeRows = storeBases.map((store, i) => {
      const forecastServings = newProduct ? portions[i] : 0;
      const actualServings = forecastServings * 2;
      const lockedKg = newProduct ? forecastServings * spec.standardKg : 0;
      const purchaseKg = newProduct ? actualServings * spec.standardKg : quantities[i];
      const spotKg = newProduct ? purchaseKg - lockedKg : 0;
      const actualPrice = newProduct ? (spec.basePrice + spec.spotPrice) / 2 : spec.actualPrice;
      const priceImpact = money(-(newProduct ? spotKg * (spec.spotPrice - spec.basePrice) : purchaseKg * (actualPrice - spec.basePrice)) / 10000);
      return { storeId: store.id, storeName: store.name, region: store.region, forecastServings, actualServings, purchaseKg: money(purchaseKg), standardKg: spec.standardKg || null,
        lockedKg: money(lockedKg), spotKg: money(spotKg), basePrice: spec.basePrice, actualPrice, impact: priceImpact, priceImpact,
        actualPurchaseAmount: money(purchaseKg * actualPrice / 10000), referencePurchaseAmount: money(purchaseKg * spec.basePrice / 10000) };
    });
    const forecastServings = newProduct ? spec.forecastServings : 0;
    const actualServings = forecastServings * 2;
    const purchaseKg = newProduct ? actualServings * spec.standardKg : spec.kg;
    const actualPrice = newProduct ? (spec.basePrice + spec.spotPrice) / 2 : spec.actualPrice;
    return { ...spec, newProduct, unit: '公斤', quantity: purchaseKg, quantityKg: purchaseKg, purchaseKg, forecastServings, actualServings, forecastQuantity: forecastServings, actualQuantity: actualServings, standardUsageKg: purchaseKg, baselinePrice: spec.basePrice, scene: spec.reason,
      lockedKg: newProduct ? purchaseKg / 2 : 0, spotKg: newProduct ? purchaseKg / 2 : 0, actualPrice,
      impact: sum(storeRows.map(row => row.priceImpact)), priceImpact: sum(storeRows.map(row => row.priceImpact)),
      actualPurchaseAmount: sum(storeRows.map(row => row.actualPurchaseAmount)), referencePurchaseAmount: sum(storeRows.map(row => row.referencePurchaseAmount)),
      evidence: spec.evidence || `首单试销配额${purchaseKg / 2}公斤，实际标准用量${purchaseKg}公斤；首单配额结算价${spec.basePrice}元/公斤（与9月该原料同规格发票基准价相同），超量现货价${spec.spotPrice}元/公斤，加权价${actualPrice}元/公斤。`,
      formula: newProduct ? '超出锁价量的采购公斤 ×（现货结算价－原锁量价）÷10,000' : '同规格实际采购公斤 ×（10月加权价－9月基准价）÷10,000',
      procurementNote: newProduct ? `首单${purchaseKg / 2}公斤为供应商限量试销配额，沿用9月同规格结算价，并非正式整月批量合约。正式整月采购需在${spec.quoteDeadline}前承诺${spec.minimumCommitmentKg}公斤；原预估不足以承诺，该门槛未落实，追加部分按现货价结算。归因只计已结算价差，不叠加未签意向报价。` : '只比较同品级同规格实际发票价，不把不同等级混在价格差中。',
      storeRows };
  });
  const procurementByStore = storeBases.map((_, i) => sum(materials.map(m => m.storeRows[i].priceImpact)));
  const stores = storeBases.map((base, i) => {
    const september = complete(Object.fromEntries(Object.entries(septemberColumns).map(([k, values]) => [k, values[i]])));
    september.discount = money(september.grossSales - september.revenue);
    const octoberRow = { ...september };
    for (const [key, values] of Object.entries(volumeColumns)) octoberRow[key] = money(octoberRow[key] + values[i]);
    octoberRow.revenue = money(octoberRow.revenue - priceDiscount[i]);
    octoberRow.food = money(octoberRow.food - procurementByStore[i] + usageExcess[i]);
    octoberRow.labor = money(octoberRow.labor + laborExcess[i]);
    for (const [key, values] of Object.entries(opexExcessColumns)) octoberRow[key] = money(octoberRow[key] + values[i]);
    octoberRow.discount = money(octoberRow.grossSales - octoberRow.revenue);
    const october = complete(octoberRow);
    return { ...base, storeId: base.id, storeName: base.name, september, october, actuals: { september, october },
      causes: {}, profitChange: money(october.profit - september.profit), capacityGuestsPerDay: base.seats * 2.1 };
  });
  const actuals = { september: aggregate(stores.map(s => s.september)), october: aggregate(stores.map(s => s.october)) };
  // 独立的演示渠道输入；不从既有堂食桌单 orders 反推外卖订单。
  const deliveryCounts = { september: allocate(120000, weights('weight'), 1), october: allocate(126000, weights('demandWeight'), 1) };
  const opexKeys = expenseKeys.filter(k => !['food', 'labor'].includes(k));
  const fixedLabor = allocate(900, weights('weight'));
  const attributionByStore = stores.map((store, i) => {
    const a = store.september, b = store.october;
    const channels = Object.fromEntries(['september', 'october'].map(month => {
      const row = store[month], orders = deliveryCounts[month][i], dineRevenue = money(row.revenue * .8);
      const guests = row.guests - orders; // 演示假设：每个外卖有效订单计1份综合就餐人次。
      return [month, { dineIn: { guests, orders: row.orders, revenue: dineRevenue, unitPrice: dineRevenue * 10000 / guests },
        delivery: { orders, revenue: money(row.revenue - dineRevenue), unitPrice: (row.revenue - dineRevenue) * 10000 / orders } }];
    }));
    const dineRevenue = money(channels.september.dineIn.unitPrice * channels.october.dineIn.guests / 10000);
    const deliveryRevenue = money(channels.september.delivery.unitPrice * channels.october.delivery.orders / 10000);
    const referenceRevenue = sum([dineRevenue, deliveryRevenue]);
    const referenceCosts = Object.fromEntries(expenseKeys.map(k => [k, money(referenceRevenue * a[k] / a.revenue)]));
    const baseline = complete({ ...referenceCosts, revenue: referenceRevenue, grossSales: money(referenceRevenue * a.grossSales / a.revenue),
      discount: money(referenceRevenue * a.discount / a.revenue), guests: b.guests, orders: b.orders });
    channels.baseline = { dineIn: { ...channels.october.dineIn, revenue: dineRevenue, unitPrice: channels.september.dineIn.unitPrice },
      delivery: { ...channels.october.delivery, revenue: deliveryRevenue, unitPrice: channels.september.delivery.unitPrice } };
    const foodStandard = { rateReferenceCost: baseline.food, standardCost: money(a.food + volumeColumns.food[i]),
      priceCost: -procurementByStore[i], excessCost: usageExcess[i], actualCost: b.food };
    foodStandard.alignmentImpact = money(foodStandard.rateReferenceCost - foodStandard.standardCost);
    const standardLaborCost = money(a.labor + volumeColumns.labor[i]);
    const laborStandard = { rateReferenceCost: baseline.labor, fixedCost: fixedLabor[i], standardCost: standardLaborCost, actualCost: b.labor,
      hourlyCost: 30, standardHours: (standardLaborCost - fixedLabor[i]) * 10000 / 30,
      actualHours: (b.labor - fixedLabor[i]) * 10000 / 30,
      structureImpact: money(baseline.labor - standardLaborCost), executionImpact: money(standardLaborCost - b.labor) };
    const factors = { volume: money(baseline.profit - a.profit), pricing: money(b.revenue - baseline.revenue),
      food: money(baseline.food - b.food), procurement: procurementByStore[i], usage: -usageExcess[i],
      'food-standard': foodStandard.alignmentImpact, labor: money(baseline.labor - b.labor),
      opex: sum(opexKeys.map(k => money(baseline[k] - b[k]))) };
    store.causes = factors;
    let row = { ...baseline };
    const steps = [{ id: 'september', label: '9月实际利润', row: a, impact: 0 },
      { id: 'volume', label: '替换堂食人次与外卖订单', row: baseline, impact: factors.volume }];
    function replace(id, label, changes) {
      const next = complete({ ...row, ...changes });
      steps.push({ id, label, row: next, impact: money(next.profit - row.profit) }); row = next;
    }
    replace('pricing', '替换净成交价与销售优惠', { revenue: b.revenue, grossSales: b.grossSales, discount: b.discount });
    replace('food-standard', '衔接实际销量的标准食材成本', { food: foodStandard.standardCost });
    replace('procurement', '替换同规格原料采购价格', { food: money(row.food - factors.procurement) });
    replace('usage', '替换实际耗用与报损', { food: b.food });
    replace('labor', '替换人工结构与实际工时', { labor: b.labor });
    replace('opex', '替换其他实际经营费用', Object.fromEntries(opexKeys.map(k => [k, b[k]])));
    return { storeId: store.id, storeName: store.name, region: store.region, channels, baseline, steps,
      baselineGap: money(baseline.profit - b.profit), foodStandard, laborStandard,
      expenseRows: expenseKeys.map(k => ({ key: k, name: labels[k], septemberRate: a[k] / a.revenue * 100,
        baseline: baseline[k], actual: b[k], impact: money(baseline[k] - b[k]) })) };
  });
  function aggregateChannels(period) {
    const rows = attributionByStore.map(r => r.channels[period]);
    const dineIn = { guests: sum(rows.map(r => r.dineIn.guests)), orders: sum(rows.map(r => r.dineIn.orders)), revenue: sum(rows.map(r => r.dineIn.revenue)) };
    const delivery = { orders: sum(rows.map(r => r.delivery.orders)), revenue: sum(rows.map(r => r.delivery.revenue)) };
    dineIn.unitPrice = dineIn.revenue * 10000 / dineIn.guests; delivery.unitPrice = delivery.revenue * 10000 / delivery.orders;
    return { dineIn, delivery };
  }
  const baselineTotals = aggregate(attributionByStore.map(r => r.baseline));
  const attribution = { version: 'SEP-MODE-V3', baseline: baselineTotals, baselineGap: money(baselineTotals.profit - actuals.october.profit),
    channels: Object.fromEntries(['september', 'october', 'baseline'].map(p => [p, aggregateChannels(p)])), byStore: attributionByStore,
    methodSteps: ['以同一120家门店的9月分渠道实收单价、成本费用率为经营模式基准。',
      '将10月堂食就餐人次、外卖有效订单代入9月单价，逐店计算基准收入，再按9月各项费用率计算基准利润。',
      '固定按业务量、净成交价、标准成本衔接、采购价格、耗用、人工、其他费用顺序连环替代。',
      '固定及半固定成本的费率摊薄作为结构差异解释，不称为实际节约或整改收益；本分解不证明促销导致客流增长。'],
    sourceNote: '渠道拆分为本产品内置演示数据：9月及10月营收按堂食80%、外卖20%拆分，外卖有效订单分别为12万和12.6万；假设每外卖单计1份综合就餐人次。未接入真实POS或外卖平台。',
    expenseRows: expenseKeys.map(k => ({ key: k, name: labels[k], septemberRate: actuals.september[k] / actuals.september.revenue * 100,
      baseline: baselineTotals[k], actual: actuals.october[k], impact: money(baselineTotals[k] - actuals.october[k]) })),
    foodStandard: Object.fromEntries(['rateReferenceCost', 'standardCost', 'priceCost', 'excessCost', 'actualCost', 'alignmentImpact'].map(k => [k, sum(attributionByStore.map(r => r.foodStandard[k]))])),
    laborStandard: { ...Object.fromEntries(['rateReferenceCost', 'fixedCost', 'standardCost', 'actualCost', 'structureImpact', 'executionImpact'].map(k => [k, sum(attributionByStore.map(r => r.laborStandard[k]))])),
      hourlyCost: 30, standardHours: attributionByStore.reduce((s, r) => s + r.laborStandard.standardHours, 0), actualHours: attributionByStore.reduce((s, r) => s + r.laborStandard.actualHours, 0) },
    steps: attributionByStore[0].steps.map((step, i) => ({ id: step.id, label: step.label,
      row: aggregate(attributionByStore.map(r => r.steps[i].row)), impact: sum(attributionByStore.map(r => r.steps[i].impact)) })) };
  const topIds = ['volume', 'pricing', 'food', 'labor', 'opex'];
  const NEGATIVE_TOTAL = -sum(topIds.map(id => sum(stores.map(s => s.causes[id]))).filter(n => n < 0));
  function storeRowsFor(values) {
    return stores.map((s, i) => ({ storeId: s.id, storeName: s.name, region: s.region, impact: money(values[i]), septemberProfit: s.september.profit, octoberProfit: s.october.profit, profitChange: s.profitChange }));
  }
  function cause(id, name, values, reason, evidence, children = [], extras = {}) {
    const impact = sum(values);
    return { id, name, impact, amount: Math.abs(impact), negativeShare: impact < 0 ? -impact / NEGATIVE_TOTAL * 100 : 0,
      netDeclineShare: -impact / (actuals.september.profit - actuals.october.profit) * 100,
      reason, description: reason, evidence, details: evidence, children, storeRows: storeRowsFor(values), ...extras };
  }
  const procurementChildren = materials.map(m => cause(`procurement-${m.id}`, `${m.name}采购价差`, m.storeRows.map(r => r.priceImpact), m.reason, m.evidence, [], { materialId: m.id, material: m, formula: m.formula }));
  const usagePrep = allocate(14, usageExcess);

function metricCard(id){

function scopeLabel(){

function renderFilters(){

function render(){

function renderTrend(){

function trendSvg(width=1000,height=320){
  const rows=trendRows(),values=rows.flatMap(r=>[...(reportState.showCurrent?[r.current]:[]),...(reportState.showPrior?[r.priorYear]:[])]),minimum=Math.min(...values),maximum=Math.max(...values);

  const ticks=Array.from({length:Math.round((hi-lo)/step)+1},(_,i)=>lo+step*i),axisText=amount=>money(amount,share?Math.max(1,decimals):decimals)+(share?'%':'');
  const left=Math.max(52,...ticks.map(amount=>axisText(amount).length*7+14)),right=width-(width<480?16:24),top=32,bottom=height-38;
  const x=i=>rows.length===1?(left+right)/2:left+i*(right-left)/(rows.length-1),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);
  const current=rows.map((r,i)=>`${x(i)},${y(r.current)}`).join(' '),prior=rows.map((r,i)=>`${x(i)},${y(r.priorYear)}`).join(' '),last=rows.length-1,lastValue=reportState.showCurrent?rows[last].current:rows[last].priorYear;
  const labelIndices=new Set([0,last]);let lastLabel=0;
  for(let i=1;i<last;i++)if(x(i)-x(lastLabel)>=42&&x(last)-x(i)>=42){labelIndices.add(i);lastLabel=i;}
  return `<svg class="report-month-chart" viewBox="0 0 ${width} ${height}" data-width="${width}" data-height="${height}" data-plot-left="${left}" data-plot-right="${right}" data-plot-top="${top}" data-plot-bottom="${bottom}" role="img" aria-label="${selectedMetric()[1]}的${year}年1至${rows.at(-1).month}月按月实绩趋势"><text x="8" y="17" class="report-axis-label">${unit}</text>${ticks.map(amount=>`<path d="M${left} ${y(amount)}H${right}" stroke="#e9edf4" stroke-dasharray="3 4"/><text x="${left-12}" y="${y(amount)+4}" text-anchor="end" class="report-axis-label">${axisText(amount)}</text>`).join('')}${reportState.showPrior?`<polyline data-chart-series="prior" points="${prior}" fill="none" stroke="#9baed3" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/>`:''}${reportState.showCurrent?`<polyline data-chart-series="current" points="${current}" fill="none" stroke="#2f6bff" stroke-width="2.5" stroke-linejoin="round"/>`:''}<path id="reportCrosshair" d="M${x(last)} ${top}V${bottom}" stroke="#9db9ee" stroke-dasharray="4 4"/>${rows.map((r,i)=>{const hitLeft=i===0?left-8:(x(i-1)+x(i))/2,hitRight=i===last?right+8:(x(i)+x(i+1))/2;return `<g data-trend-month="${r.id}" data-chart-x="${x(i)}" tabindex="0" role="button" aria-describedby="reportTrendTooltip" aria-label="查看${r.month}月，${year}年${money(r.current,share?2:0)}${unit}，${year-1}年同期${money(r.priorYear,share?2:0)}${unit}"><rect x="${hitLeft}" y="${top}" width="${hitRight-hitLeft}" height="${bottom-top+30}" fill="transparent"/>${reportState.showPrior?`<circle cx="${x(i)}" cy="${y(r.priorYear)}" r="4" fill="white" stroke="#9baed3" stroke-width="1.5"/>`:''}${reportState.showCurrent?`<circle cx="${x(i)}" cy="${y(r.current)}" r="4" fill="#2f6bff" stroke="white" stroke-width="1.5"/>`:''}${labelIndices.has(i)?`<text data-month-label="${r.month}" x="${x(i)}" y="${bottom+25}" text-anchor="middle" class="report-axis-label">${r.month}月</text>`:''}</g>`;}).join('')}<text class="report-last-value" x="${x(last)}" y="${Math.max(top+14,y(lastValue)-13)}" text-anchor="${rows.length===1?'middle':'end'}" style="font-size:13px;font-weight:600;fill:${reportState.showCurrent?'#2f6bff':'#8198be'}">${money(lastValue,share?2:0)}${unit}</text></svg>`;
}
const trendResizeObserver=new ResizeObserver(()=>fitTrendChart());
function fitTrendChart(){
  const wrap=$('.report-chart-wrap'),svg=$('.report-month-chart');if(!wrap||!svg)return;
  const style=getComputedStyle(wrap),width=Math.floor(wrap.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)),height=Math.round(svg.clientHeight);

  if(focusedMonth)document.querySelector(`g[data-trend-month="${focusedMonth}"]`)?.focus({preventScroll:true});
}
function observeTrendChart(){
  trendResizeObserver.disconnect();fitTrendChart();const wrap=$('.report-chart-wrap');if(wrap)trendResizeObserver.observe(wrap);
}
function refreshTrend(){
  $('#reportTrend').innerHTML=renderTrend();observeTrendChart();
}
function chooseMetric(id,scroll=false){
  if(!cardOrder.includes(id))return;reportState.metric=id;
  document.querySelectorAll('.report-card').forEach(card=>{const active=card.dataset.metric===id;card.classList.toggle('active',active);card.querySelector('.report-card-hit').setAttribute('aria-pressed',String(active));card.querySelector('.report-card-selection').textContent=active?'已选择':'';});

function showTrendTooltip(point,event){
  const row=trendRows().find(r=>r.id===point.dataset.trendMonth),year=Number(reportState.month.slice(0,4)),unit=reportState.trendMode==='share'?'%':'万元',tooltip=$('#reportTrendTooltip'),wrap=$('.report-chart-wrap');
  const line=(name,v,dashed)=>`<div class="report-tooltip-row"><i class="${dashed?'dashed':''}"></i><span>${name}</span><strong>${money(v,reportState.trendMode==='share'?2:0)}${unit}</strong></div>`;
  tooltip.innerHTML=`<div class="report-tooltip-title">${row.month}月 · ${selectedMetric()[1]}</div>${reportState.showCurrent?line(year+'年',row.current,false):''}${reportState.showPrior?line((year-1)+'年同期',row.priorYear,true):''}${reportState.showCurrent&&reportState.showPrior?`<div class="report-tooltip-change">${reportState.trendMode==='share'?'同期差额 '+signed(row.current-row.priorYear,2)+'个百分点':'同比 '+changeText(row.priorYear>0?(row.current/row.priorYear-1)*100:null)}</div>`:''}`;

function hideTrendTooltip(){const tooltip=$('#reportTrendTooltip');if(tooltip)tooltip.hidden=true;}
function selectMonth(id){

document.body.classList.add('overview-page','report-dashboard');document.title='好美味餐饮集团经营看板 · 经营报表系统';
document.addEventListener('click',event=>{
